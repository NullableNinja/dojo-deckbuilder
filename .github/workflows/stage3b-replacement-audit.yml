name: Stage 3B replacement Attack audit

on:
  push:
    branches:
      - stage3b-attack-eleven
    paths:
      - scripts/stage3b-replacement-audit.mjs
      - .github/workflows/stage3b-replacement-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: stage3b-attack-eleven
      - name: Print remaining canonical Core Attacks
        run: node scripts/stage3b-replacement-audit.mjs
