name: Temporary canonical rules reconciliation

on:
  push:
    branches:
      - fix/canonical-rules-source-reconcile

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reconcile canonical rules source
        run: node scripts/reconcile-canonical-rules-source.mjs

      - name: Regenerate canonical mirrors
        run: npm run game:generate

      - name: Verify generated-data drift
        run: npm run game:check

      - name: Full repository certification
        run: npm test

      - name: Verify patch cleanliness
        run: git diff --check

      - name: Remove temporary reconciliation machinery
        run: |
          rm scripts/reconcile-canonical-rules-source.mjs
          rm .github/workflows/temp-canonical-rules-reconcile.yml

      - name: Commit reconciled source and generated mirrors
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reconcile canonical Black Belt and HP rules"
          git push origin HEAD:fix/canonical-rules-source-reconcile

# retrigger after matcher repair
