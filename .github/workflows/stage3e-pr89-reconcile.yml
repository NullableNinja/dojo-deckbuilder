name: Stage 3E PR89 Reconcile

on:
  push:
    branches:
      - stage3e-character-purchase-attempt-event
    paths:
      - .github/workflows/stage3e-pr89-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage3e-character-purchase-attempt-event
          fetch-depth: 0

      - name: Merge current main and resolve the shared playtest seam
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge origin/main --no-edit
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            unresolved="$(git diff --name-only --diff-filter=U)"
            unexpected="$(printf '%s\n' "$unresolved" | grep -v '^app/playtest.tsx$' || true)"
            if [ -n "$unexpected" ]; then
              echo "Unexpected merge conflicts:"
              printf '%s\n' "$unexpected"
              exit 1
            fi

            git checkout --ours app/playtest.tsx
            python - <<'PY'
          from pathlib import Path

          path = Path('app/playtest.tsx')
          text = path.read_text()

          import_line = 'import { QUICK_DUEL_TRAINING_STRIPE_HEAL_REQUEST_EVENT, spendQuickDuelTrainingStripeForHealing } from "./quick-duel-training-stripes.ts";'
          anchor = 'import { QUICK_DUEL_HOUSE_RULES, effectiveBeltThresholds, hasQuickDuelHouseRule, sanitizeQuickDuelHouseRuleIds, shouldRefreshMarketAtRoundEnd } from "./playtest-house-rules";'
          if import_line not in text:
              if anchor not in text:
                  raise SystemExit('Training Stripe import anchor not found')
              text = text.replace(anchor, anchor + '\n' + import_line, 1)

          effect = '''  useEffect(() => {
            const handleTrainingStripeHeal = () => {
              if (deskView !== "belt") return;
              setMatch((current) => {
                if (!current || current.phase !== "player-ascend") return current;
                const next = spendQuickDuelTrainingStripeForHealing(current, "player", "belt-check");
                if (next === current) return current;
                const recovered = next.player.hp - current.player.hp;
                if (recovered <= 0) return current;
                return {
                  ...next,
                  log: [`Training Stripe redeemed: recover ${recovered} HP (${current.player.hp} → ${next.player.hp}).`, ...next.log].slice(0, 32),
                };
              });
            };
            window.addEventListener(QUICK_DUEL_TRAINING_STRIPE_HEAL_REQUEST_EVENT, handleTrainingStripeHeal);
            return () => window.removeEventListener(QUICK_DUEL_TRAINING_STRIPE_HEAL_REQUEST_EVENT, handleTrainingStripeHeal);
          }, [deskView]);
          '''
          state_anchor = '''  const [rulesSync, setRulesSync] = useState<RulesSyncState>({ status: "checking", currentVersion: activeRulesRevision, latestVersion: activeRulesRevision, checkedAt: 0 });'''
          if 'QUICK_DUEL_TRAINING_STRIPE_HEAL_REQUEST_EVENT, handleTrainingStripeHeal' not in text:
              if state_anchor not in text:
                  raise SystemExit('Training Stripe listener anchor not found')
              text = text.replace(state_anchor, effect + state_anchor, 1)

          path.write_text(text)
          PY
            git add app/playtest.tsx

            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              echo "Unresolved conflicts remain:"
              git diff --name-only --diff-filter=U
              exit 1
            fi
            git commit --no-edit
          fi

      - name: Remove one-shot reconciliation workflow and push
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/stage3e-pr89-reconcile.yml
          git add .github/workflows/stage3e-pr89-reconcile.yml
          git commit -m "Remove temporary PR 89 reconciliation workflow"
          git push origin HEAD:stage3e-character-purchase-attempt-event
