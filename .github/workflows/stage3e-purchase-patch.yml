name: Stage 3E Purchase Patch

on:
  push:
    branches: [stage3e-character-purchase-attempt-event]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage3e-character-purchase-attempt-event
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/stage3e-purchase-patch.py
      - name: Commit clean source result
        run: |
          git rm .github/workflows/stage3e-purchase-patch.yml scripts/stage3e-purchase-patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/playtest.tsx app/character-runtime.ts
          git commit -m "stage3e: integrate Character purchaseAttempt into Market flow"
          git push origin HEAD:stage3e-character-purchase-attempt-event
