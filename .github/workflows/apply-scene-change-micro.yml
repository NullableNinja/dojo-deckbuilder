name: Apply sceneChange Character micro

on:
  push:
    branches:
      - stage3e-character-scene-change-event

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[scene-change-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage3e-character-scene-change-event
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - name: Apply sceneChange host route and canaries
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const hostPath = 'app/quick-duel-transition-host.ts';
          let host = fs.readFileSync(hostPath, 'utf8');
          const marker = 'function detectPurchasedCard(\n';
          if (!host.includes(marker)) throw new Error('detectPurchasedCard marker not found');
          const sceneHost = `function publishSceneChangeCharacterTransitions<Board extends QuickDuelTransitionBoard>(
            previous: QuickDuelTransitionMatch<Board>,
            nextInput: QuickDuelTransitionMatch<Board>,
          ): QuickDuelTransitionMatch<Board> {
            if (!previous.locationId || !nextInput.locationId || previous.locationId === nextInput.locationId) return nextInput;
            let next = nextInput;
            for (const actor of ["player", "ai"] as const) {
              const published = publishCharacterTransitionEvent(next, actor, {
                type: "sceneChange",
                sceneChanged: true,
              });
              next = published.match;
            }
            return next;
          }

          `;
          if (!host.includes('function publishSceneChangeCharacterTransitions')) {
            host = host.replace(marker, sceneHost + marker);
          }
          const promotionCall = '  next = publishPromotionCharacterTransitions(previous, next);\n';
          if (!host.includes(promotionCall)) throw new Error('promotion publication call not found');
          if (!host.includes('  next = publishSceneChangeCharacterTransitions(previous, next);')) {
            host = host.replace(promotionCall, promotionCall + '  next = publishSceneChangeCharacterTransitions(previous, next);\n');
          }
          host = host.replace(
            ' * Derives canonical Combo host history, Character card-play/discard/Speed-change/\n * promotion events, and progression bookkeeping from state transitions Quick',
            ' * Derives canonical Combo host history, Character card-play/discard/Speed-change/\n * promotion/scene-change events, and progression bookkeeping from state transitions Quick',
          );
          fs.writeFileSync(hostPath, host);

          const certificationPath = 'tests/runtime-effect-certification-character.test.mjs';
          let certification = fs.readFileSync(certificationPath, 'utf8');
          const purchaseBlock = `  const purchaseRuntime = evidence("character.marketDiscountFloor");
          assert.equal(purchaseRuntime.owner, "event-runtime");
          assert.deepEqual(purchaseRuntime.events, ["purchaseAttempt"]);
          assert.deepEqual(purchaseRuntime.liveEvents, ["purchaseAttempt"]);
          assert.equal(purchaseRuntime.hostLive, true);
          `;
          if (!certification.includes(purchaseBlock)) throw new Error('purchase certification block not found');
          const sceneBlock = `
          const sceneRuntime = evidence("character.sceneChangeCycle");
          assert.equal(sceneRuntime.owner, "event-runtime");
          assert.deepEqual(sceneRuntime.events, ["sceneChange"]);
          assert.deepEqual(sceneRuntime.liveEvents, ["sceneChange"]);
          assert.equal(sceneRuntime.hostLive, true);
          `;
          if (!certification.includes('const sceneRuntime = evidence("character.sceneChangeCycle")')) {
            certification = certification.replace(purchaseBlock, purchaseBlock + sceneBlock);
          }
          fs.writeFileSync(certificationPath, certification);

          fs.writeFileSync('tests/quick-duel-character-scene-change-host.test.mjs', `import assert from "node:assert/strict";
          import test from "node:test";

          import {
            applyQuickDuelPlaytestTransition,
            resolveQuickDuelPlaytestCharacterChoice,
          } from "../app/quick-duel-playtest-host.ts";

          function board(overrides = {}) {
            return {
              fighterId: "DDB-CHR-CORE-001",
              belt: 3,
              hp: 10,
              maxHp: 10,
              xp: 0,
              focus: 0,
              tempSpeed: 0,
              nextAttackBonus: 0,
              nextDefenseCardBonus: 0,
              nextAttackHasFlow: false,
              nextAttackAnyZone: false,
              attacksThisTurn: 0,
              zonesPlayed: [],
              cardsThisTurn: [],
              equipment: [],
              exhaustedEquipment: [],
              hand: ["h1"],
              deck: ["d1", "d2"],
              discard: [],
              destroyed: [],
              learnedCombos: [],
              triggeredCombos: [],
              cardsBought: 0,
              usedConsumableThisRound: false,
              wasHitSinceLastTurn: false,
              damageReductionUsed: false,
              reversalAttackBonus: 0,
              borrowedEquipmentId: null,
              abilityUsedRound: false,
              usedCharacterEffectIdsThisTurn: [],
              usedCharacterEffectIdsThisRound: [],
              usedCharacterEffectIdsThisGame: [],
              characterMarks: {},
              stage3cStatuses: [],
              stage3cChoices: [],
              stage3cRestrictions: [],
              damageDealt: 0,
              damageTaken: 0,
              completedBeltExamThisRound: false,
              ...overrides,
            };
          }

          function match(player = board(), ai = board(), overrides = {}) {
            return {
              schema: 8,
              player,
              ai,
              market: [],
              round: 1,
              phase: "player-initiate",
              turnOrder: ["player", "ai"],
              turnIndex: 0,
              lastExchange: null,
              locationId: "loc-a",
              pendingChoice: null,
              winner: null,
              log: [],
              ...overrides,
            };
          }

          const noCards = () => null;

          test("Venue Val receives sceneChange on a real Location transition and resumes its cycle choice", () => {
            const previous = match(board({ fighterId: "DDB-CHR-CORE-039", hand: ["h1"], deck: ["d1", "d2"] }));
            const next = { ...previous, locationId: "loc-b" };

            const hosted = applyQuickDuelPlaytestTransition(previous, next, noCards);
            assert.equal(hosted.locationId, "loc-b");
            assert.equal(hosted.pendingChoice?.kind, "character-runtime");
            assert.equal(hosted.pendingChoice?.event?.type, "sceneChange");
            assert.equal(hosted.pendingChoice?.choice?.resolver, "character.sceneChangeCycle");
            assert.deepEqual(hosted.player.hand, ["h1", "d2"]);

            const resolved = resolveQuickDuelPlaytestCharacterChoice(
              hosted,
              "player",
              hosted.pendingChoice.event,
              hosted.pendingChoice.choice,
              "h1",
            );
            assert.deepEqual(resolved.match.player.hand, ["d2"]);
            assert.deepEqual(resolved.match.player.discard, ["h1"]);
            assert.equal(resolved.choices.length, 0);
          });

          test("Venue Val AI resolves the same sceneChange cycle automatically", () => {
            const previous = match(
              board(),
              board({ fighterId: "DDB-CHR-CORE-039", hand: ["ai-h1"], deck: ["ai-d1", "ai-d2"] }),
            );
            const next = { ...previous, locationId: "loc-b" };

            const hosted = applyQuickDuelPlaytestTransition(previous, next, noCards);
            assert.equal(hosted.pendingChoice, null);
            assert.equal(hosted.ai.hand.length, 1);
            assert.equal(hosted.ai.discard.length, 1);
            assert.equal(hosted.ai.deck.length, 1);
            assert.ok(hosted.ai.hand.includes("ai-d2") || hosted.ai.discard.includes("ai-d2"));
          });

          test("sceneChange is not published for an unchanged Location or initial Location setup", () => {
            const venue = board({ fighterId: "DDB-CHR-CORE-039", hand: ["h1"], deck: ["d1", "d2"] });
            const unchanged = match(venue);
            const unchangedHosted = applyQuickDuelPlaytestTransition(unchanged, { ...unchanged, player: { ...venue, focus: 1 } }, noCards);
            assert.equal(unchangedHosted.pendingChoice, null);
            assert.deepEqual(unchangedHosted.player.hand, ["h1"]);

            const noLocation = match(venue, board(), { locationId: undefined });
            const initializedHosted = applyQuickDuelPlaytestTransition(noLocation, { ...noLocation, locationId: "loc-a" }, noCards);
            assert.equal(initializedHosted.pendingChoice, null);
            assert.deepEqual(initializedHosted.player.hand, ["h1"]);
          });

          test("a global Location transition publishes sceneChange to both fighters", () => {
            const previous = match(
              board({ fighterId: "DDB-CHR-CORE-039", hand: ["p-h1"], deck: ["p-d1", "p-d2"] }),
              board({ fighterId: "DDB-CHR-CORE-039", hand: ["a-h1"], deck: ["a-d1", "a-d2"] }),
            );
            const hosted = applyQuickDuelPlaytestTransition(previous, { ...previous, locationId: "loc-b" }, noCards);
            assert.equal(hosted.pendingChoice?.event?.type, "sceneChange");
            assert.equal(hosted.player.hand.length, 2);
            assert.equal(hosted.ai.hand.length, 1);
            assert.equal(hosted.ai.discard.length, 1);
          });
          `);
          NODE
      - name: Remove transport workflow before certification
        run: git rm .github/workflows/apply-scene-change-micro.yml
      - name: Run focused sceneChange certification
        run: node --test tests/quick-duel-character-scene-change-host.test.mjs tests/runtime-effect-certification-character.test.mjs
      - name: Run full repository suite
        run: npm test
      - name: Commit certified sceneChange micro
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stage 3E: publish Character sceneChange from Location transitions [scene-change-applied]"
          git push origin HEAD:stage3e-character-scene-change-event
