name: Temporary Rulings Variants Reconciliation Certification

on:
  push:
    branches:
      - rulings-variants-playtest-options-v2

permissions:
  contents: write

jobs:
  certify-reconciled-tree:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify immutable checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Remove temporary certification workflow from tested tree
        run: rm .github/workflows/tmp-rulings-variants-reconcile-certify.yml

      - name: Generate canonical game data
        run: npm run game:generate

      - name: Verify canonical generated data
        run: npm run game:check

      - name: Character runtime certification
        run: node --experimental-strip-types --test tests/character-runtime-enforcement.test.mjs

      - name: Location runtime certification
        run: node --experimental-strip-types --test tests/stage3d-location-runtime.test.mjs

      - name: Character and Location composition certification
        run: node --experimental-strip-types --test tests/stage3d-character-location-integration.test.mjs

      - name: Defense and consumable runtime certification
        run: node --test tests/stage3c-defense-consumable-runtime.test.mjs

      - name: TypeScript compile
        run: npx tsc --noEmit

      - name: Run complete repository gate
        id: repository-gate
        shell: bash
        env:
          GITHUB_PAGES: true
        run: |
          set +e
          npm test 2>&1 | tee /tmp/rulings-variants-reconcile-test.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload failed repository gate log
        if: failure() && steps.repository-gate.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: rulings-variants-reconcile-test-log-${{ github.sha }}
          path: /tmp/rulings-variants-reconcile-test.log
          if-no-files-found: error
          retention-days: 3

      - name: Production build
        run: npm run build

      - name: Verify catalog-aware playtest effect call sites
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'effectPlanForCard(card)' app/playtest.tsx
          if grep -q 'compileCardEffects(card.rulesText' app/playtest.tsx; then
            echo 'Legacy rules-text-only card effect call site remains.' >&2
            exit 1
          fi

      - name: Verify clean patch formatting
        run: git diff --check

      - name: Verify committed source was not mutated
        shell: bash
        run: git diff --exit-code -- . ':(exclude).github/workflows/tmp-rulings-variants-reconcile-certify.yml'

      - name: Commit certified workflow cleanup
        shell: bash
        run: |
          git config user.name "Dojo Deckbuilder Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "complete reconciled Rulings and Variants certification"
          git push origin HEAD:rulings-variants-playtest-options-v2
