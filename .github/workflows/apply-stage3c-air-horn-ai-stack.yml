name: Apply Stage 3C Air Horn AI Stack Once

on:
  push:
    branches: [stage3c-play-surface-remediation]
    paths:
      - .github/workflows/apply-stage3c-air-horn-ai-stack.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage3c-play-surface-remediation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Wire AI Air Horn to the real Reaction boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/playtest.tsx')
          source = path.read_text()
          import_anchor = 'import { chooseAiDefensiveConsumable } from "./stage3c-consumable-reaction-ai.ts";\n'
          import_line = 'import { firstEventReactionCard } from "./stage3c-consumable-event-reactions.ts";\n'
          if import_line not in source:
              if source.count(import_anchor) != 1:
                  raise SystemExit('Air Horn import anchor drifted')
              source = source.replace(import_anchor, import_anchor + import_line, 1)

          anchor = '    if (isCoreConsumableCard(card) && (current.player.stage3cRestrictions ?? []).includes("consumable")) return current;\n    const locationModifier = locationFocusModifier(cardFor(current.locationId), card, current.player);'
          replacement = '''    if (isCoreConsumableCard(card) && (current.player.stage3cRestrictions ?? []).includes("consumable")) return current;
    const aiAirHorn = current.phase === "defense-window" && String(card.timing ?? "").trim().toLocaleLowerCase() === "reaction"
      ? firstEventReactionCard(current.ai.hand.map(cardFor).filter((candidate): candidate is CardEntry => Boolean(candidate && isCoreConsumableCard(candidate))), "cancel-reaction")
      : null;
    if (aiAirHorn) {
      const cancelledPlayer = { ...current.player, hand: removeOne(current.player.hand, card.id), discard: [...current.player.discard, card.id], reactionItemUsedSinceLastTurn: true, lastAttackHit: false };
      let reactingAi = { ...current.ai, hand: removeOne(current.ai.hand, aiAirHorn.id), playArea: [...current.ai.playArea, aiAirHorn.id], reactionItemUsedSinceLastTurn: true };
      reactingAi = returnResolvedConsumable(reactingAi, aiAirHorn);
      return write(current, `${aiAirHorn.name} cancels ${card.name} before it resolves. The cancelled Reaction is discarded; ${aiAirHorn.name} completes its Consumable lifecycle.`, { player: cancelledPlayer, ai: reactingAi });
    }
    const locationModifier = locationFocusModifier(cardFor(current.locationId), card, current.player);'''
          if replacement not in source:
              if source.count(anchor) != 1:
                  raise SystemExit(f'Air Horn playSupport anchor drifted: {source.count(anchor)} matches')
              source = source.replace(anchor, replacement, 1)
          path.write_text(source)

          test_path = Path('tests/stage3c-air-horn-play-surface.test.mjs')
          test_path.write_text('''import assert from "node:assert/strict";\nimport { readFile } from "node:fs/promises";\nimport test from "node:test";\n\nconst source = await readFile(new URL("../app/playtest.tsx", import.meta.url), "utf8");\n\ntest("Air Horn is evaluated after a Reaction is played and before that Reaction resolves", () => {\n  const playSupport = source.slice(source.indexOf("const playSupport ="), source.indexOf("const useDefensePractice ="));\n  assert.match(playSupport, /firstEventReactionCard\\([^]*?\\"cancel-reaction\\"\\)/);\n  const cancellation = playSupport.indexOf("if (aiAirHorn)");\n  const applyEffects = playSupport.indexOf("applyCardEffects(supportEntryBoard");\n  assert.ok(cancellation >= 0 && applyEffects > cancellation, "Air Horn cancellation must happen before the target Reaction resolves");\n  assert.match(playSupport, /discard: \\[\.\.\.current\.player\.discard, card\.id\\]/, "cancelled Reaction must go to discard instead of resolving/returning to supply");\n  assert.match(playSupport, /returnResolvedConsumable\\(reactingAi, aiAirHorn\\)/, "Air Horn itself must complete normal Consumable lifecycle");\n});\n''')
          PY
      - name: Remove one-shot installer before certification
        run: git rm .github/workflows/apply-stage3c-air-horn-ai-stack.yml
      - name: Targeted event-Reaction certification
        run: node --experimental-strip-types --test tests/stage3c-event-reaction-contracts.test.mjs tests/stage3c-air-horn-play-surface.test.mjs tests/stage3c-consumable-play-window.test.mjs tests/stage3c-consumable-reaction-ai.test.mjs
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Full repository gate
        run: npm test
      - name: Production build
        run: npm run build
      - name: Hygiene
        run: |
          git diff --check
          test ! -e .github/workflows/apply-stage3c-air-horn-ai-stack.yml
          test ! -e .github/workflows/apply-stage3c-smoke-targeting-batch.yml
      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/playtest.tsx tests/stage3c-air-horn-play-surface.test.mjs
          git add -u
          git commit -m 'feat: enforce AI Air Horn on the Reaction stack'
          git push origin HEAD:stage3c-play-surface-remediation
