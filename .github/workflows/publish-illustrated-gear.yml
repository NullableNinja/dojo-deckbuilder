name: Publish Illustrated Gear
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-illustrated-gear.yml"
      - "app/assets/art/gear/ready/**"
      - "scripts/build_editable_gear_sources.py"
permissions:
  contents: write
jobs:
  build-illustrated-gear-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Pillow is available
        run: python -c "import PIL" || python -m pip install --user Pillow
      - name: Render Gear cards and OpenRaster sources
        run: python scripts/build_editable_gear_sources.py /tmp/dojo-gear-sources
      - name: Verify complete published artwork
        run: |
          test "$(find app/assets/art/gear/ready -maxdepth 1 -name '*.png' | wc -l)" -eq 24
          test "$(find app/assets/cards/gear -maxdepth 1 -name '*.webp' | wc -l)" -eq 24
          test "$(find /tmp/dojo-gear-sources/gear -maxdepth 1 -name '*.ora' | wc -l)" -eq 24
          unzip -t public/downloads/Dojo_Deckbuilder_v2.3_Gear_Editable_ORA.zip >/dev/null
      - name: Commit Gear faces and source archive
        run: |
          rm .github/workflows/publish-illustrated-gear.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/assets/cards/gear public/downloads/Dojo_Deckbuilder_v2.3_Gear_Editable_ORA.zip .github/workflows
          git diff --cached --quiet || git commit -m "Add illustrated Paper-Fu Gear cards"
          git push origin HEAD:main
