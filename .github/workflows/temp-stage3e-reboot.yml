name: Temporary Stage 3E reboot certification

on:
  push:
    branches:
      - stage3e-character-reboot-action

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage3e-character-reboot-action
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - run: npm ci
      - name: Apply reboot implementation
        run: python .github/temp-patch-reboot.py
      - name: Regenerate canonical mirrors
        run: npm run game:generate
      - name: Canonical source drift
        run: npm run game:check
      - name: Production build
        run: npm run build
      - name: Character reboot certification
        run: node --experimental-strip-types --test tests/quick-duel-character-reboot-host.test.mjs tests/character-*.test.mjs tests/quick-duel-character-*.test.mjs
      - name: Commit certified implementation and remove temporary machinery
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/temp-patch-reboot.py
          git rm .github/workflows/temp-stage3e-reboot.yml
          git add content/card-effects/characters.json app/data/card-effects.json app/character-runtime.ts app/quick-duel-playtest-host.ts app/playtest.tsx tests/quick-duel-character-reboot-host.test.mjs
          git commit -m "feat(stage3e): publish canonical Character reboot action"
          git push origin HEAD:stage3e-character-reboot-action
