name: Package Learned Combo cards

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image renderer
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Render Learned Combo deliverables
        run: python scripts/build_editable_combo_sources.py "$RUNNER_TEMP/learned-combos"

      - name: Upload generated deliverables
        uses: actions/upload-artifact@v4
        with:
          name: learned-combo-card-deliverables
          path: |
            ${{ runner.temp }}/learned-combos/combos
            app/assets/cards/combos
            public/downloads/Dojo_Deckbuilder_v2.3_Learned_Combos_Editable_ORA.zip
          if-no-files-found: error
          retention-days: 14
