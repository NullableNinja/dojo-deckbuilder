name: Build Learned Combo cards

on:
  push:
    branches: [main]
    paths:
      - "app/assets/art/combos/ready/**"
      - "scripts/build_editable_combo_sources.py"
      - "app/companion-app.tsx"
      - "app/playtest.tsx"
      - "tests/content-integrity.test.mjs"
      - ".github/workflows/build-learned-combos.yml"

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image renderer
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Render editable sources and website card faces
        run: python scripts/build_editable_combo_sources.py "$RUNNER_TEMP/learned-combos"
      - name: Commit rendered Learned Combo deliverables
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/assets/cards/combos public/downloads/Dojo_Deckbuilder_v2.3_Learned_Combos_Editable_ORA.zip
          git diff --cached --quiet || git commit -m "Render Learned Combo card deliverables"
          git push
