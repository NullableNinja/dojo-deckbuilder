name: Stage 3B Equipment Verification

on:
  push:
    branches: [stage3b-equipment-effects]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Print canonical Equipment inventory
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const cards = JSON.parse(await readFile('content/cards.json', 'utf8')).cards ?? [];
          const equipment = cards.filter((card) => {
            const id = String(card.catalogId ?? '').toUpperCase();
            const subtype = String(card.subtype ?? '').toLowerCase();
            return id.includes('-WPN-') || id.includes('-GEA-') || id.includes('-DEQ-') || ['weapon', 'gear', 'defense equipment'].includes(subtype);
          });
          console.log(`EQUIPMENT_COUNT=${equipment.length}`);
          for (const card of equipment) {
            console.log(JSON.stringify({ catalogId: card.catalogId, name: card.name, subtype: card.subtype, timing: card.timing, rulesText: card.rulesText, tags: card.tags, stats: card.stats }));
          }
          NODE
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check generated game data
        run: npm run game:check
      - name: Run tests
        run: npm test
