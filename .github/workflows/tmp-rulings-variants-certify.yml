name: Temporary Rulings Variants Certification

on:
  push:
    branches:
      - rulings-variants-playtest-options-v2

permissions:
  contents: write

jobs:
  patch-and-certify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify immutable checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply guarded Rulings and Variants architecture patch
        shell: bash
        run: |
          sed -i 's#rules_path = "app/data/rules.json"#rules_path = "content/rules.json"#' scripts/tmp-rulings-variants-patch.py
          sed -i 's/if call_count < 8:/if call_count < 1:/' scripts/tmp-rulings-variants-patch.py
          sed -i 's/expected at least 8 settings.locations call endings/expected at least one settings.locations call ending/' scripts/tmp-rulings-variants-patch.py
          python scripts/tmp-rulings-variants-patch.py
          python <<'PY'
          from pathlib import Path
          import json

          playtest = Path("app/playtest.tsx")
          text = playtest.read_text()
          old = 'return advanceRound(hidden, settings.locations, "Both fighters have completed the round.");'
          new = 'return advanceRound(hidden, settings.locations, "Both fighters have completed the round.", settings.houseRuleIds);'
          if text.count(old) != 1:
              raise SystemExit(f"expected one direct player advanceRound call, found {text.count(old)}")
          playtest.write_text(text.replace(old, new))

          main = Path("src/main.tsx")
          text = main.read_text()
          old = 'import "../app/reference-desk.css";'
          new = 'import "../app/rulings-variants.css";'
          if text.count(old) != 1:
              raise SystemExit(f"expected one Reference Desk stylesheet import, found {text.count(old)}")
          main.write_text(text.replace(old, new))

          companion = Path("app/companion-app.tsx")
          text = companion.read_text()
          old_import = 'import { quickDuelHouseRuleForName } from "./playtest-house-rules";\n'
          if text.count(old_import) != 1:
              raise SystemExit(f"expected one playtest house-rule helper import in companion shell, found {text.count(old_import)}")
          text = text.replace(old_import, '')
          old_type = 'type HouseRule = { name: string; rule: string; category?: string; summary?: string; notes?: string };'
          new_type = 'type HouseRule = { id: string; name: string; rule: string; category?: string; summary?: string; notes?: string; quickDuel: { status: "supported" | "planned" | "not-applicable"; reason: string } };'
          if text.count(old_type) != 1:
              raise SystemExit(f"expected one HouseRule type declaration, found {text.count(old_type)}")
          text = text.replace(old_type, new_type)
          old_selected = 'const selectedSupport = selected ? quickDuelHouseRuleForName(selected.name) : null;'
          new_selected = 'const selectedSupport = selected ? rulesData.houseRules.find((entry) => entry.name === selected.name) ?? null : null;'
          if text.count(old_selected) != 1:
              raise SystemExit(f"expected one selected Quick Duel support lookup, found {text.count(old_selected)}")
          text = text.replace(old_selected, new_selected)
          old_card_lookup = 'const support = quickDuelHouseRuleForName(entry.name);'
          new_card_lookup = 'const support = entry;'
          if text.count(old_card_lookup) != 1:
              raise SystemExit(f"expected one house-rule card support lookup, found {text.count(old_card_lookup)}")
          companion.write_text(text.replace(old_card_lookup, new_card_lookup))

          rules_path = Path("content/rules.json")
          rules = json.loads(rules_path.read_text())
          capabilities = {
              "Steal the Belt": ("steal-the-belt", "not-applicable", "Quick Duel ends when the opposing fighter is KO'd, so task credit from that KO cannot affect the duel."),
              "Corner Advice": ("corner-advice", "planned", "This needs a once-per-game draw/discard decision for both the player and tactical AI before it can be enforced fairly."),
              "Secret Kata Night": ("secret-kata-night", "planned", "Hidden Market information needs dedicated masking and AI knowledge rules before the digital implementation can be trustworthy."),
              "Crowd Favorite": ("crowd-favorite", "planned", "The Crowd token needs Honor timing, per-round ownership, and a post-Hit choice window that the current duel state does not model yet."),
              "Training Montage": ("training-montage", "planned", "Skipping Yell, choosing a Junk card to Destroy, and teaching the AI when to take the trade all require a new decision state."),
              "Friendly Fire": ("friendly-fire", "not-applicable", "Quick Duel has one fighter per side and no allied active fighter to target."),
              "Market Scramble": ("market-scramble", "supported", "Quick Duel enforces the full seven-card end-of-round refresh through the same Market pipeline used by Market Mercy."),
              "Fast Belts": ("fast-belts", "supported", "Quick Duel applies the reduced post-Gold XP thresholds symmetrically to the player, AI, promotion checks, and Belt displays."),
              "Scroll Shopping": ("scroll-shopping", "planned", "Three-card Combo selection needs a new acquisition choice surface and matching AI policy before it can be automated safely."),
          }
          house_rules = rules.get("houseRules", [])
          if {rule.get("name") for rule in house_rules} != set(capabilities):
              raise SystemExit("canonical house-rule names no longer match the Quick Duel capability registry")
          for rule in house_rules:
              rule_id, status, reason = capabilities[rule["name"]]
              rule["id"] = rule_id
              rule["quickDuel"] = {"status": status, "reason": reason}
          chapter = next((entry for entry in rules.get("chapters", []) if entry.get("id") == "17-house-rules"), None)
          if not chapter or not chapter.get("intro"):
              raise SystemExit("House Rules chapter stub not found")
          chapter["intro"][0]["text"] = "House rules live under Rulings & Variants in the companion site: optional deviations kept clearly separate from official rulings and agreed before setup."
          rules_path.write_text(json.dumps(rules, indent=2, ensure_ascii=False) + "\n")
          PY
          rm app/reference-desk.tsx app/reference-desk.css

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Regenerate canonical derivatives
        run: npm run game:generate

      - name: Remove temporary patch machinery
        run: rm .github/workflows/tmp-rulings-variants-certify.yml scripts/tmp-rulings-variants-patch.py

      - name: Run full repository gate
        env:
          GITHUB_PAGES: true
        run: npm test

      - name: Verify clean patch formatting
        run: git diff --check

      - name: Commit certified implementation
        shell: bash
        run: |
          git config user.name "Dojo Deckbuilder Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "unify rulings and certify Quick Duel house rules"
          git push origin HEAD:rulings-variants-playtest-options-v2
