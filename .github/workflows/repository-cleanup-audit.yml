name: Repository Cleanup Audit

on:
  push:
    branches:
      - cleanup/dead-code-and-repository-hygiene
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate canonical game data
        run: npm run game:generate

      - name: Validate canonical game data
        run: npm run game:check

      - name: Run complete repository test gate
        env:
          GITHUB_PAGES: true
        run: npm test

      - name: Runtime effect certification
        run: node scripts/certify-runtime-effects.mjs

      - name: Check branch diff whitespace
        run: git diff --check 6c7dff42b0c2ac54b487f35dc242f2183c036a39..HEAD

      - name: Repository inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cleanup-audit
          python3 - <<'PY'
          import hashlib, json, pathlib, re, subprocess

          tracked_raw = subprocess.check_output(['git','ls-files','-z']).split(b'\0')
          files = [pathlib.Path(p.decode()) for p in tracked_raw if p and pathlib.Path(p.decode()).is_file()]
          hashes={}
          ext={}
          dirs={}
          total=0
          zero=[]
          temp=[]
          suffixes=('.tmp','.bak','.orig','.rej','.old','.save','.swp','.swo')
          text_cache={}

          for p in files:
            size=p.stat().st_size
            total += size
            ext[p.suffix.lower() or '<none>']=ext.get(p.suffix.lower() or '<none>',0)+1
            top=p.parts[0] if p.parts else '<root>'
            dirs[top]=dirs.get(top,0)+1
            if size == 0: zero.append(str(p))
            low=p.name.lower()
            if low.endswith(suffixes) or low.endswith('~') or low in {'.ds_store','thumbs.db'}:
              temp.append(str(p))
            h=hashlib.sha256(p.read_bytes()).hexdigest()
            hashes.setdefault(h,[]).append(str(p))
            if size <= 5_000_000:
              try: text_cache[str(p)] = p.read_text('utf-8')
              except Exception: pass

          dups=[{'sha256':h,'paths':ps,'bytes_each':pathlib.Path(ps[0]).stat().st_size} for h,ps in hashes.items() if len(ps)>1]
          left='<' * 7
          right='>' * 7
          middle='=' * 7
          conflicts=[]
          for path,text in text_cache.items():
            if path == '.github/workflows/repository-cleanup-audit.yml':
              continue
            if left in text or right in text or re.search(rf'(?m)^\\s*{middle}\\s*$', text):
              conflicts.append(path)

          dist=[p for p in pathlib.Path('dist').rglob('*') if p.is_file()] if pathlib.Path('dist').exists() else []
          bundle={
            'dist_files':len(dist),
            'dist_bytes':sum(p.stat().st_size for p in dist),
            'js_bytes':sum(p.stat().st_size for p in dist if p.suffix=='.js'),
            'css_bytes':sum(p.stat().st_size for p in dist if p.suffix=='.css'),
            'image_files':sum(1 for p in dist if p.suffix.lower() in {'.png','.webp','.jpg','.jpeg','.gif','.svg'}),
            'image_bytes':sum(p.stat().st_size for p in dist if p.suffix.lower() in {'.png','.webp','.jpg','.jpeg','.gif','.svg'}),
          }
          out={
            'tracked_files':len(files),'tracked_bytes':total,
            'by_extension':dict(sorted(ext.items())),'by_top_directory':dict(sorted(dirs.items())),
            'zero_byte_files':zero,'temporary_files':temp,'duplicate_groups':dups,
            'conflict_marker_files':conflicts,'bundle':bundle,
          }
          pathlib.Path('cleanup-audit/inventory.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY

      - name: Ensure generated source is clean
        run: git diff --exit-code

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: repository-cleanup-audit
          path: cleanup-audit/inventory.json
          if-no-files-found: error
