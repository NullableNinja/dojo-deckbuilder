name: Temporary Kata batch4 audit
on:
  push:
    branches: [fix/effect-runtime-certification-batch4]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Print target canonical cards and state seams
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const cards=JSON.parse(fs.readFileSync('app/data/cards.json','utf8')).cards;
          const ids=['DDB-KAT-CORE-005','DDB-KAT-CORE-028','DDB-KAT-CORE-037','DDB-KAT-CORE-047','DDB-KAT-CORE-050','DDB-KAT-CORE-051'];
          for(const id of ids){ const c=cards.find(x=>x.catalogId===id); console.log('\nCARD',id,c?.name); console.log('RULES',c?.rulesText); }
          const k=JSON.parse(fs.readFileSync('content/card-effects/katas.json','utf8')).cards;
          for(const id of ids) console.log('\nEFFECTS',id,JSON.stringify(k[id]?.effects,null,2));
          NODE
          echo '=== PURCHASE / DEFENSE / HIDE FACTS ==='
          grep -n 'boughtCardThis\|defendedThisRound\|onHide\|nextInitiate\|stage3cTakeDamagePrevention' app/playtest.tsx | head -200 || true
