name: Temporary Kata batch4 certification
on:
  push:
    branches: [fix/effect-runtime-certification-batch4]
permissions:
  contents: write
jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/effect-runtime-certification-batch4
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - run: npm ci
      - name: Apply stateful Kata runtime patch
        run: python scripts/temp-kata-batch4-implement.py
      - name: Apply prevention typing fix
        run: python scripts/temp-kata-batch4-typefix.py
      - name: Focused acceptance
        run: node --experimental-strip-types --test tests/quick-duel-kata-stateful-runtime.test.mjs tests/quick-duel-kata-combat-runtime.test.mjs tests/quick-duel-kata-consumable-runtime.test.mjs tests/quick-duel-consumable-host-coverage.test.mjs
      - name: Full verification
        run: npm run verify
      - name: Diff check
        run: git diff --check
      - name: Commit clean implementation
        if: success()
        run: |
          rm -f .github/workflows/temp-kata-batch4-audit.yml
          rm -f scripts/temp-kata-batch4-implement.py
          rm -f scripts/temp-kata-batch4-typefix.py
          git config user.name "NullableNinja"
          git config user.email "130773741+NullableNinja@users.noreply.github.com"
          git add -A
          git commit -m "Fix stateful Kata branch and prevention effects"
          git push origin HEAD:fix/effect-runtime-certification-batch4
