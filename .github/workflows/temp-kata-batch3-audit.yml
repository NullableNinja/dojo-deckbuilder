name: Temporary Kata batch3 audit
on:
  push:
    branches: [fix/effect-runtime-certification-batch3]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - run: npm ci
      - name: Inventory remaining Kata runtime families
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const cards = JSON.parse(fs.readFileSync('content/card-effects/katas.json','utf8')).cards;
          const groups = new Map();
          for (const [id, card] of Object.entries(cards)) {
            for (const effect of card.effects) {
              const key = effect.resolver ?? '(direct)';
              if (!groups.has(key)) groups.set(key, []);
              groups.get(key).push({id, name: card.name, effect: effect.id, trigger: effect.trigger, action: effect.action, duration: effect.duration ?? ''});
            }
          }
          for (const [resolver, rows] of [...groups.entries()].sort((a,b)=>a[0].localeCompare(b[0]))) {
            console.log(`\n=== ${resolver} (${rows.length}) ===`);
            for (const row of rows) console.log(`${row.id} | ${row.name} | ${row.effect} | ${row.trigger} | ${row.action} | ${row.duration}`);
          }
          NODE
          echo '=== KATA BRIDGE EXPORTS ==='
          grep -n '^export function kata' app/kata-playtest-bridge.ts || true
          echo '=== KATA BRIDGE CONSUMERS ==='
          grep -R -n 'kata[A-Z].*ForHost\|kataCommandsForHost' app --exclude=kata-playtest-bridge.ts || true
          echo '=== KATA LEGACY EFFECT HELPERS USED BY PLAYTEST ==='
          grep -n 'structuredConditionalFocus\|conditionalAttackPowerBonus\|attackPiercing\|conditionalHealAfterHit\|discardChoiceFollowup\|deckLookPlan\|destroyJunkChoicePlan\|mandatoryDiscardChoiceCount\|structuredNextAttackFlow\|structuredNextAttackAnyZone' app/playtest.tsx || true
