name: Temporary Kata batch3 certification
on:
  push:
    branches: [fix/effect-runtime-certification-batch3]
permissions:
  contents: write
jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/effect-runtime-certification-batch3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - run: npm ci
      - name: Apply Kata runtime patch
        run: python scripts/temp-kata-batch3-implement.py
      - name: Apply missing Kata predicate fix
        run: python scripts/temp-kata-predicate-fix.py
      - name: Focused acceptance
        run: node --experimental-strip-types --test tests/quick-duel-kata-combat-runtime.test.mjs tests/quick-duel-kata-consumable-runtime.test.mjs tests/quick-duel-consumable-host-coverage.test.mjs
      - name: Full verification
        run: npm run verify
      - name: Diff check
        run: git diff --check
      - name: Commit clean implementation
        if: success()
        run: |
          rm -f .github/workflows/temp-kata-batch3-audit.yml
          rm -f .github/workflows/temp-kata-batch3-implement.yml
          rm -f scripts/temp-kata-batch3-implement.py
          rm -f scripts/temp-kata-predicate-fix.py
          git config user.name "NullableNinja"
          git config user.email "130773741+NullableNinja@users.noreply.github.com"
          git add -A
          git commit -m "Fix simple Kata combat runtime execution"
          git push origin HEAD:fix/effect-runtime-certification-batch3
