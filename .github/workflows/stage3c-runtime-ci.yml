name: Stage 3C Defense + Consumable Runtime

on:
  push:
    branches:
      - stage3c-defense-consumable-runtime
      - stage3-final-machine-readable-certification
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  runtime-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: One-time materialize canonical Combo requirements
        if: github.ref_name == 'stage3-final-machine-readable-certification' && github.actor != 'github-actions[bot]'
        run: |
          node --experimental-strip-types scripts/materialize-combo-requirements.mjs
          if ! git diff --quiet -- content/combo-requirements.json || ! git ls-files --error-unmatch content/combo-requirements.json >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/combo-requirements.json
            git commit -m "materialize canonical combo requirements"
            git push origin HEAD:stage3-final-machine-readable-certification
          fi

      - name: Generate canonical runtime data
        run: npm run game:generate

      - name: Verify canonical game data
        run: npm run game:check

      - name: Stage 3C targeted tests
        run: node --test tests/stage3c-defense-consumable-runtime.test.mjs

      - name: Full test suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify generated data is committed
        run: git diff --exit-code
