name: Temporary Stage 3E Coach reconstruction

on:
  push:
    branches: [stage3e-coach-card-modified-current-main]

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage3e-coach-card-modified-current-main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Surgically reconstruct current-main Character modification seam
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one replacement target, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          helper = '''export type CharacterModifiedCardType = "Attack" | "Defense";

          export const CHARACTER_OPPONENT_CARD_MODIFICATION_QUEUE_MARK = "structuredHost.opponentCardModificationQueue";

          type CharacterMarkedBoard = {
            characterMarks?: Record<string, unknown>;
          };

          type RuntimeCommandLike = {
            effect?: string;
            target?: string;
            duration?: string;
          };

          function normalizedCardKind(card: { cardType?: string; subtype?: string } | null | undefined) {
            const subtype = String(card?.subtype ?? "").trim().toLocaleLowerCase();
            const cardType = String(card?.cardType ?? "").trim().toLocaleLowerCase();
            if (subtype === "attack" || cardType === "attack") return "Attack" as const;
            if (subtype === "defense" || cardType === "defense") return "Defense" as const;
            return null;
          }

          export function characterSemanticCardType(card: { cardType?: string; subtype?: string } | null | undefined): CharacterModifiedCardType | null {
            return normalizedCardKind(card);
          }

          export function queueOpponentCardModification<Board extends CharacterMarkedBoard>(board: Board, type: CharacterModifiedCardType): Board {
            const marks = { ...(board.characterMarks ?? {}) };
            const current = Array.isArray(marks[CHARACTER_OPPONENT_CARD_MODIFICATION_QUEUE_MARK])
              ? (marks[CHARACTER_OPPONENT_CARD_MODIFICATION_QUEUE_MARK] as unknown[]).filter((value): value is CharacterModifiedCardType => value === "Attack" || value === "Defense")
              : [];
            marks[CHARACTER_OPPONENT_CARD_MODIFICATION_QUEUE_MARK] = current.includes(type) ? current : [...current, type];
            return { ...board, characterMarks: marks };
          }

          export function opponentCardModificationQueue(board: CharacterMarkedBoard): CharacterModifiedCardType[] {
            const value = board.characterMarks?.[CHARACTER_OPPONENT_CARD_MODIFICATION_QUEUE_MARK];
            return Array.isArray(value)
              ? value.filter((entry): entry is CharacterModifiedCardType => entry === "Attack" || entry === "Defense")
              : [];
          }

          export function clearOpponentCardModificationQueue<Board extends CharacterMarkedBoard>(board: Board): Board {
            if (!board.characterMarks?.[CHARACTER_OPPONENT_CARD_MODIFICATION_QUEUE_MARK]) return board;
            const marks = { ...(board.characterMarks ?? {}) };
            delete marks[CHARACTER_OPPONENT_CARD_MODIFICATION_QUEUE_MARK];
            return { ...board, characterMarks: marks };
          }

          export function runtimeCommandCardModificationTypes(commands: readonly RuntimeCommandLike[]): CharacterModifiedCardType[] {
            const result = new Set<CharacterModifiedCardType>();
            for (const command of commands) {
              if (command.target !== "opponent") continue;
              if (command.effect === "combat.modifyAttackPower" && command.duration === "nextAttack") result.add("Attack");
              if (command.effect === "combat.modifyGuard" && command.duration === "nextDefense") result.add("Defense");
            }
            return [...result];
          }
          '''.replace('\n          ', '\n').lstrip()
          Path('app/character-card-modification-facts.ts').write_text(helper)

          replace_once('app/character-runtime.ts',
              '} from "./character-effect-resolvers.ts";\n',
              '} from "./character-effect-resolvers.ts";\nimport { queueOpponentCardModification, type CharacterModifiedCardType } from "./character-card-modification-facts.ts";\n')
          replace_once('app/character-runtime.ts',
              '  | "roundStart" | "turnStart" | "initiate" | "cardPlayed" | "discarded" | "speedChanged"\n',
              '  | "roundStart" | "turnStart" | "initiate" | "cardPlayed" | "cardModified" | "discarded" | "speedChanged"\n')
          replace_once('app/character-runtime.ts',
              '  opponentModifiedCard?: boolean;\n',
              '  opponentModifiedCard?: boolean;\n  modifiedCardType?: CharacterModifiedCardType;\n')
          replace_once('app/character-runtime.ts',
              '  "character.opponentModificationCycle": ["cardPlayed"],\n  "character.green.repeatModifiedCardTypeBonus": ["cardPlayed"],\n',
              '  "character.opponentModificationCycle": ["cardModified"],\n  "character.green.repeatModifiedCardTypeBonus": ["cardModified"],\n')
          replace_once('app/character-runtime.ts',
              '''function isAvailable(board: CharacterRuntimeBoard, effect: CharacterStructuredEffect, event: CharacterRuntimeEventType) {
            const resolver = String(effect.resolver ?? "");
            return Boolean(resolver)
              && (resolverEvents[resolver] ?? []).includes(event)
              && (!resolver.startsWith("character.green.") || greenCharacterAbilityUnlocked(board.belt))
              && !usage(board, effect).includes(idFor(effect));
          }
          '''.replace('\n          ', '\n').lstrip(),
              '''function isAvailable(board: CharacterRuntimeBoard, effect: CharacterStructuredEffect, event: CharacterRuntimeEventType) {
            const resolver = String(effect.resolver ?? "");
            const used = usage(board, effect);
            const resolverEffectIds = effectsFor(board.fighterId)
              .filter((entry) => String(entry.resolver ?? "") === resolver)
              .map(idFor);
            return Boolean(resolver)
              && (resolverEvents[resolver] ?? []).includes(event)
              && (!resolver.startsWith("character.green.") || greenCharacterAbilityUnlocked(board.belt))
              && !resolverEffectIds.some((id) => used.includes(id));
          }
          '''.replace('\n          ', '\n').lstrip())
          replace_once('app/character-runtime.ts',
              '''      case "character.opponentModificationCycle":
                if (event.opponentModifiedCard) { const cycled = cycleWithPlayerChoice(self, effect, resolver, actor, choices, event.selectedId); self = cycled.resolved ? mark(cycled.board, "round:modifiedCardType", event.card?.cardType ?? "") : cycled.board; activated = cycled.resolved; }
                break;
              case "character.green.repeatModifiedCardTypeBonus":
                if (markMap(self)["round:modifiedCardType"] === event.card?.cardType) {
                  if (event.card?.cardType === "Attack") self = { ...self, nextAttackBonus: self.nextAttackBonus + amount };
                  else if (event.card?.cardType === "Defense") self = { ...self, nextDefenseCardBonus: (self.nextDefenseCardBonus ?? 0) + amount };
                  activated = true;
                }
                break;
          '''.replace('\n          ', '\n').lstrip(),
              '''      case "character.opponentModificationCycle":
                if (event.modifiedCardType) { const cycled = cycleWithPlayerChoice(self, effect, resolver, actor, choices, event.selectedId); self = cycled.resolved ? mark(cycled.board, "round:modifiedCardType", event.modifiedCardType) : cycled.board; activated = cycled.resolved; }
                break;
              case "character.green.repeatModifiedCardTypeBonus": {
                const modifiedType = markMap(self)["round:modifiedCardType"];
                if (modifiedType === event.modifiedCardType) {
                  if (modifiedType === "Attack") self = { ...self, nextAttackBonus: self.nextAttackBonus + amount };
                  else if (modifiedType === "Defense") self = { ...self, nextDefenseCardBonus: (self.nextDefenseCardBonus ?? 0) + amount };
                  self = clearMark(self, "round:modifiedCardType");
                  activated = true;
                }
                break;
              }
          '''.replace('\n          ', '\n').lstrip())
          replace_once('app/character-runtime.ts',
              '        if (hasMark(self, "turn:consumableAttack")) { opponent = { ...opponent, nextAttackBonus: opponent.nextAttackBonus + amount }; activated = true; }\n',
              '        if (hasMark(self, "turn:consumableAttack")) { opponent = queueOpponentCardModification({ ...opponent, nextAttackBonus: opponent.nextAttackBonus + amount }, "Attack"); activated = true; }\n')

          replace_once('app/quick-duel-character-event-routes.ts',
              '  { event: "cardPlayed", timing: "transition", hostFact: "cardsThisTurn gains a card", reason: "Completed card play can publish family/type facts after the card enters play history." },\n',
              '  { event: "cardPlayed", timing: "transition", hostFact: "cardsThisTurn gains a card", reason: "Completed card play can publish family/type facts after the card enters play history." },\n  { event: "cardModified", timing: "transition", hostFact: "an opponent-targeted Attack/Defense card modifier is committed", reason: "Coach-style reactions observe proven opponent modification provenance without inferring from raw board deltas." },\n')

          replace_once('app/quick-duel-playtest-host.ts',
              'import type { RuntimeCommand, RuntimeTrigger } from "./family-effect-runtime.ts";\n',
              'import type { RuntimeCommand, RuntimeTrigger } from "./family-effect-runtime.ts";\nimport { clearOpponentCardModificationQueue, opponentCardModificationQueue, queueOpponentCardModification, runtimeCommandCardModificationTypes } from "./character-card-modification-facts.ts";\n')
          host_fn = '''function publishQueuedCharacterCardModifications<
            Board extends QuickDuelComboMatchBoard & QuickDuelCharacterCombatBoard,
            Match extends QuickDuelPlaytestStateMatch<Board>,
          >(match: Match): Match {
            let result = match;
            for (const actor of ["player", "ai"] as const) {
              const queued = opponentCardModificationQueue(result[actor]);
              if (!queued.length) continue;
              result = { ...result, [actor]: clearOpponentCardModificationQueue(result[actor]) } as Match;
              for (const modifiedCardType of queued) {
                let character = publishQuickDuelPlaytestCharacterEvent(result, actor, {
                  type: "cardModified",
                  opponentModifiedCard: true,
                  modifiedCardType,
                });
                if (actor === "ai") {
                  for (let guard = 0; guard < 8 && character.event && character.choices.length > 0; guard += 1) {
                    const choice = character.choices[0];
                    const selection = chooseAiCharacterOption(choice);
                    if (selection === null) break;
                    character = resolveQuickDuelPlaytestCharacterChoice(character.match, actor, character.event, choice, selection);
                  }
                }
                result = character.match as Match;
                if (actor === "player" && character.event && character.choices.length > 0) {
                  const pending: QuickDuelCharacterChoiceState = { kind: "character-runtime", event: character.event, choice: character.choices[0] };
                  result = result.pendingChoice
                    ? withDeferredCharacterChoice(result, pending)
                    : ({ ...result, pendingChoice: pending } as Match);
                  break;
                }
              }
            }
            return surfaceDeferredCharacterChoice(result);
          }

          '''.replace('\n          ', '\n').lstrip()
          replace_once('app/quick-duel-playtest-host.ts',
              'export function applyQuickDuelPlaytestTransition<\n',
              host_fn + 'export function applyQuickDuelPlaytestTransition<\n')
          replace_once('app/quick-duel-playtest-host.ts',
              '  const structured = { ...next, ...applyQuickDuelStructuredTransition(previous, next, lookup) } as Match;\n  return publishCharacterCombatTransition(previous, structured, lookup);\n',
              '  const structured = { ...next, ...applyQuickDuelStructuredTransition(previous, next, lookup) } as Match;\n  const combat = publishCharacterCombatTransition(previous, structured, lookup);\n  return publishQueuedCharacterCardModifications(combat);\n')
          replace_once('app/quick-duel-playtest-host.ts',
              '''  return {
                match: withActorBoards(match, actor, hosted.boards),
                commands: hosted.commands,
                activatedComboIds: hosted.activatedComboIds,
              };
          '''.replace('\n          ', '\n').lstrip(),
              '''  let hostedBoards = hosted.boards;
              for (const modifiedCardType of runtimeCommandCardModificationTypes(hosted.commands)) {
                hostedBoards = { ...hostedBoards, opponent: queueOpponentCardModification(hostedBoards.opponent, modifiedCardType) };
              }
              return {
                match: withActorBoards(match, actor, hostedBoards),
                commands: hosted.commands,
                activatedComboIds: hosted.activatedComboIds,
              };
          '''.replace('\n          ', '\n').lstrip())

          replace_once('app/playtest.tsx',
              'import { characterAllowedAttackZones, characterAttackModifier, characterCanEquip, characterDamageReduction, type CharacterRuntimeChoice, type CharacterRuntimeEvent } from "./character-runtime";\n',
              'import { characterAllowedAttackZones, characterAttackModifier, characterCanEquip, characterDamageReduction, type CharacterRuntimeChoice, type CharacterRuntimeEvent } from "./character-runtime";\nimport { queueOpponentCardModification, runtimeCommandCardModificationTypes } from "./character-card-modification-facts";\n')
          replace_once('app/playtest.tsx',
              '  return applyStage3CCommands(board, commands.map((command) => ({ ...command, target: "self" })), controller);\n',
              '  let next = applyStage3CCommands(board, commands.map((command) => ({ ...command, target: "self" })), controller);\n  if (target === "opponent") {\n    for (const modifiedCardType of runtimeCommandCardModificationTypes(commands)) next = queueOpponentCardModification(next, modifiedCardType);\n  }\n  return next;\n')
          replace_once('app/playtest.tsx',
              '    next = { ...next, nextAttackBonus: next.nextAttackBonus - attackPenalty };\n',
              '    next = queueOpponentCardModification({ ...next, nextAttackBonus: next.nextAttackBonus - attackPenalty }, "Attack");\n')
          replace_once('app/playtest.tsx',
              '    next = { ...next, nextDefenseCardBonus: (next.nextDefenseCardBonus ?? 0) - defensePenalty };\n',
              '    next = queueOpponentCardModification({ ...next, nextDefenseCardBonus: (next.nextDefenseCardBonus ?? 0) - defensePenalty }, "Defense");\n')
          # These legacy non-Core support paths still mutate target Guard directly; preserve provenance generically.
          text = Path('app/playtest.tsx').read_text()
          old = 'if (defensePenalty) nextAi = { ...nextAi, nextDefenseCardBonus: (nextAi.nextDefenseCardBonus ?? 0) - defensePenalty };'
          if old in text:
              text = text.replace(old, 'if (defensePenalty) nextAi = queueOpponentCardModification({ ...nextAi, nextDefenseCardBonus: (nextAi.nextDefenseCardBonus ?? 0) - defensePenalty }, "Defense");', 1)
          old = 'if (defensePenalty) nextPlayer = { ...nextPlayer, nextDefenseCardBonus: (nextPlayer.nextDefenseCardBonus ?? 0) - defensePenalty };'
          if old in text:
              text = text.replace(old, 'if (defensePenalty) nextPlayer = queueOpponentCardModification({ ...nextPlayer, nextDefenseCardBonus: (nextPlayer.nextDefenseCardBonus ?? 0) - defensePenalty }, "Defense");', 1)
          Path('app/playtest.tsx').write_text(text)

          p = Path('content/card-effects/characters.json')
          data = json.loads(p.read_text())
          green = next(e for e in data['cards']['DDB-CHR-CORE-005']['effects'] if e.get('resolver') == 'character.green.repeatModifiedCardTypeBonus')
          green['amount'] = 1
          p.write_text(json.dumps(data, separators=(',', ':')))

          test = '''import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          import test from "node:test";

          import { applyCharacterRuntimeEvent } from "../app/character-runtime.ts";
          import { queueOpponentCardModification, runtimeCommandCardModificationTypes } from "../app/character-card-modification-facts.ts";
          import { applyQuickDuelPlaytestTransition, resolveQuickDuelPlaytestCharacterChoice } from "../app/quick-duel-playtest-host.ts";

          function board(overrides = {}) {
            return {
              fighterId: "DDB-CHR-CORE-001", belt: 3, hp: 25, maxHp: 25, xp: 0, focus: 0, tempSpeed: 0, nextAttackBonus: 0, nextDefenseCardBonus: 0, nextAttackHasFlow: false, nextAttackAnyZone: false, attacksThisTurn: 0, zonesPlayed: [], cardsThisTurn: [], equipment: [], exhaustedEquipment: [], hand: ["h1", "h2"], deck: ["d1", "d2"], discard: [], destroyed: [], learnedCombos: [], triggeredCombos: [], cardsBought: 0, usedConsumableThisRound: false, wasHitSinceLastTurn: false, damageReductionUsed: false, reversalAttackBonus: 0, borrowedEquipmentId: null, abilityUsedRound: false, usedCharacterEffectIdsThisTurn: [], usedCharacterEffectIdsThisRound: [], usedCharacterEffectIdsThisGame: [], characterMarks: {}, stage3cStatuses: [], stage3cChoices: [], stage3cRestrictions: [], damageDealt: 0, damageTaken: 0, completedBeltExamThisRound: false, ...overrides,
            };
          }

          function match(player = board(), ai = board()) {
            return { schema: 8, player, ai, market: [], round: 1, phase: "player-yell", turnOrder: ["player", "ai"], turnIndex: 0, lastExchange: null, pendingChoice: null, winner: null, log: [] };
          }

          const lookup = () => null;

          test("Coach Karen White resolves from a semantic Attack modification and Green immediately arms +1 Attack Power", () => {
            const coach = board({ fighterId: "DDB-CHR-CORE-005", belt: 3 });
            const first = applyCharacterRuntimeEvent(coach, board(), { type: "cardModified", opponentModifiedCard: true, modifiedCardType: "Attack" }, "player");
            assert.equal(first.choices.length, 1);
            assert.ok(first.self.hand.includes("d2"), "White draws before asking what to discard");
            const resolved = applyCharacterRuntimeEvent(first.self, first.opponent, { ...first.event, selectedId: "h1" }, "player");
            assert.equal(resolved.choices.length, 0);
            assert.equal(resolved.self.nextAttackBonus, 1);
            assert.equal(resolved.self.discard.at(-1), "h1");
            assert.equal(resolved.self.characterMarks["round:modifiedCardType"], undefined);
          });

          test("Coach Karen Green arms +1 Guard for a Defense modification and AI uses the same runtime contract", () => {
            const coach = board({ fighterId: "DDB-CHR-CORE-005", belt: 3 });
            const resolved = applyCharacterRuntimeEvent(coach, board(), { type: "cardModified", opponentModifiedCard: true, modifiedCardType: "Defense" }, "ai");
            assert.equal(resolved.choices.length, 0);
            assert.equal(resolved.self.nextDefenseCardBonus, 1);
            assert.equal(resolved.self.hand.length, 2, "AI draws one and discards one through White");
          });

          test("Coach Karen White/Green remain once per round", () => {
            const coach = board({ fighterId: "DDB-CHR-CORE-005", belt: 3 });
            const first = applyCharacterRuntimeEvent(coach, board(), { type: "cardModified", modifiedCardType: "Attack" }, "ai");
            const second = applyCharacterRuntimeEvent(first.self, first.opponent, { type: "cardModified", modifiedCardType: "Defense" }, "ai");
            assert.equal(second.self.nextAttackBonus, 1);
            assert.equal(second.self.nextDefenseCardBonus, 0);
            assert.deepEqual(second.self.hand, first.self.hand);
          });

          test("queued opponent modification facts publish through Quick Duel and surface the human White choice", () => {
            const previous = match(board({ fighterId: "DDB-CHR-CORE-005", belt: 3 }));
            const next = { ...previous, player: queueOpponentCardModification(previous.player, "Attack") };
            const hosted = applyQuickDuelPlaytestTransition(previous, next, lookup);
            assert.equal(hosted.pendingChoice?.kind, "character-runtime");
            assert.equal(hosted.pendingChoice?.event?.type, "cardModified");
            assert.equal(hosted.pendingChoice?.event?.modifiedCardType, "Attack");
            const resumed = resolveQuickDuelPlaytestCharacterChoice(hosted, "player", hosted.pendingChoice.event, hosted.pendingChoice.choice, "h1");
            assert.equal(resumed.match.player.nextAttackBonus, 1);
          });

          test("runtime-command provenance recognizes only opponent-targeted next Attack/Defense card modifiers", () => {
            assert.deepEqual(runtimeCommandCardModificationTypes([
              { effect: "combat.modifyAttackPower", target: "opponent", duration: "nextAttack" },
              { effect: "combat.modifyGuard", target: "opponent", duration: "nextDefense" },
              { effect: "combat.modifySpeed", target: "opponent", duration: "endOfRound" },
              { effect: "combat.modifyAttackPower", target: "self", duration: "nextAttack" },
            ]), ["Attack", "Defense"]);
          });

          test("Coach integration stays generic and canonical", async () => {
            const [runtime, playtest, routes, canonical] = await Promise.all([
              readFile(new URL("../app/character-runtime.ts", import.meta.url), "utf8"),
              readFile(new URL("../app/playtest.tsx", import.meta.url), "utf8"),
              readFile(new URL("../app/quick-duel-character-event-routes.ts", import.meta.url), "utf8"),
              readFile(new URL("../content/card-effects/characters.json", import.meta.url), "utf8"),
            ]);
            assert.match(runtime, /character\\.opponentModificationCycle": \\["cardModified"\\]/);
            assert.match(runtime, /character\\.green\\.repeatModifiedCardTypeBonus": \\["cardModified"\\]/);
            assert.match(routes, /event: "cardModified"/);
            assert.doesNotMatch(playtest, /Coach Karen|DDB-CHR-CORE-005/);
            const registry = JSON.parse(canonical);
            const green = registry.cards["DDB-CHR-CORE-005"].effects.find((effect) => effect.resolver === "character.green.repeatModifiedCardTypeBonus");
            assert.equal(green.amount, 1);
          });
          '''.replace('\n          ', '\n').lstrip()
          Path('tests/quick-duel-character-coach-modification-host.test.mjs').write_text(test)

          p = Path('package.json')
          pkg = json.loads(p.read_text())
          coach_test = 'tests/quick-duel-character-coach-modification-host.test.mjs'
          if coach_test not in pkg['scripts']['test']:
              pkg['scripts']['test'] += ' ' + coach_test
          p.write_text(json.dumps(pkg, indent=2) + '\n')
          PY

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate canonical mirrors
        run: npm run game:generate

      - name: Canonical drift check
        run: npm run game:check

      - name: Focused Coach runtime certification
        run: node --experimental-strip-types --test tests/quick-duel-character-coach-modification-host.test.mjs

      - name: Current repository test gate
        run: npm test

      - name: Production build
        run: npm run build

      - name: Commit certified reconstruction and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/temp-stage3e-coach-rebuild.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete Coach Karen card-modification runtime seam"
          git push origin HEAD:stage3e-coach-card-modified-current-main
