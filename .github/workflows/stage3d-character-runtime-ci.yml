name: Stage 3D Character Runtime CI

on:
  push:
    branches:
      - stage3d-character-runtime
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  character-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply guarded Character runtime integration
        run: |
          node scripts/apply-stage3d-character-runtime.mjs
          python3 - <<'PY'
          from pathlib import Path

          runtime_path = Path("app/character-runtime.ts")
          text = runtime_path.read_text()
          text = text.replace('import cardEffectsJson from "./data/card-effects.json";', 'import cardEffectsJson from "./data/card-effects.json" with { type: "json" };')
          text = text.replace('&& greenCharacterAbilityUnlocked(resolver, board.belt)', '&& (!resolver.startsWith("character.green.") || greenCharacterAbilityUnlocked(board.belt))')
          text = text.replace('effect.resolver === "character.cannotEquipWeapons" && greenCharacterAbilityUnlocked(String(effect.resolver), board.belt)', 'effect.resolver === "character.cannotEquipWeapons"')
          text = text.replace('  const choices: CharacterRuntimeChoice[] = [];\n  const notes: string[] = [];\n\n  for (const effect of effectsFor(self.fighterId)) {\n    if (!isAvailable(self, effect, event.type)) continue;\n    const resolver = String(effect.resolver ?? "");', '  const choices: CharacterRuntimeChoice[] = [];\n  const notes: string[] = [];\n  const processedResolvers = new Set<string>();\n\n  for (const effect of effectsFor(self.fighterId)) {\n    const resolver = String(effect.resolver ?? "");\n    if (processedResolvers.has(resolver) || !isAvailable(self, effect, event.type)) continue;\n    processedResolvers.add(resolver);')
          text = text.replace('opponent = { ...opponent, nextAttackBonus: opponent.nextAttackBonus - amount };', 'opponent = { ...opponent, nextAttackBonus: opponent.nextAttackBonus + amount };')
          runtime_path.write_text(text)

          playtest_path = Path("app/playtest.tsx")
          playtest = playtest_path.read_text()
          playtest = playtest.replace('next = characterReduction.board;', 'next = characterReduction.board as Board;')
          playtest = playtest.replace('applyHideReady(resetCharacterTurn(characterHide.self as Board))', 'applyHideReady(resetCharacterTurn(characterHide.self as Board) as unknown as Board)')
          playtest_path.write_text(playtest)
          PY

      - name: Check patch whitespace
        run: git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Generate canonical registries
        run: npm run game:generate

      - name: Check generated-data drift and static sources
        run: npm run game:check

      - name: Character runtime certification tests
        run: node --test tests/character-family-registry.test.mjs tests/character-runtime-enforcement.test.mjs

      - name: Complete repository tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Commit validated integration patch
        if: github.event_name == 'push'
        run: |
          if git diff --quiet; then
            echo "No generated integration patch remains to commit."
            exit 0
          fi
          git config user.name "Dojo Runtime CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/character-runtime.ts app/playtest.tsx
          git commit -m "Stage 3D: wire Character runtime into Quick Duel [skip ci]"
          git push origin HEAD:stage3d-character-runtime

      - name: Verify clean working tree
        run: test -z "$(git status --porcelain)"
