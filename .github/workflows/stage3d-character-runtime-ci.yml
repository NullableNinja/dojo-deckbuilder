name: Stage 3D Character Runtime CI

on:
  push:
    branches:
      - stage3d-character-runtime
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  character-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply guarded Character runtime integration in the CI workspace
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply-stage3d-character-runtime.mjs")
          script = path.read_text()
          old_search = "'    if (!hit) nextAi = { ...nextAi, blockedSinceLastTurn: true, blockedThisRound: true };\\n    nextPlayer = applyCardEffects(nextPlayer, card, \\\"player\\\", hit ? \\\"onHit\\\" : \\\"afterResolve\\\");'"
          old_replacement = "'    if (!hit) { nextAi = { ...nextAi, blockedSinceLastTurn: true, blockedThisRound: true }; const blockEvent = runCharacterEvent(nextAi, nextPlayer, { type: \\\"block\\\", card: defenseCard, zone, blocked: true }, \\\"ai\\\"); nextAi = blockEvent.self; nextPlayer = blockEvent.opponent; }\\n    const cardPlayed = runCharacterEvent(nextPlayer, nextAi, { type: \\\"cardPlayed\\\", card, zone, noPrintedNumericEffect: !hasPrintedNumericRulesEffect(card), thirdDifferentCardTypeThisTurn: new Set([...nextPlayer.cardsThisTurn.map((id) => cardFor(id)?.cardType), card.cardType].filter(Boolean)).size >= 3, completedBeltExam: Boolean(nextPlayer.completedBeltExamThisRound) }, \\\"player\\\");\\n    nextPlayer = cardPlayed.self; nextAi = cardPlayed.opponent;\\n    nextPlayer = applyCardEffects(nextPlayer, card, \\\"player\\\", hit ? \\\"onHit\\\" : \\\"afterResolve\\\");'"
          new_search = "'    if (defenseCard) nextAi = { ...nextAi, hand: removeOne(nextAi.hand, defenseCard.id), discard: [...nextAi.discard, defenseCard.id], xp: nextAi.xp + 1, defendedThisRound: true, playedDefenseSinceLastTurn: true, blockedSinceLastTurn: !hit || Boolean(nextAi.blockedSinceLastTurn), blockedThisRound: !hit || Boolean(nextAi.blockedThisRound), nextDefenseCardBonus: 0 };\\n    if (!hit) nextAi = { ...nextAi, blockedSinceLastTurn: true, blockedThisRound: true };\\n    nextPlayer = applyCardEffects(nextPlayer, card, \\\"player\\\", hit ? \\\"onHit\\\" : \\\"afterResolve\\\");'"
          new_replacement = "'    if (defenseCard) nextAi = { ...nextAi, hand: removeOne(nextAi.hand, defenseCard.id), discard: [...nextAi.discard, defenseCard.id], xp: nextAi.xp + 1, defendedThisRound: true, playedDefenseSinceLastTurn: true, blockedSinceLastTurn: !hit || Boolean(nextAi.blockedSinceLastTurn), blockedThisRound: !hit || Boolean(nextAi.blockedThisRound), nextDefenseCardBonus: 0 };\\n    if (!hit) { nextAi = { ...nextAi, blockedSinceLastTurn: true, blockedThisRound: true }; const blockEvent = runCharacterEvent(nextAi, nextPlayer, { type: \\\"block\\\", card: defenseCard, zone, blocked: true }, \\\"ai\\\"); nextAi = blockEvent.self; nextPlayer = blockEvent.opponent; }\\n    const cardPlayed = runCharacterEvent(nextPlayer, nextAi, { type: \\\"cardPlayed\\\", card, zone, noPrintedNumericEffect: !hasPrintedNumericRulesEffect(card), thirdDifferentCardTypeThisTurn: new Set([...nextPlayer.cardsThisTurn.map((id) => cardFor(id)?.cardType), card.cardType].filter(Boolean)).size >= 3, completedBeltExam: Boolean(nextPlayer.completedBeltExamThisRound) }, \\\"player\\\");\\n    nextPlayer = cardPlayed.self; nextAi = cardPlayed.opponent;\\n    nextPlayer = applyCardEffects(nextPlayer, card, \\\"player\\\", hit ? \\\"onHit\\\" : \\\"afterResolve\\\");'"
          script = script.replace(old_search, new_search).replace(old_replacement, new_replacement)
          path.write_text(script)
          PY
          node scripts/apply-stage3d-character-runtime.mjs

      - name: Check patch whitespace
        run: git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Generate canonical registries
        run: npm run game:generate

      - name: Check generated-data drift and static sources
        run: npm run game:check

      - name: Character runtime certification tests
        run: node --test tests/character-family-registry.test.mjs tests/character-runtime-enforcement.test.mjs

      - name: Complete repository tests
        run: npm test

      - name: Production build
        run: npm run build
