name: Stage 3D Character Runtime CI

on:
  push:
    branches:
      - stage3d-character-runtime
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  character-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply guarded Character runtime integration in the CI workspace
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply-stage3d-character-runtime.mjs")
          script = path.read_text()
          script = script.replace(
              'if (text.indexOf(search, index + search.length) >= 0) throw new Error(`Stage 3D patch anchor is not unique: ${label}`);',
              'if (text.indexOf(search, index + search.length) >= 0 && label !== "player Attack cardPlayed and AI Block Character event") throw new Error(`Stage 3D patch anchor is not unique: ${label}`);'
          )
          path.write_text(script)
          PY
          node scripts/apply-stage3d-character-runtime.mjs
          python3 - <<'PY'
          from pathlib import Path
          path = Path("app/playtest.tsx")
          text = path.read_text()

          # The broad round-start replacement also touched the initial Match literal.
          text = text.replace(
              'pendingDiscard: null, pendingChoice: characterRoundChoice, pendingCombatContinuation:',
              'pendingDiscard: null, pendingChoice: null, pendingCombatContinuation:',
              1,
          )

          # Repair the AI reset closing/cast and keep AI marks sourced from the AI board.
          old = 'characterMarks: Object.fromEntries(Object.entries(current.player.characterMarks ?? {}).filter(([key]) => !key.startsWith("turn:") && !key.startsWith("round:"))) });\n  const marketState'
          new = 'characterMarks: Object.fromEntries(Object.entries(current.ai.characterMarks ?? {}).filter(([key]) => !key.startsWith("turn:") && !key.startsWith("round:"))) } as Board) as unknown as Board);\n  const marketState'
          if old not in text:
              raise SystemExit("AI round-reset repair anchor missing")
          text = text.replace(old, new, 1)

          # Preserve the rich Board type after Character runtime callbacks.
          text = text.replace(
              '      let player = {\n        ...current.player,\n        hand: removeOne(current.player.hand, cardId),',
              '      let player: Board = {\n        ...current.player,\n        hand: removeOne(current.player.hand, cardId),',
              1,
          )
          text = text.replace(
              '      let player = { ...current.player, hand: removeOne(current.player.hand, cardId), discard: [...current.player.discard, cardId] };',
              '      let player: Board = { ...current.player, hand: removeOne(current.player.hand, cardId), discard: [...current.player.discard, cardId] };',
              1,
          )

          # Narrow the Character union again inside the JSX callback.
          text = text.replace(
              'optionCard?.catalogId ?? match.pendingChoice!.choice.resolver',
              'optionCard?.catalogId ?? (match.pendingChoice?.kind === "character" ? match.pendingChoice.choice.resolver : "")',
          )

          path.write_text(text)
          PY

      - name: Show patched type-error context
        run: |
          nl -ba app/playtest.tsx | sed -n '2254,2266p'
          nl -ba app/playtest.tsx | sed -n '2326,2338p'
          nl -ba app/playtest.tsx | sed -n '2988,3003p'
          nl -ba app/playtest.tsx | sed -n '3129,3137p'

      - name: Check patch whitespace
        run: git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Generate canonical registries
        run: npm run game:generate

      - name: Check generated-data drift and static sources
        run: npm run game:check

      - name: Character runtime certification tests
        run: node --test tests/character-family-registry.test.mjs tests/character-runtime-enforcement.test.mjs

      - name: Complete repository tests
        run: npm test

      - name: Production build
        run: npm run build
