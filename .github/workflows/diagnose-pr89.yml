name: Repair PR89 stale purchase guard

on:
  push:
    branches:
      - stage3e-character-purchase-attempt-event

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage3e-character-purchase-attempt-event
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - name: Update the stale Market purchase assertion
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'tests/content-integrity.test.mjs';
          let source = fs.readFileSync(path, 'utf8');
          const before = String.raw`assert.match(playtest, /Bought \$\{card\.name\} for \$\{price\} Focus \(\$\{focusBefore\} → \$\{nextPlayer\.focus\}\)/);`;
          const after = String.raw`assert.match(playtest, /Bought \$\{card\.name\} for \$\{characterPurchase\.price\} Focus \(\$\{focusBefore\} → \$\{nextPlayer\.focus\}\)/);`;
          if (!source.includes(before)) throw new Error('Expected stale Market purchase assertion was not found');
          source = source.replace(before, after);
          fs.writeFileSync(path, source);
          NODE
          rm -rf diagnostics
          rm -f .github/workflows/diagnose-pr89.yml
      - name: Certify repaired branch locally
        run: npm test
      - name: Commit repaired guard and cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix PR 89 purchase integrity guard and remove diagnostics [skip ci]"
          git push origin HEAD:stage3e-character-purchase-attempt-event
