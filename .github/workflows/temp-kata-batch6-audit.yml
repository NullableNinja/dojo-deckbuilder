name: Temporary Kata batch6 audit
on:
  push:
    branches: [fix/effect-runtime-certification-batch6]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Pinpoint next-Defense host calls
        shell: bash
        run: |
          echo '=== STAGE3C NEXT DEFENSE CALLS ==='
          grep -n -A15 -B15 'stage3cNextDefenseGuardBonus' app/playtest.tsx || true
          echo '=== CONSUME DEFENSE CALLS ==='
          grep -n -A15 -B15 'stage3cConsumeDefenseStatuses' app/playtest.tsx || true
          echo '=== BOUGHT CARD CARRYOVER WRITES ==='
          grep -n -A8 -B8 'boughtCardLastAscend' app/playtest.tsx || true
