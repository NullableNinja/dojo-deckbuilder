name: Validate Stage 3B Attack Family Registry

on:
  push:
    branches: [stage3b-attacks-family-registry]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run automated tests
        run: npm test

      - name: Build production site
        run: npm run build
