name: Stage 3 final one-time remediation

on:
  push:
    branches:
      - stage3-final-machine-readable-certification

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage3-final-machine-readable-certification
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply final structured host remediation
        run: node scripts/stage3-final-remediate-playtest.mjs
      - name: Compile and build remediated source
        run: npm run build
      - name: Run final architecture certification
        run: node --experimental-strip-types --test tests/final-machine-readable-effects-certification.test.mjs
      - name: Commit remediated Playtest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/playtest.tsx
          git commit -m "close Core Playtest structured host boundaries"
          git push origin HEAD:stage3-final-machine-readable-certification
