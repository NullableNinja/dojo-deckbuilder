name: Stage 3 final one-time remediation

on:
  push:
    branches:
      - stage3-final-machine-readable-certification

permissions:
  contents: write

jobs:
  remediate:
    if: github.event.head_commit.message == 'retry Character and Location host-boundary remediation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage3-final-machine-readable-certification
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Narrow the one-time Location Focus replacement boundary
        run: sed -i 's/function stage3cDefenseContext(/function printedAttackRuleModifier(/' scripts/stage3-final-remediate-host-boundaries.mjs
      - name: Apply Character and Location host-boundary remediation
        run: node scripts/stage3-final-remediate-host-boundaries.mjs
      - name: Compile and build remediated source
        run: npm run build
      - name: Run final architecture certification
        run: node --experimental-strip-types --test tests/final-machine-readable-effects-certification.test.mjs
      - name: Commit remediated Playtest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/playtest.tsx
          git commit -m "route Character and Location gameplay through structured host boundaries"
          git push origin HEAD:stage3-final-machine-readable-certification
