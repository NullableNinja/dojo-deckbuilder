name: Temporary Kata host audit
on:
  push:
    branches:
      - fix/kata-runtime-certification-batch3
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - run: npm ci
      - name: Audit Kata resolver host coverage
        run: |
          node scripts/tmp-kata-host-audit.mjs
          echo '=== LEGACY KATA NAME REFERENCES ==='
          grep -RInE 'Morning-Shift Meditation|After-Action Huddle|Breath Control|Kusanku|Sanchin|Shadowboxing|Mirror Form|Recovery Stance|Weapon Form' app/playtest.tsx app/effect-resolvers-legacy.ts | head -300 || true
          echo '=== KATA COMMAND KIND REFERENCES ==='
          grep -RInE 'armDeferredConditional|resolveDeferredEvent|armPurchaseDiscount|promptChoice|promptEquipmentActivation|armAttackRestriction|promptEquipmentChoice|armControlledEscalation|revealUntilMatch|armZoneAttackReward|recycleDiscardCard|markCardForReward|armDamagePrevention|copyLastOpponentKata|recoverThenDiscard|resolveComboHitReward|armComboDiscount|promptVariableCycle|armThreeZonePlan|equipFromHand|armWeaponModifier' app/playtest.tsx app/effect-resolvers.ts app/kata-playtest-bridge.ts || true
