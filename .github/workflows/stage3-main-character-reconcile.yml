name: Stage 3 micro Character reconciliation

on:
  push:
    branches:
      - main
    paths:
      - scripts/reconcile-stage3-character-compat.mjs
      - .github/workflows/stage3-main-character-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile-character-runtime:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply guarded Character reconciliation
        run: node scripts/reconcile-stage3-character-compat.mjs

      - name: TypeScript gate
        run: npx tsc --noEmit

      - name: Character migration regression
        run: node --experimental-strip-types --test tests/quick-duel-character-migration.test.mjs

      - name: Full repository test gate
        shell: bash
        run: |
          set +e
          npm test > stage3-full-test.log 2>&1
          status=$?
          set -e
          {
            echo "## Stage 3 full-suite diagnostic"
            echo '```text'
            grep -n -E 'not ok|AssertionError|ERR_ASSERTION|# fail|Error:' stage3-full-test.log | tail -n 120 || true
            echo '```'
          } | tee stage3-full-test-failure.txt >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload full-suite diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-character-reconcile-test-log
          path: |
            stage3-full-test.log
            stage3-full-test-failure.txt
          if-no-files-found: warn
          retention-days: 3

      - name: Remove one-time authoring machinery
        run: rm scripts/reconcile-stage3-character-compat.mjs .github/workflows/stage3-main-character-reconcile.yml

      - name: Commit repaired Character integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/playtest.tsx scripts/reconcile-stage3-character-compat.mjs .github/workflows/stage3-main-character-reconcile.yml
          git commit -m "Stage 3 micro 12: reconcile Character helpers in Playtest"
          git push origin HEAD:main
