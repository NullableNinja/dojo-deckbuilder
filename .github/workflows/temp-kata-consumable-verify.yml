name: Temporary Kata Consumable verify
on:
  push:
    branches:
      - fix/kata-consumable-runtime-certification
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - run: npm ci
      - run: node --experimental-strip-types --test tests/quick-duel-kata-consumable-runtime.test.mjs
      - run: npm run verify
      - run: git diff --check
