name: Apply Stage 3C Hide Reaction History Batch Once

on:
  push:
    branches:
      - stage3c-play-surface-remediation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Hide and Reaction-history batch
        run: |
          python3 scripts/_stage3c_hide_reaction_history_batch.py
          git diff --check
          node --test tests/stage3c-consumable-hide-followup.test.mjs
      - name: Commit product changes
        run: |
          rm scripts/_stage3c_hide_reaction_history_batch.py
          rm .github/workflows/apply-stage3c-hide-reaction-history-batch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/playtest.tsx tests/stage3c-consumable-hide-followup.test.mjs tests/playtest-effect-integration.test.mjs scripts/_stage3c_hide_reaction_history_batch.py .github/workflows/apply-stage3c-hide-reaction-history-batch.yml
          git commit -m "fix: persist Consumable Hide effects and Reaction history"
          git push origin HEAD:stage3c-play-surface-remediation
