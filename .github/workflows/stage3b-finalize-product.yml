name: Stage 3B finalize verified product patch

on:
  push:
    branches:
      - stage3b-attack-eleven
    paths:
      - .github/workflows/stage3b-finalize-product.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: stage3b-attack-eleven
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply verified combat corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          playtest_path = Path("app/playtest.tsx")
          source = playtest_path.read_text()

          old = '    if (!hit && defenseCard) nextPlayer = { ...nextPlayer, blockedSinceLastTurn: true, blockedThisRound: true };'
          new = '    if (!hit) nextPlayer = { ...nextPlayer, blockedSinceLastTurn: true, blockedThisRound: true };'
          if source.count(old) != 1:
              raise SystemExit(f"expected one player Block-memory target, found {source.count(old)}")
          source = source.replace(old, new, 1)

          old = '    const rawDamage = hit ? Math.max(0, pending.attackPower - defensePower + (pending.damageModifier ?? 0)) : 0;'
          new = '    const rawDamage = hit ? Math.max(0, finalAttackPower - defensePower + (pending.damageModifier ?? 0)) : 0;'
          if source.count(old) != 1:
              raise SystemExit(f"expected one post-Defense damage target, found {source.count(old)}")
          source = source.replace(old, new, 1)

          normal_defense = '    if (defenseCard) nextAi = { ...nextAi, hand: removeOne(nextAi.hand, defenseCard.id), discard: [...nextAi.discard, defenseCard.id], xp: nextAi.xp + 1, defendedThisRound: true, playedDefenseSinceLastTurn: true, blockedSinceLastTurn: !hit || Boolean(nextAi.blockedSinceLastTurn), blockedThisRound: !hit || Boolean(nextAi.blockedThisRound), nextDefenseCardBonus: 0 };'
          normal_memory = '    if (!hit) nextAi = { ...nextAi, blockedSinceLastTurn: true, blockedThisRound: true };'
          if source.count(normal_defense) != 1:
              raise SystemExit(f"expected one normal AI Defense target, found {source.count(normal_defense)}")
          source = source.replace(normal_defense, normal_defense + "\n" + normal_memory, 1)

          reversal_defense = '    if (defenseCard) nextAi = { ...nextAi, hand: removeOne(nextAi.hand, defenseCard.id), playArea: [...nextAi.playArea, defenseCard.id], xp: nextAi.xp + 1, defendedThisRound: true, playedDefenseSinceLastTurn: true, blockedSinceLastTurn: !hit || Boolean(nextAi.blockedSinceLastTurn), blockedThisRound: !hit || Boolean(nextAi.blockedThisRound), nextDefenseCardBonus: 0 };'
          if source.count(reversal_defense) != 1:
              raise SystemExit(f"expected one Reversal AI Defense target, found {source.count(reversal_defense)}")
          source = source.replace(reversal_defense, reversal_defense + "\n" + normal_memory, 1)
          playtest_path.write_text(source)

          test_path = Path("tests/attack-structured-resolvers-batch.test.mjs")
          tests = test_path.read_text()
          marker = 'test("post-Defense Attack modifiers feed final power into AI damage math"'
          if marker not in tests:
              tests += '''\n\ntest("post-Defense Attack modifiers feed final power into AI damage math", async () => {\n  const source = await readFile(new URL("../app/playtest.tsx", import.meta.url), "utf8");\n  assert.match(source, /const finalAttackPower = Math\\.max\\(0, pending\\.attackPower \\+ postDefensePower\\.amount\\);/);\n  assert.match(source, /const rawDamage = hit \\? Math\\.max\\(0, finalAttackPower - defensePower \\+ \\(pending\\.damageModifier \\?\\? 0\\)\\) : 0;/);\n  assert.doesNotMatch(source, /const rawDamage = hit \\? Math\\.max\\(0, pending\\.attackPower - defensePower \\+ \\(pending\\.damageModifier \\?\\? 0\\)\\) : 0;/);\n});\n\ntest("Block memory includes zero-damage strikes stopped by standing DEF or Armor", async () => {\n  const source = await readFile(new URL("../app/playtest.tsx", import.meta.url), "utf8");\n  assert.match(source, /if \\(!hit\\) nextPlayer = \\{ \\.\\.\\.nextPlayer, blockedSinceLastTurn: true, blockedThisRound: true \\};/);\n  const aiBlockMemory = source.match(/if \\(!hit\\) nextAi = \\{ \\.\\.\\.nextAi, blockedSinceLastTurn: true, blockedThisRound: true \\};/g) ?? [];\n  assert.ok(aiBlockMemory.length >= 2, "normal Attacks and Reversals must both remember standing-DEF Blocks");\n  assert.doesNotMatch(source, /if \\(!hit && defenseCard\\) nextPlayer = \\{ \\.\\.\\.nextPlayer, blockedSinceLastTurn: true, blockedThisRound: true \\};/);\n});\n'''
          test_path.write_text(tests)
          PY

      - name: Verify focused regressions
        run: node --experimental-strip-types --test tests/attack-structured-resolvers-batch.test.mjs

      - name: Run full repository suite
        run: npm test

      - name: Commit verified product files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/playtest.tsx tests/attack-structured-resolvers-batch.test.mjs
          test -n "$(git status --short)" || { echo "No product changes to commit"; exit 1; }
          git commit -m "fix: certify Block memory and post-Defense damage"
          git push origin HEAD:stage3b-attack-eleven
