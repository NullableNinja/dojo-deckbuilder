name: Apply pending-choice resolution hotfix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-pending-choice-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clear resolved combat choices and add regression coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('app/playtest.tsx')
          source = source_path.read_text(encoding='utf-8')
          old = 'pendingStrike: null, pendingCombatContinuation: null, exchangeSequence: (current.exchangeSequence ?? 0) + 1, lastExchange, winner: nextPlayer.hp ? null : "ai"'
          new = 'pendingStrike: null, pendingChoice: null, pendingCombatContinuation: null, exchangeSequence: (current.exchangeSequence ?? 0) + 1, lastExchange, winner: nextPlayer.hp ? null : "ai"'
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one unresolved combat write, found {count}')
          source_path.write_text(source.replace(old, new, 1), encoding='utf-8')

          test_path = Path('tests/pending-choice-resolution.test.mjs')
          test_path.write_text('''import test from "node:test";\nimport assert from "node:assert/strict";\nimport { readFile } from "node:fs/promises";\n\nconst playtest = await readFile(new URL("../app/playtest.tsx", import.meta.url), "utf8");\n\ntest("resolved incoming damage choice is cleared before combat continues", () => {\n  assert.match(\n    playtest,\n    /Tempo \\+1 Guard[\\s\\S]{0,1200}pendingStrike:\\s*null,\\s*pendingChoice:\\s*null,\\s*pendingCombatContinuation:\\s*null/,\n    "resolveDefenseState must clear the consumed pendingChoice when the strike is finalized",\n  );\n});\n\ntest("both optional damage buttons re-enter resolution without reopening the prompt", () => {\n  assert.match(playtest, /usePendingEquipmentChoice[\\s\\S]{0,700}resolveDefenseState\\(current, choice\\.defenseId,[\\s\\S]{0,350}, true\\)/);\n  assert.match(playtest, /skipPendingChoice[\\s\\S]{0,500}resolveDefenseState\\(current, choice\\.defenseId, null, true\\)/);\n});\n''', encoding='utf-8')
          PY

      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name "Thomas Bryant"
          git config user.email "130773741+NullableNinja@users.noreply.github.com"
          git add app/playtest.tsx tests/pending-choice-resolution.test.mjs
          git commit -m "Clear resolved Quick Duel damage choices"
          git push origin HEAD:main
