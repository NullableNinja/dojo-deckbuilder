name: Stage 3B Flow migration

on:
  push:
    branches:
      - stage3b-attack-flow-batch
    paths:
      - .github/workflows/stage3b-flow-patch.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: stage3b-attack-flow-batch

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Validate diff
        run: git diff --check
