name: Stage 3B Flow migration

on:
  push:
    branches:
      - stage3b-attack-flow-batch
    paths:
      - .github/workflows/stage3b-flow-patch.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: stage3b-attack-flow-batch
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture automated test output
        shell: bash
        run: |
          set +e
          npm test > stage3b-test-output.txt 2>&1
          code=$?
          cat stage3b-test-output.txt
          echo "$code" > stage3b-test-exit-code.txt
          exit 0

      - name: Preserve diagnostics on branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stage3b-test-output.txt stage3b-test-exit-code.txt
          git commit -m "chore: capture Stage 3B test diagnostics"
          git push origin HEAD:stage3b-attack-flow-batch
