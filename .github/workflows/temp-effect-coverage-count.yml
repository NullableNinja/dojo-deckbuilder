name: Temporary effect coverage count
on:
  push:
    branches: [stage3e-attack-declared-current-main]
jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage3e-attack-declared-current-main
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - run: npm ci
      - name: Count remaining effect work
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { effectCoverage, effectPlanForCard, structuredEffectsForCard } from './app/card-effects.ts';
          const cards = JSON.parse(fs.readFileSync('./app/data/cards.json','utf8')).cards ?? [];
          const registry = JSON.parse(fs.readFileSync('./app/data/card-effects.json','utf8'));
          const coverage = effectCoverage(cards, registry);
          const familyOf = (card) => { const id=String(card.catalogId??''); return id.includes('-CHR-')?'Character':id.includes('-ATK-')?'Attack':id.includes('-DEF-')?'Defense':id.includes('-KAT-')?'Kata':id.includes('-CON-')?'Consumable':id.includes('-CMB-')?'Combo':id.includes('-LOC-')?'Location':(id.includes('-DEQ-')||id.includes('-GEA-'))?'Equipment':id.includes('-STA-')?'Starter':'Other'; };
          let structuredUnsupportedEffects=0;
          let structuredUnsupportedCards=0;
          let legacyUnsupportedClauses=0;
          let legacyQueuedCards=0;
          let structuredZeroResolvedCards=0;
          const structuredByFamily={}; const legacyByFamily={}; const zeroByFamily={};
          const queued=[];
          for (const card of cards) {
            const structured = structuredEffectsForCard(card, registry);
            const relevant = Boolean((structured && structured.length) || (card.rulesText && !/no (additional )?effect/i.test(card.rulesText)));
            if (!relevant) continue;
            const plan=effectPlanForCard(card, registry);
            const resolved=plan.effects.length+(plan.dedicated?.length??0);
            const family=familyOf(card);
            if (structured && structured.length && plan.unsupported.length) {
              structuredUnsupportedCards++;
              structuredUnsupportedEffects += plan.unsupported.length;
              structuredByFamily[family]=(structuredByFamily[family]??0)+plan.unsupported.length;
            }
            if (plan.source==='legacy-parser' && plan.unsupported.length) {
              legacyQueuedCards++;
              legacyUnsupportedClauses += plan.unsupported.length;
              legacyByFamily[family]=(legacyByFamily[family]??0)+plan.unsupported.length;
            }
            if (structured !== null && resolved===0 && plan.unsupported.length===0 && card.rulesText && !/no (additional )?effect/i.test(card.rulesText)) {
              structuredZeroResolvedCards++;
              zeroByFamily[family]=(zeroByFamily[family]??0)+1;
            }
            if (resolved===0 && plan.unsupported.length===0 || plan.unsupported.length) queued.push({catalogId:card.catalogId,name:card.name,family,source:plan.source,structuredEffects:structured?.length??null,resolved,unsupported:plan.unsupported,rulesText:card.rulesText});
          }
          console.log('EFFECT_COVERAGE='+JSON.stringify(coverage));
          console.log('STRUCTURED_UNSUPPORTED_CARDS='+structuredUnsupportedCards);
          console.log('STRUCTURED_UNSUPPORTED_EFFECTS='+structuredUnsupportedEffects);
          console.log('STRUCTURED_BY_FAMILY='+JSON.stringify(structuredByFamily));
          console.log('LEGACY_QUEUED_CARDS='+legacyQueuedCards);
          console.log('LEGACY_UNSUPPORTED_CLAUSES='+legacyUnsupportedClauses);
          console.log('LEGACY_BY_FAMILY='+JSON.stringify(legacyByFamily));
          console.log('STRUCTURED_ZERO_RESOLVED_CARDS='+structuredZeroResolvedCards);
          console.log('ZERO_BY_FAMILY='+JSON.stringify(zeroByFamily));
          console.log('QUEUED_DETAIL='+JSON.stringify(queued));
          NODE
