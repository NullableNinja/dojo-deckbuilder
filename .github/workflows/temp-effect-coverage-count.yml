name: Temporary effect coverage count
on:
  push:
    branches: [stage3e-attack-declared-current-main]
jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage3e-attack-declared-current-main
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - run: npm ci
      - name: Count unresolved structured effects
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { effectCoverage, effectPlanForCard } from './app/card-effects.ts';
          const cards = JSON.parse(fs.readFileSync('./app/data/cards.json','utf8')).cards ?? [];
          const registry = JSON.parse(fs.readFileSync('./app/data/card-effects.json','utf8'));
          const coverage = effectCoverage(cards, registry);
          let unsupportedEffects = 0;
          let unresolvedCards = 0;
          const byFamily = {};
          const rows = [];
          for (const card of cards) {
            const entry = registry.cards?.[card.catalogId];
            if (!entry || !Array.isArray(entry.effects) || !entry.effects.length) continue;
            const plan = effectPlanForCard(card, registry);
            if (!plan.unsupported.length) continue;
            unresolvedCards += 1;
            unsupportedEffects += plan.unsupported.length;
            const id = String(card.catalogId ?? '');
            const family = id.includes('-CHR-') ? 'Character' : id.includes('-ATK-') ? 'Attack' : id.includes('-DEF-') ? 'Defense' : id.includes('-KAT-') ? 'Kata' : id.includes('-CON-') ? 'Consumable' : id.includes('-CMB-') ? 'Combo' : id.includes('-LOC-') ? 'Location' : (id.includes('-DEQ-') || id.includes('-GEA-')) ? 'Equipment' : id.includes('-STA-') ? 'Starter' : 'Other';
            byFamily[family] = (byFamily[family] ?? 0) + plan.unsupported.length;
            rows.push({ catalogId: card.catalogId, name: card.name, unsupported: plan.unsupported });
          }
          console.log('EFFECT_COVERAGE=' + JSON.stringify(coverage));
          console.log('UNRESOLVED_CARDS=' + unresolvedCards);
          console.log('UNSUPPORTED_EFFECTS=' + unsupportedEffects);
          console.log('BY_FAMILY=' + JSON.stringify(byFamily));
          console.log('DETAIL=' + JSON.stringify(rows));
          NODE
