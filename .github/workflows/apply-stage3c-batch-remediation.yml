name: Apply Stage 3C Consumable Batch Remediation Once

on:
  push:
    branches:
      - stage3c-play-surface-remediation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply batch remediation
        run: |
          python3 scripts/_stage3c_batch_remediation.py
          git diff --check
      - name: Commit product changes
        run: |
          rm scripts/_stage3c_batch_remediation.py
          rm .github/workflows/apply-stage3c-batch-remediation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/consumable-effect-resolvers.ts app/stage3c-consumable-play-window.ts app/playtest.tsx tests/stage3c-defense-consumable-runtime.test.mjs tests/stage3c-consumable-play-window.test.mjs tests/playtest-effect-integration.test.mjs scripts/_stage3c_batch_remediation.py .github/workflows/apply-stage3c-batch-remediation.yml
          git commit -m "fix: batch Stage 3C Consumable timing and context semantics"
          git push origin HEAD:stage3c-play-surface-remediation
