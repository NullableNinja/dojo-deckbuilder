name: Temporary Stage 3E Coach reconstruction v2

on:
  push:
    branches: [stage3e-coach-card-modified-current-main]

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage3e-coach-card-modified-current-main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Apply only the still-needed Coach semantic diff
        shell: bash
        run: |
          set -euo pipefail
          base="$(git merge-base origin/main origin/stage3e-character-coach-modification-fact)"
          git diff --binary "$base" origin/stage3e-character-coach-modification-fact -- \
            app/character-card-modification-facts.ts \
            app/character-runtime.ts \
            app/quick-duel-character-event-routes.ts \
            app/quick-duel-playtest-host.ts \
            app/playtest.tsx \
            content/card-effects/characters.json \
            tests/quick-duel-character-coach-modification-host.test.mjs \
            > /tmp/coach-current-main.patch
          test -s /tmp/coach-current-main.patch
          git apply --3way /tmp/coach-current-main.patch
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path = 'package.json';
          const pkg = JSON.parse(await readFile(path, 'utf8'));
          const testFile = 'tests/quick-duel-character-coach-modification-host.test.mjs';
          if (!pkg.scripts.test.includes(testFile)) pkg.scripts.test += ` ${testFile}`;
          await writeFile(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          git diff --check

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate canonical mirrors
        run: npm run game:generate

      - name: Canonical drift check
        run: npm run game:check

      - name: Focused Coach runtime certification
        run: node --experimental-strip-types --test tests/quick-duel-character-coach-modification-host.test.mjs

      - name: Current repository test gate
        run: npm test

      - name: Production build
        run: npm run build

      - name: Commit certified reconstruction and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/temp-stage3e-coach-rebuild-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete Coach Karen card-modification runtime seam"
          git push origin HEAD:stage3e-coach-card-modified-current-main
