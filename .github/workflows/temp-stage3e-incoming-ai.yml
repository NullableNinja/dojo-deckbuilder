name: Temporary Stage 3E AI defender incoming attack certification

on:
  push:
    branches:
      - stage3e-character-incoming-attack-ai-defense

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage3e-character-incoming-attack-ai-defense
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - run: npm ci
      - name: Apply AI defender incoming attack seam
        run: python .github/temp-patch-incoming-ai.py
      - name: Canonical source drift
        run: npm run game:check
      - name: Production build
        run: npm run build
      - name: Character incoming attack AI certification
        run: node --experimental-strip-types --test tests/quick-duel-character-incoming-attack-ai-host.test.mjs tests/character-*.test.mjs tests/quick-duel-character-*.test.mjs
      - name: Commit certified implementation and remove temporary machinery
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/temp-patch-incoming-ai.py
          git rm .github/workflows/temp-stage3e-incoming-ai.yml
          git add app/quick-duel-playtest-host.ts app/playtest.tsx tests/quick-duel-character-incoming-attack-ai-host.test.mjs
          git commit -m "feat(stage3e): publish incoming attacks to AI Characters"
          git push origin HEAD:stage3e-character-incoming-attack-ai-defense
