name: Apply Stage 3C Smoke Bomb Targeting Batch Once

on:
  push:
    branches: [stage3c-play-surface-remediation]
    paths:
      - scripts/apply-stage3c-smoke-targeting-batch.mjs
      - .github/workflows/apply-stage3c-smoke-targeting-batch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage3c-play-surface-remediation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Harden one-shot patch anchors
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/apply-stage3c-smoke-targeting-batch.mjs';
          let s = fs.readFileSync(path, 'utf8');
          s = s.replace('"\\n\\n  const chooseAttack ="', '"\\n\\n  const useHandCard ="');
          s = s.replace(
            '  next = next.replace("fighterStat(current.ai, \\\"DEF\\\")", "fighterStat(reactingAi, \\\"DEF\\\")");',
            '  next = next.replace("    const defensePower = Math.max(0, fighterStat(current.ai, \\\"DEF\\\") + armorModifier.value + stage3cIncomingAttackDefenseBonus(current.ai) + (defenseCard ? cardPower(defenseCard) + (current.ai.nextDefenseCardBonus ?? 0) + stage3cNextDefenseGuardBonus(current.ai) : 0) + defenseCardModifier.value + defenseModifier.value);", "    const defensePower = Math.max(0, fighterStat(reactingAi, \\\"DEF\\\") + armorModifier.value + stage3cIncomingAttackDefenseBonus(reactingAi) + (defenseCard ? cardPower(defenseCard) + (reactingAi.nextDefenseCardBonus ?? 0) + stage3cNextDefenseGuardBonus(reactingAi) : 0) + defenseCardModifier.value + defenseModifier.value);");'
          );
          fs.writeFileSync(path, s);
          NODE
      - name: Apply targeting integration
        run: node scripts/apply-stage3c-smoke-targeting-batch.mjs
      - name: Remove one-shot scaffolding before certification
        run: git rm -f scripts/apply-stage3c-smoke-targeting-batch.mjs .github/workflows/apply-stage3c-smoke-targeting-batch.yml
      - name: Targeted Smoke Bomb certification
        run: node --experimental-strip-types --test tests/stage3c-consumable-reaction-ai.test.mjs tests/stage3c-smoke-bomb-play-surface.test.mjs
      - name: Full clean-branch test suite
        run: npm test
      - name: Verify patch hygiene
        run: git diff --check
      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/playtest.tsx tests/stage3c-smoke-bomb-play-surface.test.mjs
          git add -u
          git commit -m 'fix: enforce Smoke Bomb target invalidation' || exit 0
          git push origin HEAD:stage3c-play-surface-remediation
