name: Verify effect vocabulary architecture

on:
  push:
    branches: [stage3b-effect-vocabulary-v3]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify generator is deterministic
        run: |
          npm run game:generate
          git diff --exit-code
      - name: Run full repository suite
        run: npm test
