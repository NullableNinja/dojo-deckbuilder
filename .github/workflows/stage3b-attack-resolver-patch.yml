name: Apply Stage 3B Attack resolver patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stage3b-attack-resolver-patch.yml"

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply strict source patch
        run: node scripts/patch-attack-structured-resolvers.mjs

      - name: Commit patched resolver and remove one-time migration helpers
        run: |
          rm .github/workflows/stage3b-attack-resolver-patch.yml
          rm scripts/patch-attack-structured-resolvers.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "engine: consume structured Attack resolvers"
          git push origin HEAD:main
