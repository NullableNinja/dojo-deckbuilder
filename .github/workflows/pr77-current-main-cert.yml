name: PR77 Current Main Certification

on:
  push:
    branches:
      - pr72-micro-recovery-clean

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr72-micro-recovery-clean
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Remove one-shot certification workflow from candidate tree
        run: rm .github/workflows/pr77-current-main-cert.yml

      - name: Install dependencies
        run: npm ci

      - name: Certify canonical data
        run: npm run game:check

      - name: Build application
        run: npm run build

      - name: Run full test suite
        run: npm test

      - name: Commit certification cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Certify PR77 recovery on current main"
          git push origin HEAD:pr72-micro-recovery-clean
