name: Stage 3C/3D Runtime Certification

on:
  push:
    branches:
      - stage3cd-runtime-final-integration-v2
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  runtime-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout committed source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: One-time materialize canonical Combo requirements
        if: github.event.pull_request.head.ref == 'stage3-final-machine-readable-certification' && github.actor != 'github-actions[bot]'
        run: |
          node --experimental-strip-types scripts/materialize-combo-requirements.mjs
          if ! git diff --quiet -- content/combo-requirements.json || ! git ls-files --error-unmatch content/combo-requirements.json >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/combo-requirements.json
            git commit -m "materialize canonical combo requirements"
            git push origin HEAD:stage3-final-machine-readable-certification
          fi

      - name: Generate canonical runtime data
        run: npm run game:generate

      - name: Verify generated-data drift
        run: npm run game:check

      - name: Character runtime certification
        run: node --experimental-strip-types --test tests/character-runtime-enforcement.test.mjs

      - name: Location runtime certification
        run: node --experimental-strip-types --test tests/stage3d-location-runtime.test.mjs

      - name: Character and Location composition certification
        run: node --experimental-strip-types --test tests/stage3d-character-location-integration.test.mjs

      - name: TypeScript compile
        run: npx tsc --noEmit

      - name: Full repository tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify committed source was not mutated
        run: git diff --exit-code
