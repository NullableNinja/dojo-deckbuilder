name: Core Engine Runtime Integration

on:
  push:
    branches:
      - core-engine-runtime-integration
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  runtime-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout committed source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate canonical runtime data
        run: npm run game:generate

      - name: Verify generated-data drift
        run: npm run game:check

      - name: Location runtime certification
        shell: bash
        run: |
          set +e
          node --experimental-strip-types --test tests/stage3d-location-runtime.test.mjs > location-runtime-test.log 2>&1
          code=$?
          cat location-runtime-test.log
          exit $code

      - name: Upload Location diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: location-runtime-test-log
          path: location-runtime-test.log
          if-no-files-found: ignore

      - name: TypeScript compile
        run: npx tsc --noEmit

      - name: Full repository tests
        shell: bash
        run: |
          set +e
          npm test > full-repository-test.log 2>&1
          code=$?
          cat full-repository-test.log
          exit $code

      - name: Upload full-test diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-repository-test-log
          path: full-repository-test.log
          if-no-files-found: ignore

      - name: Production build
        run: npm run build

      - name: Verify committed tree remains clean
        run: git diff --exit-code
