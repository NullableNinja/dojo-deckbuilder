name: One-time companion batch three v2

on:
  push:
    branches: [site-polish-batch3-v2]
    paths:
      - .github/workflows/one-time-companion-batch3-v2.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site-polish-batch3-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply rebased deep-link patch
        run: python scripts/one_time_companion_batch3_v2.py
      - name: Install dependencies
        run: npm ci
      - name: Run complete test suite
        run: npm test
      - name: Remove temporary patch files
        run: rm scripts/one_time_companion_batch3_v2.py .github/workflows/one-time-companion-batch3-v2.yml
      - name: Commit validated batch
        run: |
          git config user.name "NullableNinja Site Automation"
          git config user.email "130773741+NullableNinja@users.noreply.github.com"
          git add -A
          git commit -m "Add shareable companion deep links and rule section navigation"
          git push origin HEAD:site-polish-batch3-v2
