name: One-time smart companion tools

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-companion-smart-tools.yml
      - scripts/one_time_companion_smart_tools.py

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply smart companion patch
        run: python scripts/one_time_companion_smart_tools.py
      - name: Install dependencies
        run: npm ci
      - name: Run complete test suite
        run: npm test
      - name: Commit validated companion batch
        run: |
          rm scripts/one_time_companion_smart_tools.py .github/workflows/one-time-companion-smart-tools.yml
          git config user.name "NullableNinja Site Automation"
          git config user.email "130773741+NullableNinja@users.noreply.github.com"
          git add -A
          git commit -m "Add smart search, rules updates, and Dojo Binder"
          git push origin HEAD:main
