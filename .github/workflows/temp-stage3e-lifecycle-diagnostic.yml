name: Temporary Stage 3E lifecycle certification

on:
  push:
    branches:
      - stage3e-character-lifecycle-boundaries

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage3e-character-lifecycle-boundaries
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - run: npm ci
      - run: python .github/temp-patch-lifecycle.py
      - name: Character tests
        run: node --experimental-strip-types --test tests/character-*.test.mjs tests/quick-duel-character-*.test.mjs tests/runtime-effect-certification-character.test.mjs
      - name: Quick Duel tests
        run: node --experimental-strip-types --test tests/quick-duel-*.test.mjs
      - name: Playtest tests
        run: node --experimental-strip-types --test tests/playtest-*.test.mjs
      - name: Remaining tests
        shell: bash
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -name '*.test.mjs' -print | sort | grep -Ev '/(character-|quick-duel-|playtest-|runtime-effect-certification-character\.test\.mjs$)')
          node --experimental-strip-types --test "${files[@]}"
