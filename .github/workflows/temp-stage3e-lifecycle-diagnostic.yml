name: Temporary Stage 3E lifecycle certification

on:
  push:
    branches:
      - stage3e-character-lifecycle-boundaries

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage3e-character-lifecycle-boundaries
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - run: npm ci
      - run: python .github/temp-patch-lifecycle.py
      - name: Character family registry
        continue-on-error: true
        run: node --experimental-strip-types --test tests/character-family-registry.test.mjs
      - name: Character playtest bridge
        continue-on-error: true
        run: node --experimental-strip-types --test tests/character-playtest-bridge.test.mjs
      - name: Character runtime enforcement
        continue-on-error: true
        run: node --experimental-strip-types --test tests/character-runtime-enforcement.test.mjs
      - name: Quick Duel Character host tests
        continue-on-error: true
        run: node --experimental-strip-types --test tests/quick-duel-character-*.test.mjs
      - name: Character runtime certification
        continue-on-error: true
        run: node --experimental-strip-types --test tests/runtime-effect-certification-character.test.mjs
