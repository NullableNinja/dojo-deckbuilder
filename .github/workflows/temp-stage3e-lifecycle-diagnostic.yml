name: Temporary Stage 3E lifecycle diagnostic

on:
  push:
    branches:
      - stage3e-character-lifecycle-boundaries

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - run: npm ci
      - run: node --experimental-strip-types --test tests/quick-duel-character-lifecycle-host.test.mjs
