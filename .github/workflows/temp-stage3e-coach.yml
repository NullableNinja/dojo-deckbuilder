name: temp-stage3e-coach

on:
  push:
    branches:
      - stage3e-character-coach-modification-fact
  workflow_dispatch:

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage3e-character-coach-modification-fact
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply Coach Karen modification integration
        run: node scripts/temp-stage3e-coach-patch.mjs
      - name: Apply Coach Karen certification repairs
        run: node scripts/temp-stage3e-coach-fix.mjs
      - name: Regenerate canonical outputs
        run: npm run game:generate
      - name: Canonical source drift
        run: npm run game:check
      - name: Production build
        run: npm run build
      - name: Coach Karen focused certification
        run: |
          node --experimental-strip-types --test \
            tests/quick-duel-character-coach-modification-host.test.mjs \
            tests/character-runtime-enforcement.test.mjs \
            tests/quick-duel-character-card-played-host.test.mjs \
            tests/quick-duel-character-event-routes.test.mjs \
            tests/quick-duel-character-hit-host.test.mjs \
            tests/quick-duel-playtest-host.test.mjs \
            tests/runtime-effect-certification-character.test.mjs
      - name: Commit certified implementation and remove temporary machinery
        run: |
          rm -f .github/workflows/temp-stage3e-coach.yml scripts/temp-stage3e-coach-patch.mjs scripts/temp-stage3e-coach-fix.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/character-card-modification-facts.ts \
            app/character-runtime.ts \
            app/quick-duel-character-event-routes.ts \
            app/quick-duel-playtest-host.ts \
            app/playtest.tsx \
            content/card-effects/characters.json \
            content/card-effects.json \
            app/data/card-effects.json \
            tests/character-runtime-enforcement.test.mjs \
            tests/quick-duel-character-coach-modification-host.test.mjs \
            .github/workflows/temp-stage3e-coach.yml \
            scripts/temp-stage3e-coach-patch.mjs \
            scripts/temp-stage3e-coach-fix.mjs
          git commit -m "feat(stage3e): publish Coach Karen card modification facts"
          git push origin HEAD:stage3e-character-coach-modification-fact
