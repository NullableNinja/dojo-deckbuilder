name: Stage 3C Finalize Integration

on:
  push:
    branches:
      - stage3c-defense-consumable-runtime

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Stage 3C finalizer
        run: bash scripts/stage3c-finalize.sh
