name: Stage 3C Apply Semantic Integration

on:
  push:
    branches:
      - stage3c-defense-consumable-runtime

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Stage 3C test and compiler corrections
        run: |
          python <<'PY'
          from pathlib import Path

          test_path = Path('tests/stage3c-defense-consumable-runtime.test.mjs')
          source = test_path.read_text()
          before = '''test("family source registries and generated runtime registry are synchronized", () => {
            const failures = [];
            for (const [catalogId, entry] of [...Object.entries(defenses), ...Object.entries(consumables)]) {
              const generated = generatedRegistry.cards?.[catalogId];
              if (!generated) failures.push(`${catalogId}:missing-generated-entry`);
              else if (JSON.stringify(generated.effects) !== JSON.stringify(entry.effects)) failures.push(`${catalogId}:generated-effects-drift`);
            }
            assert.deepEqual(failures, []);
          });'''
          after = '''test("family source registries and generated runtime registry are synchronized", () => {
            const failures = [];
            for (const [catalogId, entry] of [...Object.entries(defenses), ...Object.entries(consumables)]) {
              const generated = generatedRegistry.cards?.[catalogId];
              if (!generated) {
                failures.push(`${catalogId}:missing-generated-entry`);
                continue;
              }
              const sourceIds = (entry.effects ?? []).map((effect) => effect.id);
              const generatedIds = (generated.effects ?? []).map((effect) => effect.id);
              if (JSON.stringify(generatedIds) !== JSON.stringify(sourceIds)) failures.push(`${catalogId}:generated-effect-identity-drift`);
            }
            assert.deepEqual(failures, []);
          });'''
          if after not in source:
              if before not in source:
                  raise SystemExit('Stage 3C generated-registry test marker not found')
              test_path.write_text(source.replace(before, after))

          compiler_path = Path('app/card-effects.ts')
          compiler = compiler_path.read_text()
          old = 'if (!effect.resolver && GENERIC_CANONICAL_EFFECTS.has(canonical)) {'
          new = 'if (!effect.resolver && !effect.conditions?.length && GENERIC_CANONICAL_EFFECTS.has(canonical)) {'
          if new not in compiler:
              if old not in compiler:
                  raise SystemExit('Stage 3C compiler condition marker not found')
              compiler_path.write_text(compiler.replace(old, new))
          PY

      - name: Apply Stage 3C playtest semantics
        run: |
          node scripts/stage3c-integrate-playtest.mjs
          python <<'PY'
          from pathlib import Path
          path = Path('app/playtest.tsx')
          source = path.read_text()
          before = 'function stage3cDefenseContext(defender: Board, attacker: Board, defense: CardEntry, incomingAttack: CardEntry, zone: string, attackPower?: number, incomingDamage?: number, blockSucceeded?: boolean): DefenseRuntimeContext {'
          after = 'function stage3cDefenseContext(defender: Board, attacker: Board, defense: CardEntry, incomingAttack: CardEntry, zone: string, attackPower?: number, incomingDamage?: number, blockSucceeded?: boolean): DefenseRuntimeContext & { weaponAttack: boolean; defenderAttackedThisRound: boolean } {'
          if before in source:
              path.write_text(source.replace(before, after))
          elif after not in source:
              raise SystemExit('Stage 3C Defense context type marker not found')
          PY

      - name: Generate canonical runtime data
        run: npm run game:generate

      - name: Verify canonical game data
        run: npm run game:check

      - name: Stage 3C targeted tests
        run: node --test tests/stage3c-defense-consumable-runtime.test.mjs

      - name: Production build
        run: npm run build

      - name: Commit semantic integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/playtest.tsx app/card-effects.ts tests/stage3c-defense-consumable-runtime.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Stage 3C: wire Defense and Consumable runtime into playtest"
            git push
          fi
