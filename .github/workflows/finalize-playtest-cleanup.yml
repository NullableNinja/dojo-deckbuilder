name: Finalize Playtest Cleanup

on:
  push:
    branches:
      - cleanup/playtest-css-20260915

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/finalize-playtest-cleanup.mjs
      - run: npm run verify
      - name: Remove one-time formatter
        run: rm -f scripts/finalize-playtest-cleanup.mjs .github/workflows/finalize-playtest-cleanup.yml
      - name: Commit final polish
        shell: bash
        run: |
          git config user.name 'Thomas Bryant'
          git config user.email '130773741+NullableNinja@users.noreply.github.com'
          git add -A
          git commit -m 'style: polish playtest cleanup readability'
          git push origin HEAD:cleanup/playtest-css-20260915
