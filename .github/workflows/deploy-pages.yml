name: Deploy Dojo Deckbuilder to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Apply glossary render fix
        run: node scripts/fix-glossary-runtime.mjs

      - name: Install dependencies
        run: npm ci

      - name: Test and build static site
        run: npm test

      - name: Persist glossary fix
        run: |
          if ! git diff --quiet -- app/companion-app.tsx tests/content-integrity.test.mjs; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/companion-app.tsx tests/content-integrity.test.mjs
            git commit -m "Fix glossary duplicate rendering"
            git push origin HEAD:main
          fi

      - name: Stamp deployment and bust stale app-shell caches
        env:
          DDB_BUILD: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          build = os.environ["DDB_BUILD"]
          index = Path("dist/index.html")
          html = index.read_text()
          html = html.replace("__DDB_BUILD__", build)
          html = re.sub(
              r'((?:src|href)="/dojo-deckbuilder/assets/[^"?]+\.(?:js|css))"',
              lambda match: f'{match.group(1)}?build={build[:12]}"',
              html,
          )
          index.write_text(html)
          Path("dist/build.json").write_text(json.dumps({"build": build}) + "\n")
          PY

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
