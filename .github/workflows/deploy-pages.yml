name: Deploy Dojo Deckbuilder to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore installed dependencies
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-modules-${{ hashFiles('package-lock.json') }}

      - name: Apply queued maintenance patch
        id: maintenance
        shell: bash
        run: |
          if [ -f scripts/deploy_patch.py ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            python scripts/deploy_patch.py
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Test and build static site
        run: npm test

      - name: Commit validated maintenance patch
        if: steps.maintenance.outputs.present == 'true'
        shell: bash
        run: |
          message="Apply validated live site maintenance"
          if [ -f scripts/deploy_patch_message.txt ]; then
            message="$(cat scripts/deploy_patch_message.txt)"
            rm scripts/deploy_patch_message.txt
          fi
          rm scripts/deploy_patch.py
          git config user.name "NullableNinja Site Automation"
          git config user.email "130773741+NullableNinja@users.noreply.github.com"
          git add -A
          git commit -m "$message"
          git push origin HEAD:main

      - name: Stamp deployment and bust stale app-shell caches
        run: |
          export DDB_BUILD="$(git rev-parse HEAD)"
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          build = os.environ["DDB_BUILD"]
          index = Path("dist/index.html")
          html = index.read_text()
          html = html.replace("__DDB_BUILD__", build)
          html = re.sub(
              r'((?:src|href)="/dojo-deckbuilder/assets/[^"?]+\.(?:js|css))"',
              lambda match: f'{match.group(1)}?build={build[:12]}"',
              html,
          )
          index.write_text(html)
          Path("dist/build.json").write_text(json.dumps({"build": build}) + "\n")
          PY

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
