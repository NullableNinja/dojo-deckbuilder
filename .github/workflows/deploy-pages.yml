name: Dojo Deckbuilder CI + Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dojo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_PAGES: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify canonical JSON, runtime, and production build
        run: npm run verify

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Stamp deployment and bust stale app-shell caches
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DDB_BUILD: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";

          const build = process.env.DDB_BUILD;
          if (!build) throw new Error("DDB_BUILD was not provided.");

          const indexPath = "dist/index.html";
          let html = await readFile(indexPath, "utf8");
          html = html.replace("__DDB_BUILD__", build);
          html = html.replace(
            /((?:src|href)="\/dojo-deckbuilder\/assets\/[^"?]+\.(?:js|css))"/g,
            (_, asset) => `${asset}?build=${build.slice(0, 12)}"`,
          );

          await writeFile(indexPath, html);
          await writeFile("dist/build.json", `${JSON.stringify({ build })}\n`);
          NODE

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
