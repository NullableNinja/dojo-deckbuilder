name: Deploy Dojo Deckbuilder to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate canonical game data
        run: npm run game:generate

      - name: Run automated tests
        env:
          GITHUB_PAGES: true
        run: npm test

      - name: Build production static site
        env:
          GITHUB_PAGES: true
        run: npm run build

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stamp deployment and bust stale app-shell caches
        env:
          DDB_BUILD: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";

          const build = process.env.DDB_BUILD;
          if (!build) throw new Error("DDB_BUILD was not provided.");

          const indexPath = "dist/index.html";
          let html = await readFile(indexPath, "utf8");
          html = html.replace("__DDB_BUILD__", build);
          html = html.replace(
            /((?:src|href)="\/dojo-deckbuilder\/assets\/[^"?]+\.(?:js|css))"/g,
            (_, asset) => `${asset}?build=${build.slice(0, 12)}"`,
          );

          await writeFile(indexPath, html);
          await writeFile("dist/build.json", `${JSON.stringify({ build })}\n`);
          NODE

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
