name: Hotfix Playtest restore

on:
  push:
    branches: [hotfix-playtest-restore]
    paths:
      - .github/workflows/hotfix-playtest-restore.yml

permissions:
  contents: write

jobs:
  restore-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix-playtest-restore
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore proven Playtest import
        run: python scripts/hotfix_restore_playtest.py
      - name: Install dependencies
        run: npm ci
      - name: Run complete test suite
        run: npm test
      - name: Remove temporary hotfix machinery
        run: rm scripts/hotfix_restore_playtest.py .github/workflows/hotfix-playtest-restore.yml
      - name: Commit validated hotfix
        run: |
          git config user.name "NullableNinja Site Automation"
          git config user.email "130773741+NullableNinja@users.noreply.github.com"
          git add -A
          git commit -m "Restore stable Quick Duel loading"
          git push origin HEAD:hotfix-playtest-restore
