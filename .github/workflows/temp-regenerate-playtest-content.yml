name: Temporary Regenerate Playtest Content

on:
  push:
    branches:
      - effect-certification-character-choice-ui

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: effect-certification-character-choice-ui
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - name: Regenerate canonical Quick Duel content artifact
        run: npm run playtest:data:generate
      - name: Verify generated artifact changed only as expected
        run: |
          git status --short
          test -f app/data/playtest-content.json
          rm .github/workflows/temp-regenerate-playtest-content.yml
      - name: Commit regenerated artifact and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data/playtest-content.json .github/workflows/temp-regenerate-playtest-content.yml
          git commit -m "Regenerate Quick Duel canonical content artifact"
          git push origin HEAD:effect-certification-character-choice-ui
