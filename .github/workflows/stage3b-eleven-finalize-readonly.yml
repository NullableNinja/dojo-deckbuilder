name: Stage 3B eleven finalize read-only

on:
  push:
    branches:
      - stage3b-attack-eleven
    paths:
      - scripts/stage3b-eleven-finalize-readonly.mjs
      - .github/workflows/stage3b-eleven-finalize-readonly.yml

permissions:
  contents: read

jobs:
  verify-and-export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: stage3b-attack-eleven
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare final product files
        run: node scripts/stage3b-eleven-finalize-readonly.mjs

      - name: Run focused Attack tests
        run: node --experimental-strip-types --test tests/attack-structured-resolvers-batch.test.mjs

      - name: Run full repository suite
        run: npm test

      - name: Validate working-tree patch
        run: |
          git diff --check
          test "$(git diff --name-only | sort)" = $'app/playtest.tsx\ntests/attack-structured-resolvers-batch.test.mjs'

      - name: Export verified product files
        uses: actions/upload-artifact@v4
        with:
          name: stage3b-eleven-final-product-files
          path: |
            app/playtest.tsx
            tests/attack-structured-resolvers-batch.test.mjs
          if-no-files-found: error
          retention-days: 1
