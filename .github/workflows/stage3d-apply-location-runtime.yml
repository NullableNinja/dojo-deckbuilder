name: Stage 3D Apply Location Runtime

on:
  push:
    branches:
      - stage3d-location-runtime

permissions:
  contents: write

jobs:
  apply-runtime:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: stage3d-location-runtime
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare one-shot patcher
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('scripts/stage3d-apply-location-runtime.mjs')
          text = path.read_text()
          labels = [
              'guard old Location focus helper unexpectedly remaining',
              'purchase price already structured',
              'AI purchase eligibility structured',
              'AI attack task anchor',
              'fighter protection anchor',
              'player attack structured context',
              'reversal structured context',
              'AI attack structured context',
          ]
          for label in labels:
              marker = f'  "{label}",'
              pos = text.find(marker)
              if pos < 0:
                  continue
              start = text.rfind('replaceOnce(', 0, pos)
              end = text.find('\n);', pos)
              if start < 0 or end < 0:
                  raise SystemExit(f'Could not isolate optional patch block: {label}')
              text = text[:start] + text[end + 3:]
          patch_start = text.find('source = source.replace("locationAttackRuleModifiers')
          head, tail = text[:patch_start], text[patch_start:]
          tail = re.sub(r'(?<!\\)\$\{', r'\\${', tail)
          text = head + tail
          path.write_text(text)
          PY

      - name: Apply structured Location runtime integration
        run: node scripts/stage3d-apply-location-runtime.mjs

      - name: Commit only the playtest runtime integration
        run: |
          if git diff --quiet -- app/playtest.tsx; then
            echo "No playtest changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/playtest.tsx
          git commit -m "Stage 3D: wire structured Location effects into Quick Duel"
          git push origin HEAD:stage3d-location-runtime
