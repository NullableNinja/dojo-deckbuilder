name: Stage 3 main integration authoring

on:
  push:
    branches:
      - stage3-main-integration-authoring
    paths:
      - scripts/reconcile-stage3-ai-attack-host.mjs
      - .github/workflows/stage3-main-integration-authoring.yml

permissions:
  contents: write

jobs:
  author-ai-attack-candidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout authoring branch
        uses: actions/checkout@v4
        with:
          ref: stage3-main-integration-authoring
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure author identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Reconcile AI Attack host
        run: |
          node scripts/reconcile-stage3-ai-attack-host.mjs
          git add app/playtest.tsx
          git commit -m "candidate: route AI Attack through unified Combo host"

      - name: TypeScript gate
        run: npx tsc --noEmit

      - name: Playtest host gate
        run: node --experimental-strip-types --test tests/quick-duel-playtest-host.test.mjs

      - name: Push AI Attack candidate
        run: git push origin HEAD:stage3-main-integration-authoring
