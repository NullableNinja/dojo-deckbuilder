name: Stage 3 main integration authoring

on:
  push:
    branches:
      - stage3-main-integration-authoring
    paths:
      - scripts/reconcile-stage3-air-horn-defense-cancellation.mjs
      - tests/stage3c-air-horn-play-surface.test.mjs
      - tests/stage3c-player-air-horn-play-surface.test.mjs
      - .github/workflows/stage3-main-integration-authoring.yml

permissions:
  contents: write

jobs:
  author-air-horn-defense-candidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout authoring branch
        uses: actions/checkout@v4
        with:
          ref: stage3-main-integration-authoring
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure author identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Reconcile canceled Defense lifecycle
        run: |
          node scripts/reconcile-stage3-air-horn-defense-cancellation.mjs
          git add app/playtest.tsx
          git commit -m "candidate: keep canceled Defense out of resolved lifecycle"

      - name: TypeScript gate
        run: npx tsc --noEmit

      - name: Air Horn surface gates
        run: node --experimental-strip-types --test tests/stage3c-air-horn-play-surface.test.mjs tests/stage3c-player-air-horn-play-surface.test.mjs

      - name: Stage3C Defense and Consumable gate
        run: npm run test:stage3c:defense-consumable

      - name: Push Air Horn candidate
        run: git push origin HEAD:stage3-main-integration-authoring
