name: Temporary Stage 3E attack declared certification

on:
  push:
    branches:
      - stage3e-character-attack-declared

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage3e-character-attack-declared
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - run: npm ci
      - name: Correct stacked-source patch anchor
        run: python .github/temp-fix-attack-patch.py
      - name: Apply attackDeclared migration
        run: python .github/temp-patch-attack-declared.py
      - name: Canonical source drift
        run: npm run game:check
      - name: Production build
        run: npm run build
      - name: Character attackDeclared certification
        run: node --experimental-strip-types --test tests/quick-duel-character-attack-declared-host.test.mjs tests/character-*.test.mjs tests/quick-duel-character-*.test.mjs
      - name: Commit certified implementation and remove temporary machinery
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/temp-fix-attack-patch.py
          git rm .github/temp-patch-attack-declared.py
          git rm .github/workflows/temp-stage3e-attack-declared.yml
          git add app/character-runtime.ts app/quick-duel-character-migration.ts app/quick-duel-playtest-host.ts app/playtest.tsx tests/quick-duel-character-migration.test.mjs tests/quick-duel-character-executor.test.mjs tests/quick-duel-character-attack-declared-host.test.mjs
          git commit -m "feat(stage3e): migrate Character attackDeclared to event runtime"
          git push origin HEAD:stage3e-character-attack-declared
