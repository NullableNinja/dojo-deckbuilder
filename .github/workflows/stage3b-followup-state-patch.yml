name: Stage 3B follow-up Attack patch

on:
  push:
    branches:
      - stage3b-attack-followup-state
    paths:
      - .github/workflows/stage3b-followup-state-patch.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: stage3b-attack-followup-state
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Capture patch diagnostic
        shell: bash
        run: |
          set +e
          node scripts/stage3b-followup-state-patch.mjs > stage3b-followup-diagnostic.txt 2>&1
          code=$?
          echo "exit=$code" >> stage3b-followup-diagnostic.txt
          cat stage3b-followup-diagnostic.txt
          git reset --hard HEAD
          exit 0

      - name: Preserve diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/stage3b-followup-state-patch.mjs > /tmp/followup.txt 2>&1 || true
          git reset --hard HEAD
          cp /tmp/followup.txt stage3b-followup-diagnostic.txt
          git add stage3b-followup-diagnostic.txt
          git commit -m "chore: capture follow-up Attack diagnostic"
          git push origin HEAD:stage3b-attack-followup-state
