name: Fix Stage 3C Pocket Sand Choice Once

on:
  push:
    branches:
      - stage3c-play-surface-remediation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Pocket Sand target-choice fix
        shell: bash
        run: |
          python3 .github/scripts/fix-stage3c-pocket-sand-choice.py
          git diff --check

      - name: Commit product fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-stage3c-pocket-sand-choice.yml .github/scripts/fix-stage3c-pocket-sand-choice.py
          git add app/consumable-effect-resolvers.ts
          git commit -m "fix: preserve Pocket Sand target choice outside Quick Duel"
          git push origin HEAD:stage3c-play-surface-remediation
