name: One-time dark rule table contrast fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-dark-rule-table-fix.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch dark-mode rule tables
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/globals.css")
          css = path.read_text()
          marker = "/* Dark-mode rule tables: keep zebra rows readable. */"
          addition = r'''

/* Dark-mode rule tables: keep zebra rows readable. */
:root[data-theme="dark"] .rule-table {
  color: var(--ink);
}
:root[data-theme="dark"] .rule-table th,
:root[data-theme="dark"] .rule-table td {
  border-color: #42584a;
}
:root[data-theme="dark"] .rule-table tbody tr {
  color: var(--ink);
  background: #1a271f;
}
:root[data-theme="dark"] .rule-table tbody tr:nth-child(even) {
  background: #22352a;
}
:root[data-theme="dark"] .rule-table td,
:root[data-theme="dark"] .rule-table td:first-child,
:root[data-theme="dark"] .rule-table tbody tr:nth-child(even) td:first-child {
  color: #e7f0e9;
  background: transparent;
}
'''
          if marker not in css:
              css += addition
          path.write_text(css)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Run complete test suite
        run: npm test
      - name: Remove helper workflow and commit fix
        run: |
          rm .github/workflows/one-time-dark-rule-table-fix.yml
          git config user.name "NullableNinja Site Automation"
          git config user.email "130773741+NullableNinja@users.noreply.github.com"
          git add -A
          git commit -m "Fix dark mode rule table contrast"
          git push origin HEAD:main
