name: Stage 3 rebuild diagnostics

on:
  push:
    branches:
      - stage3-rebuild-current-main

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  rebuild-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout committed source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture TypeScript diagnostics
        id: tsc
        shell: bash
        run: |
          set +e
          npx tsc --noEmit > tsc-diagnostics.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Capture full-suite diagnostics
        id: tests
        shell: bash
        run: |
          set +e
          npm test > test-diagnostics.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish diagnostics to reconstruction PR
        env:
          GH_TOKEN: ${{ github.token }}
          TSC_EXIT_CODE: ${{ steps.tsc.outputs.exit_code }}
          TEST_EXIT_CODE: ${{ steps.tests.outputs.exit_code }}
        shell: bash
        run: |
          {
            echo '### Stage 3 rebuild diagnostics'
            echo
            echo "Commit: $GITHUB_SHA"
            echo "TypeScript exit code: $TSC_EXIT_CODE"
            echo "Full-suite exit code: $TEST_EXIT_CODE"
            echo
            echo '#### TypeScript'
            echo '```text'
            cat tsc-diagnostics.txt
            echo '```'
            echo
            echo '#### npm test'
            echo '```text'
            tail -n 220 test-diagnostics.txt
            echo '```'
          } > diagnostic-comment.md
          gh pr comment 48 --body-file diagnostic-comment.md
          test "$TSC_EXIT_CODE" -eq 0
          test "$TEST_EXIT_CODE" -eq 0
