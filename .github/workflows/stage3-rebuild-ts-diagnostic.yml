name: Stage 3 rebuild TypeScript diagnostics

on:
  push:
    branches:
      - stage3-rebuild-current-main

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  typescript-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout committed source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture TypeScript diagnostics
        id: tsc
        shell: bash
        run: |
          set +e
          npx tsc --noEmit > tsc-diagnostics.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish diagnostics to reconstruction PR
        env:
          GH_TOKEN: ${{ github.token }}
          EXIT_CODE: ${{ steps.tsc.outputs.exit_code }}
        shell: bash
        run: |
          {
            echo '### Stage 3 rebuild TypeScript diagnostics'
            echo
            echo "Commit: $GITHUB_SHA"
            echo "Exit code: $EXIT_CODE"
            echo
            echo '```text'
            cat tsc-diagnostics.txt
            echo '```'
          } > diagnostic-comment.md
          gh pr comment 48 --body-file diagnostic-comment.md
          test "$EXIT_CODE" -eq 0
