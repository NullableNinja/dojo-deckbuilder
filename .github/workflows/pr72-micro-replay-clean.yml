name: PR72 Clean Micro Replay

on:
  push:
    branches:
      - pr72-micro-recovery-clean
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replay:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: pr72-micro-recovery-clean

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch PR 72 source branch
        run: git fetch origin effect-certification-character-choice-ui

      - name: Prepare micro patches, remove harness, then replay with full certification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BASE=6c7dff42b0c2ac54b487f35dc242f2183c036a39
          SOURCE=origin/effect-certification-character-choice-ui
          WORKFLOW=.github/workflows/pr72-micro-replay-clean.yml
          mkdir -p /tmp/pr72-micro-patches

          git diff --binary "$BASE" "$SOURCE" -- app/playtest.tsx tests/playtest-character-choice-ui.test.mjs > /tmp/pr72-micro-patches/full.diff

          python - <<'PY'
          from pathlib import Path
          text = Path('/tmp/pr72-micro-patches/full.diff').read_text()
          lines = text.splitlines(keepends=True)
          patches = []
          file_header = []
          hunk = []
          path = None

          def flush():
              global hunk
              if hunk:
                  patches.append((''.join(file_header + hunk), path))
                  hunk = []

          i = 0
          while i < len(lines):
              line = lines[i]
              if line.startswith('diff --git '):
                  flush()
                  file_header = [line]
                  parts = line.strip().split()
                  path = parts[3][2:] if len(parts) >= 4 else 'unknown'
                  i += 1
                  while i < len(lines) and not lines[i].startswith('@@ ') and not lines[i].startswith('diff --git '):
                      file_header.append(lines[i])
                      i += 1
                  continue
              if line.startswith('@@ '):
                  flush()
                  hunk = [line]
              elif hunk:
                  hunk.append(line)
              i += 1
          flush()

          for n, (patch, file_path) in enumerate(patches, 1):
              Path(f'/tmp/pr72-micro-patches/{n:02d}.patch').write_text(patch)
              Path(f'/tmp/pr72-micro-patches/{n:02d}.meta').write_text((file_path or 'unknown') + '\n')
          print(f'Prepared {len(patches)} PR72 micro patches')
          PY

          total=$(find /tmp/pr72-micro-patches -name '[0-9][0-9].patch' | wc -l)
          echo "Prepared $total micro patches"

          # Critical: remove the write-enabled harness from the checked-out tree
          # BEFORE certification so repository integrity tests see the real source tree.
          rm -f "$WORKFLOW"
          git add -u "$WORKFLOW"
          git commit -m "Remove temporary PR72 micro replay harness before certification"
          git push origin HEAD:pr72-micro-recovery-clean

          for patch in /tmp/pr72-micro-patches/[0-9][0-9].patch; do
            n=$(basename "$patch" .patch)
            path=$(cat "/tmp/pr72-micro-patches/$n.meta")
            echo "===== PR72 MICRO $n :: $path ====="
            cat "$patch"

            git apply --index "$patch"
            git commit -m "PR72 micro $n: replay $path hunk"
            micro_sha=$(git rev-parse HEAD)
            git push origin HEAD:pr72-micro-recovery-clean

            echo "Running full npm test for micro $n at $micro_sha"
            set +e
            npm test 2>&1 | tee "/tmp/pr72-micro-$n-test.log"
            status=${PIPESTATUS[0]}
            set -e

            if [ "$status" -ne 0 ]; then
              echo "PR72_CULPRIT_MICRO=$n" | tee /tmp/pr72-culprit.txt
              echo "PR72_CULPRIT_PATH=$path" | tee -a /tmp/pr72-culprit.txt
              echo "PR72_CULPRIT_SHA=$micro_sha" | tee -a /tmp/pr72-culprit.txt
              echo "### PR #72 culprit boundary" >> "$GITHUB_STEP_SUMMARY"
              echo "- Micro: $n" >> "$GITHUB_STEP_SUMMARY"
              echo "- Path: $path" >> "$GITHUB_STEP_SUMMARY"
              echo "- Commit: $micro_sha" >> "$GITHUB_STEP_SUMMARY"
              echo "- Result: full npm test failed" >> "$GITHUB_STEP_SUMMARY"
              exit "$status"
            fi

            echo "Micro $n PASS at $micro_sha"
          done

          echo "### PR #72 replay result" >> "$GITHUB_STEP_SUMMARY"
          echo "All $total micro commits passed full npm test." >> "$GITHUB_STEP_SUMMARY"
