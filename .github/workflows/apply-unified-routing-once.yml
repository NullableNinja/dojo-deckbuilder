name: Apply unified routing integration once

on:
  push:
    branches:
      - fix/unified-site-routing
    paths:
      - .github/workflows/apply-unified-routing-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unified-site-routing
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Apply routing integration
        run: |
          node scripts/fix-unified-routing-transform.mjs
          node scripts/apply-unified-routing.mjs
          rm -f scripts/fix-unified-routing-transform.mjs
      - name: Commit integrated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && exit 0
          git commit -m "Integrate unified site routing and search"
          git push origin HEAD:fix/unified-site-routing
