name: Audit Stage 3C Play-Surface Choices

on:
  push:
    branches:
      - stage3c-play-surface-remediation

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Enumerate structured Consumable choices
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { consumableRuntimeCommands } from './app/consumable-effect-resolvers.ts';
          const cards = JSON.parse(await readFile('./content/cards.json','utf8')).cards;
          const consumables = cards.filter((card) => String(card.catalogId).startsWith('DDB-CON-CORE-'));
          const context = {
            hpThresholdMet: true,
            hasTempo: true,
            handEmptyAfterHeal: true,
            normalAttacksResolvedThisTurn: 2,
            reactionItemUsedSinceLastTurn: true,
            temporaryNegativeModifierPresent: true,
            removedTemporaryNegativeModifier: true,
            nextAttackBlocked: true,
            interferencePrevented: false,
            chosenFriendlyIsBenched: false,
            chosenFriendlyIsConscious: true,
            sameTurnSourceActive: true,
            discardedCount: 2,
            revealedFocusValue: 2,
            revealedDifferentTypeCount: 3,
            selectedEquipmentSubtype: 'Gear',
            friendlyTargetCount: 2,
          };
          const rows = [];
          for (const card of consumables) {
            for (const trigger of ['onPlay','afterResolve','onHide','passive']) {
              for (const command of consumableRuntimeCommands(card, trigger, context)) {
                if (!command.choice) continue;
                rows.push({ catalogId: card.catalogId, name: card.name, trigger, effect: command.effect, target: command.target, resolver: command.resolver, duration: command.duration, amount: command.amount });
              }
            }
          }
          console.log('STAGE3C_CHOICE_ROWS=' + JSON.stringify(rows));
          console.log('STAGE3C_CHOICE_COUNT=' + rows.length);
          console.log('STAGE3C_CHOICE_CARDS=' + new Set(rows.map((row) => row.catalogId)).size);
          NODE
