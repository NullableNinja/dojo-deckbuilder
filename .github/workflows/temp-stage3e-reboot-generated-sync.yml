name: Temporary Stage 3E reboot generated-data sync

on:
  push:
    branches:
      - stage3e-character-reboot-action

permissions:
  contents: write

jobs:
  sync-and-certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage3e-character-reboot-action
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - run: npm ci
      - name: Regenerate canonical mirrors
        run: npm run game:generate
      - name: Verify canonical source drift
        run: npm run game:check
      - name: Production build
        run: npm run build
      - name: Character reboot certification
        run: node --experimental-strip-types --test tests/quick-duel-character-reboot-host.test.mjs tests/character-*.test.mjs tests/quick-duel-character-*.test.mjs
      - name: Commit generated sync and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-stage3e-reboot-generated-sync.yml
          git add content/card-effects.json app/data/card-effects.json
          if git diff --cached --quiet; then
            echo "No generated sync required after cleanup"
          else
            git commit -m "chore(stage3e): sync Rebooter generated effect registry"
          fi
          git push origin HEAD:stage3e-character-reboot-action
