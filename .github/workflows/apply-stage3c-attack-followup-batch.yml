name: Apply Stage 3C Attack Followup Batch Once

on:
  push:
    branches:
      - stage3c-play-surface-remediation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply attack followup batch
        run: |
          python3 scripts/_stage3c_attack_followup_batch.py
          git diff --check
          node --test tests/stage3c-consumable-attack-followup.test.mjs
      - name: Commit product changes
        run: |
          rm scripts/_stage3c_attack_followup_batch.py
          rm .github/workflows/apply-stage3c-attack-followup-batch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/playtest.tsx tests/stage3c-consumable-attack-followup.test.mjs tests/playtest-effect-integration.test.mjs scripts/_stage3c_attack_followup_batch.py .github/workflows/apply-stage3c-attack-followup-batch.yml
          git commit -m "fix: execute structured Consumable attack followups"
          git push origin HEAD:stage3c-play-surface-remediation
