name: Temporary Consumable host audit
on:
  push:
    branches:
      - fix/effect-runtime-certification-batch2
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - run: npm ci
      - run: node --experimental-strip-types scripts/tmp-consumable-host-audit.mjs
