name: Temporary Consumable host certification
on:
  push:
    branches:
      - fix/effect-runtime-certification-batch2
permissions:
  contents: write
jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/effect-runtime-certification-batch2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - run: npm ci
      - name: Apply generic host patch
        run: |
          node scripts/tmp-patch-consumable-host-batch2.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'tests/quick-duel-consumable-host-coverage.test.mjs';
          let source = fs.readFileSync(path, 'utf8');
          source = source.replace('const weapon = card("DDB-EQP-CORE-001") ?? { cardType: "Item", subtype: "Weapon" };', 'const weapon = cards.find((entry) => entry.cardType === "Item" && /weapon/i.test(String(entry.subtype ?? ""))) ?? { cardType: "Item", subtype: "Weapon" };');
          fs.writeFileSync(path, source);
          NODE
      - name: Focused Consumable acceptance
        run: node --experimental-strip-types --test tests/quick-duel-kata-consumable-runtime.test.mjs tests/quick-duel-consumable-host-coverage.test.mjs
      - name: Full verification
        run: npm run verify
      - name: Diff hygiene
        run: git diff --check
      - name: Commit certified implementation and remove temporary audit files
        shell: bash
        run: |
          rm .github/workflows/temp-consumable-host-audit.yml scripts/tmp-consumable-host-audit.mjs scripts/tmp-patch-consumable-host-batch2.mjs
          git config user.name "Thomas Bryant"
          git config user.email "130773741+NullableNinja@users.noreply.github.com"
          git add app/playtest.tsx app/stage3c-consumable-status-removal.ts app/stage3c-consumable-reveal.ts tests/quick-duel-consumable-host-coverage.test.mjs package.json .github/workflows/temp-consumable-host-audit.yml scripts/tmp-consumable-host-audit.mjs scripts/tmp-patch-consumable-host-batch2.mjs
          git diff --cached --check
          git commit -m "fix: complete Consumable status and reveal host paths"
          git push origin HEAD:fix/effect-runtime-certification-batch2
