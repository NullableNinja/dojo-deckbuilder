name: Temporary Consumable host audit
on:
  push:
    branches:
      - fix/effect-runtime-certification-batch2
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - run: npm ci
      - name: Trace suspect host paths
        shell: bash
        run: |
          echo '=== RESTRICTION CALLERS ==='
          grep -RIn 'stage3cRestrictionBlocks' app tests || true
          echo '=== DISARM PATHS ==='
          grep -RInEi 'disarm|replaceDisarm|isDisarmReplacementReaction|replace-disarm' app tests content | head -300 || true
          echo '=== SPARE WRAP / STATUS REMOVAL ==='
          grep -RInE 'healAndRemoveStatus|stage3c-remove-negative|removeTemporaryNegative|temporary status' app tests content | head -300 || true
          echo '=== REVEAL COMMAND HOSTS ==='
          grep -RInE 'core\.reveal|revealTopFocusValue|revealDeckTop' app tests | head -300 || true
          echo '=== CHOICE STATE READERS ==='
          grep -RIn 'stage3cChoices' app | head -300 || true
          echo '=== RUN AUDIT ==='
          node --experimental-strip-types scripts/tmp-consumable-host-audit.mjs
