name: Temporary Stage 3E Ronin reveal certification

on:
  push:
    branches:
      - stage3e-character-ronin-reveal

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage3e-character-ronin-reveal
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - run: npm ci
      - name: Apply Ronin reveal runtime correction
        run: python .github/temp-patch-ronin-reveal.py
      - name: Regenerate canonical outputs
        run: npm run game:generate
      - name: Canonical source drift
        run: npm run game:check
      - name: Production build
        run: npm run build
      - name: Ronin Character certification
        run: node --experimental-strip-types --test tests/quick-duel-character-ronin-reveal.test.mjs tests/character-*.test.mjs tests/quick-duel-character-*.test.mjs
      - name: Commit certified implementation and remove temporary machinery
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/temp-patch-ronin-reveal.py
          git rm -f .github/workflows/temp-stage3e-ronin-reveal.yml
          git add content/card-effects/characters.json content/card-effects.json app/data/card-effects.json app/character-runtime.ts tests/quick-duel-character-ronin-reveal.test.mjs
          git commit -m "feat(stage3e): make Ronin reveal replacement hidden-deck safe"
          git push origin HEAD:stage3e-character-ronin-reveal
