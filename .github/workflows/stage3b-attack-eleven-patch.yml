name: Stage 3B eleven Attack patch

on:
  push:
    branches:
      - stage3b-attack-eleven
    paths:
      - scripts/stage3b-attack-eleven-patch-v2.mjs
      - .github/workflows/stage3b-attack-eleven-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: stage3b-attack-eleven
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply eleven-card structured Attack migration
        run: node scripts/stage3b-attack-eleven-patch-v2.mjs

      - name: Regenerate runtime data
        run: npm run game:generate

      - name: Validate canonical data
        run: npm run game:check

      - name: Run focused Attack regression tests
        run: node --experimental-strip-types --test tests/attack-structured-resolvers-batch.test.mjs

      - name: Build production site
        run: npm run build

      - name: Validate diff
        run: git diff --check

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/card-effects.json app/data/card-effects.json app/card-effects.ts app/effect-resolvers.ts app/playtest.tsx tests/attack-structured-resolvers-batch.test.mjs
          git commit -m "feat: structure eleven more Core Attacks"
          git push origin HEAD:stage3b-attack-eleven
