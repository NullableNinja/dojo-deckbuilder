name: Temporary Kata Consumable diagnostic
on:
  push:
    branches: [fix/kata-consumable-runtime-certification]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - run: npm ci
      - name: Classify Kata and Consumable runtime work
        shell: bash
        run: |
          echo '=== KATA RUNTIME REFERENCES ==='
          grep -RInE 'resolveKataEffects|resolveKataEffect|kata-playtest-bridge|SUPPORTED_KATA_RESOLVERS' app tests || true
          echo '=== PLAYTEST KATA CALLS ==='
          grep -nE 'isKata\(|structuredFocusIfFastest|mandatoryDiscardChoiceCount|discardChoiceFollowup|deckLookPlan|structuredNextAttackAnyZone|structuredNextAttackFlow' app/playtest.tsx | head -300 || true
          echo '=== KATA RESOLVER COUNTS ==='
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const cards=JSON.parse(fs.readFileSync('content/card-effects/katas.json','utf8')).cards;
          const counts={};
          for (const [id,card] of Object.entries(cards)) for (const e of card.effects) if (e.resolver) counts[e.resolver]=(counts[e.resolver]??0)+1;
          console.log(JSON.stringify(counts,null,2));
          const direct = new Set(['kata.conditional','kata.attackModifier','kata.defenseModifier','kata.nextAttackPiercing','kata.linkedAttackOutcome','kata.cardTypeThreshold']);
          let directCount=0, branchCount=0, semanticCount=0, genericCount=0;
          const semantic={};
          for (const card of Object.values(cards)) for (const e of card.effects) {
            if (!e.resolver) { genericCount++; continue; }
            if (direct.has(e.resolver)) directCount++;
            else if (e.resolver==='kata.branch') branchCount++;
            else { semanticCount++; semantic[e.resolver]=(semantic[e.resolver]??0)+1; }
          }
          console.log({genericCount,directCount,branchCount,semanticCount,semantic});
          NODE
          echo '=== CURRENT KATA BRIDGE EXPORTS ==='
          grep -n '^export function' app/kata-playtest-bridge.ts || true
          echo '=== CONSUMABLE SUPPORT SURFACES ==='
          grep -nE 'consumableRuntimeCommands|structuredConsumableMandatoryDiscard|armConsumable|resolveConsumable|returnsToSupplyAfterUse|destroysAfterUse' app/playtest.tsx | head -300 || true
