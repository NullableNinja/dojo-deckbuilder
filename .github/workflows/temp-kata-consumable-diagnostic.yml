  return legacy.structuredNextAttackAnyZone(card, context);''')
          s = s.replace('''export function deckLookPlan(card: Parameters<typeof legacy.deckLookPlan>[0]): legacy.DeckLookPlan | null {
  if (isCoreConsumable(card)) {''', '''export function deckLookPlan(card: Parameters<typeof legacy.deckLookPlan>[0]): legacy.DeckLookPlan | null {
  if (isCoreKata(card)) {
    const structured = kataDeckLookPlanForHost(card);
