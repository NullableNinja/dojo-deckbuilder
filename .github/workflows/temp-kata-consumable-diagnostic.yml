name: Temporary Kata Consumable diagnostic
on:
  push:
    branches: [fix/kata-consumable-runtime-certification]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - run: npm ci
      - name: Inventory runtime integration
        shell: bash
        run: |
          echo '=== TEST FILES ==='
          find tests -maxdepth 1 -type f | sort | grep -Ei 'kata|consum|effect|playtest' || true
          echo '=== KATA RUNTIME REFERENCES ==='
          rg -n 'resolveKataEffects|resolveKataEffect|kata-effect-resolvers|SUPPORTED_KATA_RESOLVERS' app tests || true
          echo '=== PLAYTEST KATA REFERENCES ==='
          rg -n 'isKata\(|cardType.*Kata|subtype.*Kata|Kata' app/playtest.tsx | head -250 || true
          echo '=== CONSUMABLE RUNTIME REFERENCES ==='
          rg -n 'consumableRuntimeCommands|structuredConsumable|armConsumable|resolveConsumable' app/playtest.tsx | head -300 || true
          echo '=== PACKAGE TEST ==='
          node -e "const p=require('./package.json'); console.log(JSON.stringify({test:p.scripts?.test,verify:p.scripts?.verify},null,2))"
          echo '=== KATA COUNTS ==='
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const k=JSON.parse(fs.readFileSync('content/card-effects/katas.json','utf8')).cards;
          let effects=0,resolverEffects=0,cardsWithResolvers=0;
          for (const v of Object.values(k)) { effects += v.effects.length; const n=v.effects.filter(e=>e.resolver).length; resolverEffects+=n; if(n) cardsWithResolvers++; }
          console.log({cards:Object.keys(k).length,effects,resolverEffects,cardsWithResolvers});
          const c=JSON.parse(fs.readFileSync('content/card-effects/consumables.json','utf8')).cards;
          let ce=0, cr=0, cc=0;
          for (const v of Object.values(c)) { ce += v.effects.length; const n=v.effects.filter(e=>e.resolver).length; cr+=n; if(n) cc++; }
          console.log({consumableCards:Object.keys(c).length,consumableEffects:ce,consumableResolverEffects:cr,consumableCardsWithResolvers:cc});
          NODE
