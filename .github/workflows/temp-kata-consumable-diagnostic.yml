name: Temporary Kata Consumable repair
on:
  push:
    branches: [fix/kata-consumable-runtime-certification]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/kata-consumable-runtime-certification
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - run: npm ci
      - name: Patch structured Kata bridge into live resolver surface
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          p = Path('app/kata-playtest-bridge.ts')
          s = p.read_text()
          s = s.replace('  firstCardPlayedThisTurn?: boolean;\n};', '  firstCardPlayedThisTurn?: boolean;\n  firstAttackThisTurn?: boolean;\n};')
          old = '''export function kataFastestFocusForHost(card: RuntimeCardLike, selfSpeed: number, opponentSpeed: number) {
  return kataCommandsForHost(card, "afterResolve", { isFastest: selfSpeed > opponentSpeed })
    .filter((command) => command.action === "gainFocus")
    .reduce((total, command) => total + Number(command.amount ?? 0), 0);
}

export function kataNextAttackFlowForHost(card: RuntimeCardLike, trigger: string, facts: KataHostFacts = {}) {
  const commands = kataCommandsForHost(card, trigger, facts);
  const handled = commands.some((command) => command.kind === "grantFlow" || command.action === "grantFlow");
  return { handled, grant: handled };
}

export function kataNextAttackAnyZoneForHost(card: RuntimeCardLike, trigger: string, facts: KataHostFacts = {}) {
  const commands = kataCommandsForHost(card, trigger, facts);
  const matching = commands.filter((command) => command.kind === "armZoneOverride" || command.action === "chooseZone");
  return { handled: matching.length > 0, grant: matching.length > 0 };
}
'''
          new = '''export function kataFastestFocusForHost(card: RuntimeCardLike, selfSpeed: number, opponentSpeed: number) {
  return kataCommandsForHost(card, "afterResolve", { isFastest: selfSpeed > opponentSpeed })
    .filter((command) => command.resolver === "kata.conditional" && command.action === "gainFocus")
    .reduce((total, command) => total + Number(command.amount ?? 0), 0);
}

export function kataNextAttackFlowForHost(card: RuntimeCardLike, trigger: string, facts: KataHostFacts = {}) {
  const commands = kataCommandsForHost(card, trigger, facts);
  const flowCommands = commands.filter((command) => command.resolver === "kata.flowGrant" || command.resolver === "kata.branch");
  const matching = flowCommands.filter((command) => {
    if (!(command.kind === "grantFlow" || command.action === "grantFlow" || command.params?.grantFlowTo === "nextAttack")) return false;
    const zones = stringArrayParam(command, "attackZones").map((zone) => zone.toLocaleLowerCase());
    if (zones.length && !facts.attackZone) return false;
    if (zones.length && facts.attackZone && !zones.includes(String(facts.attackZone).toLocaleLowerCase())) return false;
    return true;
  });
  return { handled: flowCommands.length > 0 && matching.length > 0, grant: matching.length > 0 };
}

export function kataNextAttackAnyZoneForHost(card: RuntimeCardLike, trigger: string, facts: KataHostFacts = {}) {
  const commands = kataCommandsForHost(card, trigger, facts);
  const candidates = commands.filter((command) => command.resolver === "kata.zoneOverride" || command.resolver === "kata.branch");
  const matching = candidates.filter((command) => {
    if (!(command.kind === "armZoneOverride" || command.action === "chooseZone")) return false;
    if (command.params?.firstAttackThisTurn === true && facts.firstAttackThisTurn !== true) return false;
    return true;
  });
  return { handled: candidates.length > 0, grant: matching.length > 0 };
}
'''
          if old not in s:
              raise SystemExit('kata bridge target block not found')
          p.write_text(s.replace(old, new))

          p = Path('app/effect-resolvers.ts')
          s = p.read_text()
          marker = 'import { structuredLocationAttackForHost } from "./location-playtest-bridge.ts";\n'
          addition = '''import {
