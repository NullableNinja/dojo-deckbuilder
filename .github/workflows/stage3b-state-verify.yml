name: Stage 3B state Attack verify

on:
  push:
    branches:
      - stage3b-attack-state-batch
    paths:
      - .github/workflows/stage3b-state-verify.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: stage3b-attack-state-batch

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full automated test suite
        run: npm test

      - name: Validate repository diff
        run: git diff --check
