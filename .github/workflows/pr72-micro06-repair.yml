name: PR72 Micro 6 Repair

on:
  push:
    branches:
      - pr72-micro-recovery-clean
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr72-micro-recovery-clean
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm
      - run: npm ci
      - name: Repair Micro 6 ordering and self-delete harness
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/playtest.tsx')
          text = path.read_text()
          marker = '''  const beginYell = () => setMatch((current) => current?.phase === "player-initiate" && !current.pendingChoice ? write(current, "Initiate complete. Yell begins; subtlety has left the building.", { phase: "player-yell", player: { ...current.player, usedEffectIdsThisTurn: [] } }) : current);'''
          helper = '''  const borrowEquipment = (id: string) => setMatch((current) => {\n    if (!current || current.phase !== "player-initiate" || current.player.abilityUsedRound || cardFor(current.player.fighterId)?.name !== "Sensei Ducktape") return current;\n    const card = cardFor(id);\n    if (!card || !isPermanent(card) || !current.player.discard.includes(id)) return current;\n    const nextPlayer = applyCardEffects({ ...current.player, discard: removeOne(current.player.discard, id), borrowedEquipmentId: id, abilityUsedRound: true }, card, "player");\n    return write(current, `Sensei Ducktape jury-rigs ${card.name} from the discard pile until Hide.`, { player: nextPlayer });\n  });\n\n'''
          if 'const borrowEquipment = ' not in text:
              if marker not in text:
                  raise SystemExit('beginYell marker not found; refusing unsafe repair')
              text = text.replace(marker, helper + marker, 1)
              path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr72-micro06-repair.yml
          git add app/playtest.tsx
          git commit -m "PR72 micro 06 repair: defer legacy helper removal"
          git push origin HEAD:pr72-micro-recovery-clean
      - name: Full repository certification after Micro 6 repair
        run: npm test
