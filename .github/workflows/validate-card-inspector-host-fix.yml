name: Validate Card Inspector Host Fix

on:
  push:
    branches: [fix-card-inspector-host-lifecycle]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate canonical game data
        run: npm run game:generate
      - name: Validate canonical game data
        run: npm run game:check
      - name: Build production static site
        env:
          GITHUB_PAGES: true
        run: npm run build
      - name: Run full repository test gate
        env:
          GITHUB_PAGES: true
        run: npm test
