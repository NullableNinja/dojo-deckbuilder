name: Stage 3B Attack Generate

on:
  push:
    branches: [stage3b-attacks-effect-vocabulary]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate canonical runtime data
        run: npm run game:generate

      - name: Commit generated outputs to the family branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/card-effects.json app/data/card-effects.json app/data/effects.json app/data/game-definition.json app/data/rules.json app/data/cards.json
          if git diff --cached --quiet; then
            echo "Generated outputs already synchronized."
            exit 0
          fi
          git commit -m "Generate finalized Attack effect aggregates"
          git push
