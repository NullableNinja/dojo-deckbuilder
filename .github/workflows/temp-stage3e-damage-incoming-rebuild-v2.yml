name: Temporary Stage 3E damageIncoming reconstruction v2

on:
  push:
    branches: [stage3e-damage-incoming-current-main]

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage3e-damage-incoming-current-main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Reconstruct damageIncoming against current playtest host
        shell: bash
        run: |
          set -euo pipefail
          base="$(git merge-base origin/main origin/stage3e-character-damage-incoming)"
          git diff --binary "$base" origin/stage3e-character-damage-incoming -- \
            app/quick-duel-character-migration.ts \
            app/quick-duel-playtest-host.ts \
            tests/quick-duel-character-damage-incoming-host.test.mjs \
            > /tmp/damage-incoming-clean.patch
          test -s /tmp/damage-incoming-clean.patch
          git apply --3way /tmp/damage-incoming-clean.patch

          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/playtest.tsx')
          text = p.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one current-main seam, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
              'import { characterAllowedAttackZones, characterAttackModifier, characterCanEquip, characterDamageReduction, type CharacterRuntimeChoice, type CharacterRuntimeEvent } from "./character-runtime";',
              'import { characterAllowedAttackZones, characterAttackModifier, characterCanEquip, type CharacterRuntimeChoice, type CharacterRuntimeEvent } from "./character-runtime";',
              'remove direct Character damage helper import',
          )
          replace_once(
              'import { applyQuickDuelPlaytestTransition, hostQuickDuelPlaytestCardEvent, prepareQuickDuelPlaytestAttack, publishQuickDuelPlaytestLifecycleEvent, resolveQuickDuelPlaytestCharacterChoice } from "./quick-duel-playtest-host";',
              'import { applyQuickDuelPlaytestTransition, hostQuickDuelPlaytestCardEvent, prepareQuickDuelPlaytestAttack, publishQuickDuelPlaytestDamageIncoming, publishQuickDuelPlaytestLifecycleEvent, resolveQuickDuelPlaytestCharacterChoice } from "./quick-duel-playtest-host";',
              'import semantic damage host',
          )

          replace_once(
          '''function reduceDamageForFighter(board: Board, damage: number): { board: Board; damage: number; note: string | null } {
            const structuredReduction = stage3cTakeDamagePrevention(board, damage);
            const equipmentReduction = applyMandatoryEquipmentDamageReduction(structuredReduction.board, structuredReduction.damage);
            let next = equipmentReduction.board;
            let remaining = equipmentReduction.damage;
            const notes = [...structuredReduction.notes, ...equipmentReduction.notes];
            if (remaining > 0) {
              const before = remaining;
              const characterReduction = characterDamageReduction(next, remaining);
              next = { ...next, ...characterReduction.board, damageReductionUsed: next.damageReductionUsed || characterReduction.damage < before };
              remaining = characterReduction.damage;
              notes.push(...characterReduction.notes);
            }
            return { board: next, damage: remaining, note: notes.length ? notes.join("; ") : null };
          }'''.replace('\n          ', '\n'),
          '''function reduceNonCharacterDamageForFighter(board: Board, damage: number): { board: Board; damage: number; note: string | null } {
            const structuredReduction = stage3cTakeDamagePrevention(board, damage);
            const equipmentReduction = applyMandatoryEquipmentDamageReduction(structuredReduction.board, structuredReduction.damage);
            return {
              board: equipmentReduction.board,
              damage: equipmentReduction.damage,
              note: [...structuredReduction.notes, ...equipmentReduction.notes].join("; ") || null,
            };
          }'''.replace('\n          ', '\n'),
          'split non-Character prevention from Character event runtime')

          replace_once(
              '    const reduced = reduceDamageForFighter(aiDefenseReaction.board, rawDamage);\n    const optionalReduced = applyOptionalCombatDamageReductionAi(reduced.board, reduced.damage);',
              '    const reduced = reduceNonCharacterDamageForFighter(aiDefenseReaction.board, rawDamage);\n    const characterDamage = publishQuickDuelPlaytestDamageIncoming({ ...current, ai: reduced.board }, "ai", reduced.damage);\n    const characterDamageValue = characterDamage.event?.damage ?? reduced.damage;\n    const optionalReduced = applyOptionalCombatDamageReductionAi(characterDamage.match.ai, characterDamageValue);',
              'player normal Attack damage path',
          )
          replace_once(
              '    const reduced = reduceDamageForFighter(nextPlayer, Math.max(0, rawDamage - defensePrevention));\n    const damageBeforeOptional = reduced.damage;',
              '    const reduced = reduceNonCharacterDamageForFighter(nextPlayer, Math.max(0, rawDamage - defensePrevention));\n    const characterDamage = publishQuickDuelPlaytestDamageIncoming({ ...current, player: reduced.board }, "player", reduced.damage);\n    const damageBeforeOptional = characterDamage.event?.damage ?? reduced.damage;',
              'AI Attack incoming player damage path',
          )
          replace_once(
              '    let reducedBoard = reduced.board;',
              '    let reducedBoard = characterDamage.match.player;',
              'AI Attack post-Character board',
          )
          replace_once(
              '    const reduced = reduceDamageForFighter(current.ai, rawDamage);\n    const optionalReduced = applyOptionalCombatDamageReductionAi(reduced.board, reduced.damage);',
              '    const reduced = reduceNonCharacterDamageForFighter(current.ai, rawDamage);\n    const characterDamage = publishQuickDuelPlaytestDamageIncoming({ ...current, ai: reduced.board }, "ai", reduced.damage);\n    const characterDamageValue = characterDamage.event?.damage ?? reduced.damage;\n    const optionalReduced = applyOptionalCombatDamageReductionAi(characterDamage.match.ai, characterDamageValue);',
              'player Reversal damage path',
          )

          replace_once(
              '...optionalReduced.notes, ...aiPostBlock.notes, ...consumableAttackFollowup.notes, ...(reduced.note ? [reduced.note] : [])',
              '...optionalReduced.notes, ...aiPostBlock.notes, ...consumableAttackFollowup.notes, ...characterDamage.notes, ...(reduced.note ? [reduced.note] : [])',
              'player normal Attack Character notes',
          )
          replace_once(
              '...aiConsumableAttackFollowup.notes, ...(reduced.note ? [reduced.note] : []), ...preventionNotes',
              '...aiConsumableAttackFollowup.notes, ...characterDamage.notes, ...(reduced.note ? [reduced.note] : []), ...preventionNotes',
              'AI Attack Character notes',
          )
          replace_once(
              '...optionalReduced.notes, ...aiPostBlock.notes, ...(reduced.note ? [reduced.note] : [])',
              '...optionalReduced.notes, ...aiPostBlock.notes, ...characterDamage.notes, ...(reduced.note ? [reduced.note] : [])',
              'Reversal Character notes',
          )

          p.write_text(text)
          PY

          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path = 'package.json';
          const pkg = JSON.parse(await readFile(path, 'utf8'));
          const testFile = 'tests/quick-duel-character-damage-incoming-host.test.mjs';
          if (!pkg.scripts.test.includes(testFile)) pkg.scripts.test += ` ${testFile}`;
          await writeFile(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

          git diff --check

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Focused damageIncoming acceptance certification
        run: node --experimental-strip-types --test tests/quick-duel-character-damage-incoming-host.test.mjs

      - name: Current canonical/runtime/build gate
        run: npm run verify

      - name: Commit certified reconstruction and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/temp-stage3e-damage-incoming-rebuild-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Migrate Character damageIncoming to event runtime"
          git push origin HEAD:stage3e-damage-incoming-current-main
