name: Stage 3B finish all Core Attacks
on:
  push:
    branches: [stage3b-attack-final-batch]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out final Attack branch
        uses: actions/checkout@v4
        with:
          ref: stage3b-attack-final-batch
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Repair migration patcher
        run: node scripts/fix-stage3b-patcher.mjs
      - name: Apply all remaining Attack migrations
        run: node scripts/stage3b-finish-attacks.mjs
      - name: Regenerate canonical runtime data
        run: npm run game:generate
      - name: Verify no Core Attack remains unstructured
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const cards = JSON.parse(readFileSync('content/cards.json','utf8')).cards;
          const registry = JSON.parse(readFileSync('content/card-effects.json','utf8')).cards;
          const attacks = cards.filter(c => String(c.catalogId||'').startsWith('DDB-ATK-CORE-'));
          const missing = attacks.filter(c => !registry[c.catalogId]);
          console.log(`ATTACKS=${attacks.length} STRUCTURED=${attacks.length-missing.length} MISSING=${missing.length}`);
          if (attacks.length !== 71 || missing.length) {
            console.error(missing.map(c => `${c.catalogId} ${c.name}`).join('\n'));
            process.exit(1);
          }
          NODE
      - name: Remove temporary migration machinery from final-state workspace
        run: rm -f .github/workflows/stage3b-finish-attacks.yml .github/workflows/audit-remaining-attacks.yml scripts/stage3b-finish-attacks.mjs scripts/fix-stage3b-patcher.mjs
      - name: Run full repository suite against final state
        run: npm test
      - name: Commit verified product changes only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/card-effects.json app/data/card-effects.json app/card-effects.ts app/combo-engine.ts app/playtest.tsx app/attack-final-effects.ts
          test -n "$(git diff --cached --name-only)" || { echo "No product changes to commit"; exit 1; }
          git commit -m "feat: structure all remaining Core Attacks"
          git push origin HEAD:stage3b-attack-final-batch