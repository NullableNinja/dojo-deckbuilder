name: Cleanup Audit

on:
  push:
    branches:
      - cleanup/playtest-css-20260915

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: TypeScript unused diagnostics for playtest.tsx
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import ts from 'typescript';
          import path from 'node:path';
          const configPath = ts.findConfigFile('.', ts.sys.fileExists, 'tsconfig.json');
          const configFile = ts.readConfigFile(configPath, ts.sys.readFile);
          const parsed = ts.parseJsonConfigFileContent(configFile.config, ts.sys, path.dirname(configPath), {
            noUnusedLocals: true,
            noUnusedParameters: true,
          }, configPath);
          const program = ts.createProgram(parsed.fileNames, parsed.options);
          const diagnostics = ts.getPreEmitDiagnostics(program)
            .filter((d) => d.file?.fileName.endsWith('/app/playtest.tsx') || d.file?.fileName.endsWith('\\app\\playtest.tsx'))
            .filter((d) => [6133, 6192, 6196].includes(d.code));
          for (const d of diagnostics) {
            const pos = d.file && d.start != null ? d.file.getLineAndCharacterOfPosition(d.start) : null;
            const where = pos ? `${d.file.fileName}:${pos.line + 1}:${pos.character + 1}` : 'playtest.tsx';
            console.log(`${where} TS${d.code}: ${ts.flattenDiagnosticMessageText(d.messageText, '\n')}`);
          }
          console.log(`PLAYTEST_UNUSED_COUNT=${diagnostics.length}`);
          NODE
      - name: CSS import map and inventory
        shell: bash
        run: |
          echo '=== CSS IMPORTS ==='
          grep -RInE 'import .*\.css["'"'"']' app src || true
          echo '=== CSS FILES ==='
          find app src -type f -name '*.css' -printf '%p %s bytes\n' | sort
          echo '=== CSS COUNT ==='
          find app src -type f -name '*.css' | wc -l
