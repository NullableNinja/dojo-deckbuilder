name: Temporary Rulings Variants Architecture Patch

on:
  push:
    branches:
      - rulings-variants-playtest-options

permissions:
  contents: write

jobs:
  patch-and-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: rulings-variants-playtest-options
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply guarded architecture patch
        run: |
          sed -i 's/if call_count < 8:/if call_count != 7:/' scripts/tmp-rulings-variants-patch.py
          sed -i 's/expected at least 8 settings.locations call endings/expected 7 settings.locations call endings/' scripts/tmp-rulings-variants-patch.py
          python scripts/tmp-rulings-variants-patch.py

      - name: Remove temporary patch machinery
        run: rm .github/workflows/tmp-rulings-variants-architecture.yml scripts/tmp-rulings-variants-patch.py

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run full repository gate
        env:
          GITHUB_PAGES: true
        run: npm test

      - name: Commit certified patch
        shell: bash
        run: |
          git config user.name "Dojo Deckbuilder Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/companion-app.tsx app/playtest.tsx app/search-page.tsx app/data/rules.json .github/workflows/tmp-rulings-variants-architecture.yml scripts/tmp-rulings-variants-patch.py
          git commit -m "unify rulings and add optional Quick Duel variants"
          git push origin HEAD:rulings-variants-playtest-options
