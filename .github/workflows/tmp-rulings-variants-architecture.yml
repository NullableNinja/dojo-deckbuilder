  const nextBelt = belts[board.belt + 1];
  const currentBeltXp = belts[board.belt]?.xp ?? 0;
  const xpSpan = Math.max(1, (nextBelt?.xp ?? currentBeltXp) - currentBeltXp);''', '''function FighterPanel({ board, label, enemy, onInspect, onOpenCombo, beltThresholds }: { board: Board; label: string; enemy?: boolean; onInspect: (card: CardEntry) => void; onOpenCombo?: () => void; beltThresholds: number[] }) {
