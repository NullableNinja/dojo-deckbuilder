name: Temporary Rulings Variants Architecture Patch

on:
  push:
    branches:
      - rulings-variants-playtest-options

permissions:
  contents: write

jobs:
  patch-and-certify:
    if: github.event.head_commit.message == 'run guarded rulings variants architecture patch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: rulings-variants-playtest-options
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply guarded architecture patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrence(s), found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new))

          def sub_exact(path, pattern, replacement, expected=1):
              p = Path(path)
              text = p.read_text()
              updated, count = re.subn(pattern, replacement, text, flags=re.S)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} regex replacement(s), found {count}: {pattern[:100]!r}")
              p.write_text(updated)

          companion = "app/companion-app.tsx"
          replace_exact(companion, 'import headerHouseRulesUrl from "./assets/art/header-house-rules-v2.webp";\n', '')
          replace_exact(companion, 'import PlaytestView from "./playtest";\nimport { ReferenceDesk } from "./reference-desk";\n', 'import PlaytestView from "./playtest";\nimport { quickDuelHouseRuleForName } from "./playtest-house-rules";\n')
          replace_exact(companion, 'type ViewId = "home" | "playtest" | "quickstart" | "story" | "rules" | "cards" | "reference" | "rulings" | "glossary" | "house-rules";', 'type ViewId = "home" | "playtest" | "quickstart" | "story" | "rules" | "cards" | "rulings" | "glossary";')
          replace_exact(companion, 'type OfficialRuling = { id: string; filed: string; tag: string; title: string; ruling: string };\ntype Theme = "light" | "dark";', 'type OfficialRuling = { id: string; filed: string; tag: string; title: string; ruling: string };\ntype RulingsTab = "official" | "house";\ntype Theme = "light" | "dark";')
          replace_exact(companion, 'type GlobalResult = { type: "Card" | "Glossary" | "Rule" | "Ruling" | "House Rule"; title: string; detail: string; view: ViewId; card?: CardEntry | null; query?: string; chapterId?: string; sectionId?: string };', 'type GlobalResult = { type: "Card" | "Glossary" | "Rule" | "Ruling" | "House Rule"; title: string; detail: string; view: ViewId; card?: CardEntry | null; query?: string; chapterId?: string; sectionId?: string; rulingsTab?: RulingsTab };')

          sub_exact(companion, r'const NAV_ITEMS: \{ id: ViewId; label: string; short: string \}\[\] = \[.*?\n\];\nconst VIEW_LABELS: Record<ViewId, string> = \{.*?\n\};\nconst MOBILE_MENU_ITEMS: \{ id: ViewId; label: string; detail: string \}\[\] = \[.*?\n\];', '''const NAV_ITEMS: { id: ViewId; label: string; short: string }[] = [
  { id: "playtest", label: "Play the Game", short: "Play" },
  { id: "quickstart", label: "Quick Start", short: "Start" },
  { id: "story", label: "Backstory", short: "Story" },
  { id: "rules", label: "Full Rules", short: "Rules" },
  { id: "cards", label: "Card Library", short: "Cards" },
  { id: "rulings", label: "Rulings & Variants", short: "Rulings" },
  { id: "glossary", label: "Glossary", short: "Terms" },
];
const VIEW_LABELS: Record<ViewId, string> = {
  home: "Dojo Desk",
  playtest: "Field Test",
  quickstart: "Quick Start",
  story: "Backstory",
  rules: "Full Rules",
  cards: "Card Library",
  rulings: "Rulings & Variants",
  glossary: "Glossary",
};
const MOBILE_MENU_ITEMS: { id: ViewId; label: string; detail: string }[] = [
  { id: "home", label: "Home", detail: "Return to the Dojo Desk." },
  { id: "playtest", label: "Play the Game", detail: "Fight the computer using the live card catalog." },
  { id: "quickstart", label: "Quick Start", detail: "Set up and play the first round." },
  { id: "story", label: "Backstory", detail: "Why a filing cabinet became sacred." },
  { id: "rules", label: "Full Rules", detail: "Every official procedure." },
  { id: "cards", label: "Card Library", detail: "Search the registered curriculum." },
  { id: "rulings", label: "Rulings & Variants", detail: "Official clarifications and optional table variants." },
  { id: "glossary", label: "Glossary", detail: "Find every defined term." },
];''')

          replace_exact(companion, '''const parseDojoHash = () => {
  const raw = window.location.hash.replace(/^#/, "");
  if (!raw) return { view: "home" as ViewId, detail: "", subdetail: "" };
  const [rawView, rawDetail = "", rawSubdetail = ""] = raw.split("/");
  const view = ALL_VIEWS.includes(rawView as ViewId) ? rawView as ViewId : "home";
  return { view, detail: decodeHashPart(rawDetail), subdetail: decodeHashPart(rawSubdetail) };
};''', '''const parseDojoHash = () => {
  const raw = window.location.hash.replace(/^#/, "");
  if (!raw) return { view: "home" as ViewId, detail: "", subdetail: "" };
  const [rawView, rawDetail = "", rawSubdetail = ""] = raw.split("/");
  if (rawView === "house-rules") return { view: "rulings" as ViewId, detail: "house", subdetail: decodeHashPart(rawDetail) };
  const view = ALL_VIEWS.includes(rawView as ViewId) ? rawView as ViewId : "home";
  return { view, detail: decodeHashPart(rawDetail), subdetail: decodeHashPart(rawSubdetail) };
};''')

          replace_exact(companion, 'Quick Start, glossary, rulings, and house rules live in their purpose-built sections.', 'Quick Start, glossary, and Rulings & Variants live in their purpose-built sections.')

          rulings_view = r'''function RulingsView({ initialTab = "official", initialQuery = "" }: { initialTab?: RulingsTab; initialQuery?: string }) {
  const [tab, setTab] = useState<RulingsTab>(initialTab);
  const [query, setQuery] = useState(initialQuery);
  const [selected, setSelected] = useState<HouseRule | null>(null);
  const normalizedQuery = query.trim().toLocaleLowerCase();
  const rulings = OFFICIAL_RULINGS.filter((entry) => !normalizedQuery || Object.values(entry).join(" ").toLocaleLowerCase().includes(normalizedQuery));
  const variants = rulesData.houseRules.filter((entry) => !normalizedQuery || `${entry.name} ${entry.rule} ${entry.summary ?? ""} ${entry.notes ?? ""}`.toLocaleLowerCase().includes(normalizedQuery));
  const selectedSupport = selected ? quickDuelHouseRuleForName(selected.name) : null;
  const chooseTab = (next: RulingsTab) => {
    setTab(next);
    setQuery("");
    setSelected(null);
    window.history.pushState(null, "", dojoHash("rulings", next));
    window.scrollTo({ top: 0, behavior: "smooth" });
  };
  const visibleCount = tab === "official" ? rulings.length : variants.length;
  return <main className={`page-shell shell rulings-page rulings-variants-page is-${tab}`}>
    <SectionHeader eyebrow="Department Guidance" title="Rulings & Variants" intro="Official clarifications stay mandatory. Optional variants stay optional. One filing cabinet, two clearly labeled drawers." art={headerRulingsUrl} />
    <nav className="rulings-variant-tabs" role="tablist" aria-label="Rulings and variants sections">
      <button type="button" role="tab" aria-selected={tab === "official"} className={tab === "official" ? "active" : ""} onClick={() => chooseTab("official")}><span>Official</span><b>Official Rulings</b></button>
      <button type="button" role="tab" aria-selected={tab === "house"} className={tab === "house" ? "active" : ""} onClick={() => chooseTab("house")}><span>Optional</span><b>House Rules</b></button>
    </nav>
    <section className={`guidance-status-banner ${tab === "official" ? "is-official" : "is-optional"}`}>
      <strong>{tab === "official" ? "OFFICIAL · APPLIES TO ALL GAMES" : "OPTIONAL · AGREE BEFORE PLAY"}</strong>
      <p>{tab === "official" ? "These clarifications settle how the published rules are played. They are not optional variants." : "These variants change the current game only. Printed card text and the official rules remain unchanged."}</p>
    </section>
    <div className="rulings-shared-search"><label className="search-box large"><span>⌕</span><input value={query} onChange={(event) => setQuery(event.target.value)} placeholder={tab === "official" ? "Search official rulings…" : "Search house rules…"} aria-label={tab === "official" ? "Search official rulings" : "Search house rules"} />{query && <button onClick={() => setQuery("")} aria-label="Clear guidance search">×</button>}</label><span>{visibleCount} of {tab === "official" ? OFFICIAL_RULINGS.length : rulesData.houseRules.length} shown</span></div>
    {tab === "official" ? <>
      <section className="priority-panel"><div><span className="eyebrow">Rule priority</span><h2>When two things disagree</h2><p>Use this order. Stop as soon as the conflict is resolved.</p></div><ol><li><span>1</span>Scenario or mode rules</li><li><span>2</span>Specific card text</li><li><span>3</span>“Cannot” beats “can”</li><li><span>4</span>Later effect</li><li><span>5</span>Active-player temporary ruling</li></ol></section>
      <section className="ruling-list-section"><div className="rulings-heading"><div><span className="eyebrow">Official clarifications</span><h2>{OFFICIAL_RULINGS.length} current rulings</h2></div></div>{rulings.length ? <div className="ruling-list">{rulings.map(({ id, filed, tag, title, ruling }, index) => <article key={id}><span>{String(index + 1).padStart(2, "0")}</span><div><b>{tag}</b><h3>{title}</h3><p>{ruling}</p></div><strong>{id} · {filed}</strong></article>)}</div> : <div className="empty-state"><strong>No official ruling found.</strong><p>Try a shorter term or switch to House Rules for optional variants.</p></div>}</section>
      <section className="judge-procedure"><div><span className="step-stamp">?</span><h2>The two-minute table judge</h2></div><ol><li>Pause for no more than two minutes.</li><li>Read the exact card text aloud.</li><li>Apply Rule Priority.</li><li>Make a temporary ruling and finish the turn.</li><li>Record the question for a permanent ruling after the game.</li></ol></section>
    </> : <>
      <section className="house-grid">{variants.map((entry, index) => { const support = quickDuelHouseRuleForName(entry.name); return <button className="paper-stack interactive-paper" onClick={() => setSelected(entry)} key={entry.name}><span>{String(index + 1).padStart(2, "0")}</span><small>{entry.category}</small><h2>{entry.name}</h2><p>{entry.summary || entry.rule}</p>{support?.quickDuel.status === "supported" && <span className="variant-playtest-badge">Quick Duel option</span>}<b>Open full variant →</b></button>; })}</section>
      {!variants.length && <div className="empty-state"><strong>No house rule found.</strong><p>Try a shorter term or switch to Official Rulings.</p></div>}
      <section className="new-rule-panel paper-stack"><span className="eyebrow">Build your own</span><h2>A good house rule answers four questions.</h2><div><p><b>When</b> does it trigger?</p><p><b>Who</b> makes choices?</p><p><b>What</b> if it is impossible?</p><p><b>Where</b> is the cap?</p></div></section>
    </>}
    {selected && <DetailModal eyebrow={selected.category || "House Rule"} title={selected.name} onClose={() => setSelected(null)} accent="green"><p className="modal-lede">{selected.summary}</p><aside className="modal-rule"><span>Variant rule</span><p>{selected.rule}</p></aside>{selected.notes && <div className="modal-design-note"><span>Why this wording works</span><p>{selected.notes}</p></div>}{selectedSupport && <div className="variant-support-note" data-status={selectedSupport.quickDuel.status}><b>{selectedSupport.quickDuel.status === "supported" ? "Digital Quick Duel: supported" : selectedSupport.quickDuel.status === "not-applicable" ? "Digital Quick Duel: not applicable" : "Digital Quick Duel: not automated yet"}</b><p>{selectedSupport.quickDuel.reason}</p></div>}<p className="agreement-note">Agree on this variant before setup. It changes only the current game and never rewrites printed card text.</p></DetailModal>}
  </main>;
}
'''
          sub_exact(companion, r'function RulingsView\([\s\S]*?\nfunction GlossaryView', rulings_view + '\nfunction GlossaryView')

          replace_exact(companion, 'const [searchedRuleChapter, setSearchedRuleChapter] = useState(""); const [searchedRuleSection, setSearchedRuleSection] = useState(""); const [searchedRuling, setSearchedRuling] = useState(""); const [searchedHouseRule, setSearchedHouseRule] = useState("");', 'const [searchedRuleChapter, setSearchedRuleChapter] = useState(""); const [searchedRuleSection, setSearchedRuleSection] = useState(""); const [searchedRuling, setSearchedRuling] = useState(""); const [searchedRulingsTab, setSearchedRulingsTab] = useState<RulingsTab>("official");')
          replace_exact(companion, '      setSearchedRuling(route.view === "rulings" ? route.detail : "");\n      setSearchedHouseRule(route.view === "house-rules" ? route.detail : "");', '''      if (route.view === "rulings") {
        const nextTab: RulingsTab = route.detail === "house" ? "house" : "official";
        const nextQuery = route.detail === "official" || route.detail === "house" ? route.subdetail : route.detail;
        setSearchedRulingsTab(nextTab);
        setSearchedRuling(nextQuery);
      } else {
        setSearchedRulingsTab("official");
        setSearchedRuling("");
      }''')
          replace_exact(companion, 'setSearchedRuling(""); setSearchedHouseRule("");', 'setSearchedRuling(""); setSearchedRulingsTab("official");')
          replace_exact(companion, '({ type: "Ruling", title, detail: `${id} · ${tag} · ${filed}`, view: "rulings", query: id })', '({ type: "Ruling", title, detail: `${id} · ${tag} · ${filed}`, view: "rulings", query: id, rulingsTab: "official" })')
          replace_exact(companion, '({ type: "House Rule", title: entry.name, detail: entry.summary || entry.rule, view: "house-rules", query: entry.name })', '({ type: "House Rule", title: entry.name, detail: entry.summary || entry.rule, view: "rulings", query: entry.name, rulingsTab: "house" })')
          replace_exact(companion, '''    if (result.view === "rulings") { const target = result.query ?? result.title; setSearchedRuling(target); window.history.replaceState(null, "", dojoHash("rulings", target)); }
    if (result.view === "house-rules") { const target = result.query ?? result.title; setSearchedHouseRule(target); window.history.replaceState(null, "", dojoHash("house-rules", target)); }''', '''    if (result.view === "rulings") { const target = result.query ?? result.title; const tab = result.rulingsTab ?? "official"; setSearchedRulingsTab(tab); setSearchedRuling(target); window.history.replaceState(null, "", dojoHash("rulings", tab, target)); }''')
          replace_exact(companion, 'const moreActive = view === "story" || view === "reference" || view === "rulings" || view === "glossary" || view === "house-rules";', 'const moreActive = view === "story" || view === "rulings" || view === "glossary";')
          companion_text = Path(companion).read_text()
          companion_text = companion_text.replace('Search cards, rules, rulings, glossary, and house rules', 'Search cards, rules, rulings, variants, and glossary')
          Path(companion).write_text(companion_text)
          replace_exact(companion, '{view === "reference" && <ReferenceDesk goTo={goTo} />}{view === "rulings" && <RulingsView key={searchedRuling || "rulings"} initialQuery={searchedRuling} />}{view === "glossary" && <GlossaryView key={searchedTerm || "glossary"} initialQuery={searchedTerm} />}{view === "house-rules" && <HouseRulesView key={searchedHouseRule || "house-rules"} initialQuery={searchedHouseRule} />}', '{view === "rulings" && <RulingsView key={`${searchedRulingsTab}-${searchedRuling || "rulings"}`} initialTab={searchedRulingsTab} initialQuery={searchedRuling} />}{view === "glossary" && <GlossaryView key={searchedTerm || "glossary"} initialQuery={searchedTerm} />}')

          search_page = "app/search-page.tsx"
          replace_exact(search_page, 'hash: routeHash("rulings", id)', 'hash: routeHash("rulings", "official", id)')
          replace_exact(search_page, 'hash: routeHash("house-rules", entry.name)', 'hash: routeHash("rulings", "house", entry.name)')
          search_text = Path(search_page).read_text().replace('Search cards, rules, rulings, glossary, and house rules', 'Search cards, rules, rulings, variants, and glossary')
          Path(search_page).write_text(search_text)

          rules_path = "app/data/rules.json"
          replace_exact(rules_path, 'House rules live in the dedicated House Rules section of the companion site: approved deviations the Department wishes it had not initialed.', 'House rules live under Rulings & Variants in the companion site: optional deviations kept clearly separate from official rulings and agreed before setup.')

          playtest = "app/playtest.tsx"
          replace_exact(playtest, 'import { normalizePendingDamageChoice } from "./playtest-state-recovery";\n', 'import { normalizePendingDamageChoice } from "./playtest-state-recovery";\nimport { QUICK_DUEL_HOUSE_RULES, effectiveBeltThresholds, hasQuickDuelHouseRule, sanitizeQuickDuelHouseRuleIds, shouldRefreshMarketAtRoundEnd } from "./playtest-house-rules";\n')
