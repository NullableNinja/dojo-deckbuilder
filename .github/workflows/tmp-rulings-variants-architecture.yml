  const xpSpan = Math.max(1, (nextBelt ? beltThresholds[board.belt + 1] : currentBeltXp) - currentBeltXp);''')
          replace_exact(playtest, '<small>{nextBelt ? `${nextBelt.xp} for ${nextBelt.name}` : "Final certification"}</small>', '<small>{nextBelt ? `${beltThresholds[board.belt + 1]} for ${nextBelt.name}` : "Final certification"}</small>')

          replace_exact(playtest, '''    setSelectedId(next.id);
  };
