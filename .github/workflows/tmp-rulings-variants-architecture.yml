          replace_exact(playtest, '''  const nextBelt = belts[aiAfterPurchase.belt + 1];
  if (nextBelt && aiAfterPurchase.xp >= nextBelt.xp && aiAfterPurchase.completedTasks.includes(aiAfterPurchase.belt + 1)) {''', '''  const nextBelt = belts[aiAfterPurchase.belt + 1];
