name: Temporary Rulings Variants Architecture Patch

on:
  push:
    branches:
      - rulings-variants-playtest-options

permissions:
  contents: write

jobs:
  patch-and-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: rulings-variants-playtest-options
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply guarded architecture patch
        run: |
          sed -i 's/if call_count < 8:/if call_count != 7:/' scripts/tmp-rulings-variants-patch.py
          sed -i 's/expected at least 8 settings.locations call endings/expected 7 settings.locations call endings/' scripts/tmp-rulings-variants-patch.py
          sed -i 's#rules_path = "app/data/rules.json"#rules_path = "content/rules.json"#' scripts/tmp-rulings-variants-patch.py
          python scripts/tmp-rulings-variants-patch.py
          python <<'PY'
          from pathlib import Path
          path = Path("app/playtest.tsx")
          text = path.read_text()
          old = 'return advanceRound(hidden, settings.locations, "Both fighters have completed the round.");'
          new = 'return advanceRound(hidden, settings.locations, "Both fighters have completed the round.", settings.houseRuleIds);'
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one direct player round-advance call, found {text.count(old)}")
          path.write_text(text.replace(old, new))
          PY

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Regenerate canonical derivatives and repair generated callers
        run: |
          npm run game:generate
          python <<'PY'
          from pathlib import Path
          path = Path("app/playtest.tsx")
          text = path.read_text()
          old_block = '''const suggestedAction = pickQuickAction(
    player,
    match.market,
    actionUsability,
  );'''
          new_block = '''const suggestedAction = pickQuickAction(
    player,
    match.market,
    settings,
    actionUsability,
  );'''
          old_inline = 'const recommended = canAct ? pickQuickAction(player, match.market, actionUsability) : null;'
          new_inline = 'const recommended = canAct ? pickQuickAction(player, match.market, settings, actionUsability) : null;'
          if text.count(old_block) != 1:
              raise SystemExit(f"expected one generated suggestedAction caller, found {text.count(old_block)}")
          if text.count(old_inline) != 1:
              raise SystemExit(f"expected one generated recommended caller, found {text.count(old_inline)}")
          path.write_text(text.replace(old_block, new_block).replace(old_inline, new_inline))
          PY

      - name: Remove temporary patch machinery
        run: rm .github/workflows/tmp-rulings-variants-architecture.yml scripts/tmp-rulings-variants-patch.py

      - name: Run full repository gate
        env:
          GITHUB_PAGES: true
        run: npm test

      - name: Commit certified patch
        shell: bash
        run: |
          git config user.name "Dojo Deckbuilder Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/companion-app.tsx app/playtest.tsx app/search-page.tsx app/data/rules.json content/rules.json .github/workflows/tmp-rulings-variants-architecture.yml scripts/tmp-rulings-variants-patch.py
          git commit -m "unify rulings and add optional Quick Duel variants"
          git push origin HEAD:rulings-variants-playtest-options
