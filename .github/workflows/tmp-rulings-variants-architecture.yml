  const canPromote = Boolean(nextBelt && player.xp >= nextBelt.xp && playerTask);''', '''  const nextBelt = belts[player.belt + 1];
  const nextBeltXp = nextBelt ? beltThresholds[player.belt + 1] : 0;
  const canPromote = Boolean(nextBelt && player.xp >= nextBeltXp && playerTask);''')
          replace_exact(playtest, '<FighterPanel board={player} label="You" onInspect={(card) => setInspectedId(card.id)} onOpenCombo={() => setDeskView("combo")} />', '<FighterPanel board={player} label="You" beltThresholds={beltThresholds} onInspect={(card) => setInspectedId(card.id)} onOpenCombo={() => setDeskView("combo")} />')
          replace_exact(playtest, '<FighterPanel board={ai} label="Computer" enemy onInspect={(card) => setInspectedId(card.id)} />', '<FighterPanel board={ai} label="Computer" enemy beltThresholds={beltThresholds} onInspect={(card) => setInspectedId(card.id)} />')
          replace_exact(playtest, '<b>Next: {nextBelt.name} · {nextBelt.xp} XP.</b>', '<b>Next: {nextBelt.name} · {nextBeltXp} XP.</b>')
          replace_exact(playtest, 'title={`${belt.name} Belt · ${belt.xp} XP · ${belt.exam.title}`}', 'title={`${belt.name} Belt · ${beltThresholds[index]} XP · ${belt.exam.title}`}')
          replace_exact(playtest, '<small>{belt.xp} XP · {belt.exam.summary}</small>', '<small>{beltThresholds[index]} XP · {belt.exam.summary}</small>')
          replace_exact(playtest, '`${nextBelt.name}: ${nextBelt.xp} XP + completed task`', '`${nextBelt.name}: ${nextBeltXp} XP + completed task`')

          # Keep a visible record of enabled variants once a duel is underway.
          replace_exact(playtest, '<section className="playtest-arena">', '<section className="playtest-arena">{settings.houseRuleIds.length > 0 && <div className="playtest-active-variants"><b>House rules active:</b>{QUICK_DUEL_HOUSE_RULES.filter((rule) => settings.houseRuleIds.includes(rule.id)).map((rule) => <span key={rule.id}>{rule.name}</span>)}</div>}', expected=1)

          # Canonicalize the old House Rules hash references if any remain.
          for path in [companion, search_page]:
              text = Path(path).read_text()
              if 'view: "house-rules"' in text or 'view === "house-rules"' in text:
                  raise SystemExit(f"{path}: old House Rules view routing remains")
          if 'ReferenceDesk' in Path(companion).read_text() or 'view === "reference"' in Path(companion).read_text():
              raise SystemExit(f"{companion}: Reference Desk routing remains")
          PY

      - name: Remove temporary workflow from final tree
        run: rm .github/workflows/tmp-rulings-variants-architecture.yml

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run full repository gate
        env:
          GITHUB_PAGES: true
        run: npm test

      - name: Commit certified patch
        shell: bash
        run: |
          git config user.name "Dojo Deckbuilder Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/companion-app.tsx app/playtest.tsx app/search-page.tsx app/data/rules.json .github/workflows/tmp-rulings-variants-architecture.yml
          git commit -m "unify rulings and add optional Quick Duel variants"
          git push origin HEAD:rulings-variants-playtest-options
