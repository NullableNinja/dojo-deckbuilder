name: Temporary Stage 3E equip reconstruction

on:
  push:
    branches: [stage3e-equip-current-main]

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage3e-equip-current-main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Apply only the equip-specific stacked delta
        shell: bash
        run: |
          set -euo pipefail
          git diff --binary 4742f38afac9b3025f962020456ff699d9651ef9 addc08e291a046925990ae47b656e4031cfb782e -- \
            app/character-runtime.ts \
            app/playtest.tsx \
            app/quick-duel-character-migration.ts \
            app/quick-duel-playtest-host.ts \
            tests/quick-duel-character-equip-host.test.mjs \
            > /tmp/equip-current-main.patch
          test -s /tmp/equip-current-main.patch
          git apply --3way /tmp/equip-current-main.patch
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path = 'package.json';
          const pkg = JSON.parse(await readFile(path, 'utf8'));
          const testFile = 'tests/quick-duel-character-equip-host.test.mjs';
          if (!pkg.scripts.test.includes(testFile)) pkg.scripts.test += ` ${testFile}`;
          await writeFile(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          git diff --check
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Focused equip acceptance certification
        run: node --experimental-strip-types --test tests/quick-duel-character-equip-host.test.mjs
      - name: Current canonical/runtime/build gate
        run: npm run verify
      - name: Commit certified reconstruction and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/temp-stage3e-equip-rebuild.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Migrate Character equip to event runtime"
          git push origin HEAD:stage3e-equip-current-main
