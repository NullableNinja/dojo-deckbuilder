name: PR77 Character Choice Narrowing Repair

on:
  push:
    branches:
      - pr72-micro-recovery-clean

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr72-micro-recovery-clean
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply recovery patch and remove one-shot tooling
        run: |
          python scripts/pr77-repair.py
          rm scripts/pr77-repair.py
          rm .github/workflows/pr77-character-choice-narrowing-repair.yml

      - name: Install dependencies
        run: npm ci

      - name: Certify canonical data
        run: npm run game:check

      - name: Build application
        run: npm run build

      - name: Run full test suite
        run: npm test

      - name: Commit repaired recovery micro
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Character choice runtime recovery"
          git push origin HEAD:pr72-micro-recovery-clean
