name: Fix Belt Check Grid

on:
  push:
    branches:
      - fix/belt-check-grid-20260915

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Repair Belt Check grid
        run: node scripts/fix-belt-check-grid.mjs
      - name: Verify production gate
        run: npm run verify
      - name: Verify Belt Check geometry
        shell: bash
        run: |
          grep -F '"belt-stripes belt-track"' app/playtest.css
          grep -F '"belt-ledger belt-ledger"' app/playtest.css
          grep -F '"belt-promote belt-promote"' app/playtest.css
      - name: Remove one-time repair machinery
        run: rm -f scripts/fix-belt-check-grid.mjs .github/workflows/fix-belt-check-grid.yml
      - name: Commit repaired layout
        shell: bash
        run: |
          git config user.name 'Thomas Bryant'
          git config user.email '130773741+NullableNinja@users.noreply.github.com'
          git add -A
          git commit -m 'fix: restore Belt Check grid after CSS consolidation'
          git push origin HEAD:fix/belt-check-grid-20260915
