name: Belt Check Exclusive Wiring Runner

on: [push]

permissions:
  contents: write

jobs:
  wire:
    if: github.ref == 'refs/heads/feature/belt-check-exclusive-action'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/belt-check-exclusive-action
          fetch-depth: 0
      - name: Generate canonical runtime data
        run: node scripts/generate-game-data.mjs
      - name: Apply narrow Quick Duel patch
        run: python scripts/patch-belt-check-exclusive.py
      - name: Verify generated data and patch
        run: |
          node scripts/check-generated-game-data.mjs
          git diff --check
      - name: Commit generated mirror and host wiring
        run: |
          if git diff --quiet -- app/data/game-definition.json app/playtest.tsx; then
            echo "No generated or host changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data/game-definition.json app/playtest.tsx
          git commit -m "feat(progression): enforce one Belt Check action per turn"
          git push origin HEAD:feature/belt-check-exclusive-action
