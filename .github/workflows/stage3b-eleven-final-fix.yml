name: Stage 3B eleven final fix

on:
  push:
    branches:
      - stage3b-attack-eleven
    paths:
      - scripts/stage3b-eleven-final-fix.mjs
      - .github/workflows/stage3b-eleven-final-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: stage3b-attack-eleven
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply final regression fix
        run: node scripts/stage3b-eleven-final-fix.mjs

      - name: Validate canonical data
        run: npm run game:check

      - name: Run focused Attack tests
        run: node --experimental-strip-types --test tests/attack-structured-resolvers-batch.test.mjs

      - name: Run full repository suite
        run: npm test

      - name: Validate diff
        run: git diff --check origin/main...HEAD && git diff --check

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/playtest.tsx tests/attack-structured-resolvers-batch.test.mjs
          git commit -m "fix: use final Attack Power for response damage"
          git push origin HEAD:stage3b-attack-eleven
