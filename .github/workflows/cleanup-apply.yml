name: Apply Playtest + CSS Cleanup

on:
  push:
    branches:
      - cleanup/playtest-css-20260915

permissions:
  contents: write

jobs:
  apply-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply behavior-preserving cleanup
        run: node scripts/apply-playtest-css-cleanup.mjs
      - name: Verify canonical data, runtime tests, and production build
        run: npm run verify
      - name: Verify playtest has no unused TypeScript symbols
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import ts from 'typescript';
          import path from 'node:path';
          const configPath = ts.findConfigFile('.', ts.sys.fileExists, 'tsconfig.json');
          const configFile = ts.readConfigFile(configPath, ts.sys.readFile);
          const parsed = ts.parseJsonConfigFileContent(configFile.config, ts.sys, path.dirname(configPath), { noUnusedLocals: true, noUnusedParameters: true }, configPath);
          const program = ts.createProgram(parsed.fileNames, parsed.options);
          const unused = ts.getPreEmitDiagnostics(program)
            .filter((d) => d.file?.fileName.endsWith('/app/playtest.tsx'))
            .filter((d) => [6133, 6192, 6196].includes(d.code));
          for (const d of unused) console.error(`TS${d.code}: ${ts.flattenDiagnosticMessageText(d.messageText, '\n')}`);
          if (unused.length) process.exit(1);
          console.log('playtest.tsx unused-symbol audit: PASS');
          NODE
      - name: Verify consolidated CSS surface
        shell: bash
        run: |
          mapfile -t css_files < <(find app src -type f -name '*.css' | sort)
          printf '%s\n' "${css_files[@]}"
          test "${#css_files[@]}" -eq 3
          test -f app/globals.css
          test -f app/card-inspector.css
          test -f app/playtest.css
          test "$(grep -RIl 'playtest-board-v4.css' app src --include='*.ts' --include='*.tsx' --include='*.css' | wc -l)" -eq 0
      - name: Remove one-time cleanup machinery
        run: rm -f scripts/apply-playtest-css-cleanup.mjs .github/workflows/cleanup-apply.yml
      - name: Commit cleanup result
        shell: bash
        run: |
          git config user.name 'Thomas Bryant'
          git config user.email '130773741+NullableNinja@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: clean playtest shell and consolidate styles'
          git push origin HEAD:cleanup/playtest-css-20260915
