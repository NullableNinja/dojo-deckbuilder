name: Stage 3D Location Runtime CI

on:
  push:
    branches:
      - stage3d-location-runtime
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-location-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate canonical game data
        run: npm run game:generate

      - name: Verify generated-data drift
        run: npm run game:check

      - name: Stage 3D Location runtime tests
        run: node --experimental-strip-types --test tests/stage3d-location-runtime.test.mjs

      - name: Validate structured effects
        run: npm run validate:effects

      - name: Lint structured effects
        run: npm run lint:effects

      - name: TypeScript compile check
        run: npx tsc --noEmit

      - name: Full Node test inventory
        run: node --experimental-strip-types --test tests/*.test.mjs

      - name: Direct Vite production build
        run: npx vite build

      - name: Full repository test suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify generator left no drift
        run: git diff --exit-code
