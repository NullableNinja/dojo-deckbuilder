name: Stage 3 rebuild Character authoring

on:
  push:
    branches:
      - stage3-rebuild-current-main
    paths:
      - scripts/reconcile-stage3-character-compat.mjs
      - .github/workflows/stage3-rebuild-character-authoring.yml

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  reconcile-character-runtime:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout reconstruction branch
        uses: actions/checkout@v4
        with:
          ref: stage3-rebuild-current-main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply guarded Character reconciliation
        run: node scripts/reconcile-stage3-character-compat.mjs

      - name: TypeScript gate
        run: npx tsc --noEmit

      - name: Capture full-suite result
        id: tests
        shell: bash
        run: |
          set +e
          npm test > character-reconcile-tests.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          grep -n -B 20 -A 80 '^not ok ' character-reconcile-tests.txt > character-reconcile-failure.txt || true
          exit 0

      - name: Publish next failure
        if: steps.tests.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_EXIT_CODE: ${{ steps.tests.outputs.exit_code }}
        shell: bash
        run: |
          {
            echo '### Stage 3 Character reconciliation — next failing assertion'
            echo
            echo "Source commit: $GITHUB_SHA"
            echo "Full-suite exit code after Character migration: $TEST_EXIT_CODE"
            echo
            echo '```text'
            cat character-reconcile-failure.txt
            echo '```'
          } > character-reconcile-comment.md
          gh pr comment 48 --body-file character-reconcile-comment.md

      - name: Remove one-time authoring machinery
        run: rm scripts/reconcile-stage3-character-compat.mjs .github/workflows/stage3-rebuild-character-authoring.yml

      - name: Commit reconciled Playtest
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/playtest.tsx scripts/reconcile-stage3-character-compat.mjs .github/workflows/stage3-rebuild-character-authoring.yml
          git commit -m "reconcile Stage 3 Character runtime with current Playtest"
          git push origin HEAD:stage3-rebuild-current-main
