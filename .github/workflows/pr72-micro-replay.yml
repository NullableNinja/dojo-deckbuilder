name: PR72 Micro Replay

on:
  push:
    branches:
      - pr72-micro-recovery
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replay:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: pr72-micro-recovery

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch PR 72 source branch
        run: git fetch origin effect-certification-character-choice-ui

      - name: Replay PR 72 one diff hunk at a time
        shell: bash
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BASE=6c7dff42b0c2ac54b487f35dc242f2183c036a39
          SOURCE=origin/effect-certification-character-choice-ui
          WORKFLOW=.github/workflows/pr72-micro-replay.yml
          mkdir -p .micro-patches

          git diff --binary "$BASE" "$SOURCE" -- app/playtest.tsx tests/playtest-character-choice-ui.test.mjs > .micro-patches/full.diff

          python - <<'PY'
          from pathlib import Path
          text = Path('.micro-patches/full.diff').read_text()
          lines = text.splitlines(keepends=True)
          patches = []
          header = []
          current_file_header = []
          current_hunk = []
          current_path = None

          def flush_hunk():
              global current_hunk
              if current_hunk:
                  patches.append((''.join(current_file_header + current_hunk), current_path))
                  current_hunk = []

          i = 0
          while i < len(lines):
              line = lines[i]
              if line.startswith('diff --git '):
                  flush_hunk()
                  current_file_header = [line]
                  parts = line.strip().split()
                  current_path = parts[3][2:] if len(parts) >= 4 else 'unknown'
                  i += 1
                  while i < len(lines) and not lines[i].startswith('@@ ') and not lines[i].startswith('diff --git '):
                      current_file_header.append(lines[i])
                      i += 1
                  continue
              if line.startswith('@@ '):
                  flush_hunk()
                  current_hunk = [line]
              elif current_hunk:
                  current_hunk.append(line)
              i += 1
          flush_hunk()

          for n, (patch, path) in enumerate(patches, 1):
              Path(f'.micro-patches/{n:02d}.patch').write_text(patch)
              Path(f'.micro-patches/{n:02d}.meta').write_text(path + '\n')
          print(f'Prepared {len(patches)} micro patches')
          PY

          total=$(find .micro-patches -name '*.patch' | wc -l)
          echo "Replaying $total PR72 hunks"

          for patch in .micro-patches/[0-9][0-9].patch; do
            n=$(basename "$patch" .patch)
            path=$(cat ".micro-patches/$n.meta")
            echo "===== MICRO $n :: $path ====="
            cat "$patch"
            git apply --index "$patch"
            git commit -m "PR72 micro $n: replay $path hunk"
            git push origin HEAD:pr72-micro-recovery

            set +e
            npm test
            status=$?
            set -e

            if [ "$status" -ne 0 ]; then
              echo "PR72 culprit boundary: micro $n ($path), commit $(git rev-parse HEAD)" | tee culprit.txt
              echo "### PR72 culprit boundary" >> "$GITHUB_STEP_SUMMARY"
              echo "Micro $n — $path" >> "$GITHUB_STEP_SUMMARY"
              echo "Commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
              rm -f "$WORKFLOW"
              git add -u "$WORKFLOW"
              git commit -m "Remove temporary PR72 micro-replay harness"
              git push origin HEAD:pr72-micro-recovery
              exit "$status"
            fi
          done

          echo "All PR72 micro patches passed npm test." | tee culprit.txt
          echo "### PR72 replay result" >> "$GITHUB_STEP_SUMMARY"
          echo "All micro patches passed npm test." >> "$GITHUB_STEP_SUMMARY"
          rm -f "$WORKFLOW"
          git add -u "$WORKFLOW"
          git commit -m "Remove temporary PR72 micro-replay harness"
          git push origin HEAD:pr72-micro-recovery
