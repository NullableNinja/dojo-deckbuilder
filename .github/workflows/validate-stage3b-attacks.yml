name: Validate Stage 3B Core Attacks

on:
  push:
    branches: [stage3b-attack-final-batch]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Core Attack structured coverage
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const cards = JSON.parse(readFileSync("content/cards.json", "utf8")).cards;
          const effects = JSON.parse(readFileSync("content/card-effects.json", "utf8")).cards;
          const attacks = cards.filter((card) => String(card.catalogId ?? "").startsWith("DDB-ATK-CORE-"));
          const missing = attacks.filter((card) => !effects[card.catalogId]);
          if (attacks.length !== 71) throw new Error(`Expected 71 Core Attacks, found ${attacks.length}.`);
          if (missing.length) throw new Error(`Missing structured Attacks: ${missing.map((card) => card.catalogId).join(", ")}`);
          console.log(`Verified ${attacks.length}/${attacks.length} Core Attacks have structured registry entries.`);
          NODE

      - name: Run automated tests
        run: npm test

      - name: Build production site
        run: npm run build
