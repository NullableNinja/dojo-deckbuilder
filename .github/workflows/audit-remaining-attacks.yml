name: Audit remaining Core Attacks
on:
  push:
    branches: [stage3b-attack-final-batch]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: List remaining attacks
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const cards = JSON.parse(readFileSync('content/cards.json','utf8')).cards;
          const registry = JSON.parse(readFileSync('content/card-effects.json','utf8')).cards;
          const attacks = cards.filter(c => String(c.catalogId||'').startsWith('DDB-ATK-CORE-'));
          const remaining = attacks.filter(c => !registry[c.catalogId]);
          console.log(`TOTAL_ATTACKS=${attacks.length}`);
          console.log(`STRUCTURED=${attacks.length-remaining.length}`);
          console.log(`REMAINING=${remaining.length}`);
          for (const c of remaining) {
            console.log('---');
            console.log(`${c.catalogId} | ${c.name}`);
            console.log(`ZONE=${c.zone ?? ''} FOCUS=${c.focusValue ?? ''} COST=${c.fpCost ?? ''} TAGS=${(c.tags||[]).join(',')}`);
            console.log(`RULES=${String(c.rulesText ?? '').replace(/\s+/g,' ').trim()}`);
          }
          NODE