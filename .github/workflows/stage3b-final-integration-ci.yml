name: Stage 3B Final Integration CI

on:
  push:
    branches:
      - stage3b-final-integration
  pull_request:
    branches:
      - stage3b-final-integration

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate canonical game data
        run: npm run game:generate

      - name: Check generated game data
        run: npm run game:check

      - name: Apply catalog-aware playtest migration for validation
        run: node scripts/stage3b-catalog-aware-playtest.mjs

      - name: Run full test suite
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee stage3b-test.log

      - name: Build production bundle
        run: npm run build

      - name: Show generated effect changes
        if: always()
        run: git diff -- content/card-effects.json app/data/card-effects.json || true

      - name: Upload integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3b-integration-diagnostics
          path: |
            stage3b-test.log
            content/card-effects.json
            app/data/card-effects.json
            app/playtest.tsx
          if-no-files-found: error
