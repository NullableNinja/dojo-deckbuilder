name: Stage 3B Final Integration CI

on:
  push:
    branches:
      - stage3b-final-integration
  pull_request:
    branches:
      - stage3b-final-integration

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate canonical game data
        run: npm run game:generate

      - name: Check generated game data
        run: npm run game:check

      - name: Diagnose structured rules-text collisions
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const cards = JSON.parse(fs.readFileSync('app/data/cards.json', 'utf8')).cards;
          const registry = JSON.parse(fs.readFileSync('app/data/card-effects.json', 'utf8')).cards;
          const normalize = (value) => String(value ?? '').normalize('NFKC').replace(/\s+/g, ' ').trim();
          const groups = new Map();
          for (const card of cards) {
            const id = String(card.catalogId ?? '');
            const effects = registry[id]?.effects;
            const text = normalize(card.rulesText);
            if (!text || !Array.isArray(effects)) continue;
            const list = groups.get(text) ?? [];
            list.push({ id, name: card.name, effects });
            groups.set(text, list);
          }
          let collisions = 0;
          for (const [text, entries] of groups) {
            if (entries.length < 2) continue;
            const signatures = new Set(entries.map((entry) => JSON.stringify(entry.effects)));
            if (signatures.size < 2) continue;
            if (!entries.some((entry) => entry.id.startsWith('DDB-STA-CORE-'))) continue;
            collisions += 1;
            console.log('STRUCTURED RULES-TEXT COLLISION');
            console.log(text);
            for (const entry of entries) console.log(JSON.stringify(entry, null, 2));
          }
          console.log(`Starter collisions: ${collisions}`);
          NODE

      - name: Run full test suite
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee stage3b-test.log

      - name: Build production bundle
        run: npm run build

      - name: Show generated effect changes
        if: always()
        run: git diff -- content/card-effects.json app/data/card-effects.json || true

      - name: Upload integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3b-integration-diagnostics
          path: |
            stage3b-test.log
            content/card-effects.json
            app/data/card-effects.json
          if-no-files-found: error
