name: Stage 3B Final Integration CI

on:
  push:
    branches:
      - stage3b-final-integration
  pull_request:
    branches:
      - stage3b-final-integration

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Add Equipment runtime state types
        run: node scripts/stage3b-equipment-type-fix.mjs

      - name: Apply Equipment runtime wiring once
        run: node scripts/stage3b-equipment-runtime-wire.mjs

      - name: Normalize Equipment runtime import
        run: node scripts/stage3b-equipment-import-fix.mjs

      - name: Materialize Location family
        run: node scripts/stage3b-materialize-locations.mjs

      - name: Generate canonical game data
        run: npm run game:generate

      - name: Check generated game data
        run: npm run game:check

      - name: Run full test suite
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee stage3b-test.log

      - name: Build production bundle
        run: npm run build

      - name: Verify committed catalog-aware playtest call sites
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'effectPlanForCard(card)' app/playtest.tsx
          if grep -q 'compileCardEffects(card.rulesText' app/playtest.tsx; then
            echo 'Legacy rules-text-only card effect call site remains.' >&2
            exit 1
          fi

      - name: Freeze tested Stage 3B integration outputs
        if: github.event_name == 'push' && github.ref == 'refs/heads/stage3b-final-integration'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            content/card-effects/locations.json \
            content/card-effects.json \
            app/data/card-effects.json \
            app/card-effects.ts \
            app/effect-resolvers.ts \
            app/equipment-structured.ts \
            app/playtest.tsx
          if git diff --cached --quiet; then
            echo "Stage 3B integration outputs are already frozen."
          else
            git commit -m "Stage 3B: freeze tested integration outputs"
            git push origin HEAD:stage3b-final-integration
          fi

      - name: Upload integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3b-integration-diagnostics
          path: |
            stage3b-test.log
            app/card-effects.ts
            app/effect-resolvers.ts
            app/equipment-structured.ts
            app/location-effect-resolvers.ts
            app/playtest.tsx
            content/card-effects/locations.json
            content/card-effects.json
            app/data/card-effects.json
          if-no-files-found: error
