name: Stage 3B Final Integration CI

on:
  push:
    branches:
      - stage3b-final-integration
  pull_request:
    branches:
      - stage3b-final-integration

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate canonical game data
        run: npm run game:generate

      - name: Check generated game data
        run: npm run game:check

      - name: Run full test suite
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Show generated effect changes
        if: always()
        run: git diff -- content/card-effects.json app/data/card-effects.json || true

      - name: Upload regenerated effect aggregates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3b-generated-effects
          path: |
            content/card-effects.json
            app/data/card-effects.json
          if-no-files-found: error
