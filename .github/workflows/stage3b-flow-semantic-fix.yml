name: Stage 3B Flow semantic fix

on:
  push:
    branches:
      - stage3b-attack-flow-batch
    paths:
      - scripts/stage3b-flow-semantic-fix.mjs
      - .github/workflows/stage3b-flow-semantic-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: stage3b-attack-flow-batch
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply semantic correction
        run: node scripts/stage3b-flow-semantic-fix.mjs

      - name: Validate diff
        run: git diff --check

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/card-effects.json app/data/card-effects.json app/effect-resolvers.ts app/playtest.tsx tests/attack-structured-resolvers-batch.test.mjs
          git commit -m "fix: preserve Flow grant after draw is spent"
          git push origin HEAD:stage3b-attack-flow-batch
