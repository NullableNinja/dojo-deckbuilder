name: One-time companion polish

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-companion-polish.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply patch
        run: python scripts/one_time_companion_polish.py
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Clean temporary patch files
        run: rm scripts/one_time_companion_polish.py .github/workflows/one-time-companion-polish.yml
      - name: Commit polished companion
        run: |
          git config user.name "NullableNinja Site Automation"
          git config user.email "130773741+NullableNinja@users.noreply.github.com"
          git add -A
          git commit -m "Polish companion navigation and remove downloads"
          git push origin HEAD:main
