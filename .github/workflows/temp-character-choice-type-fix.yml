name: Temporary Character Choice Type Fix

on:
  push:
    branches:
      - effect-certification-character-choice-ui

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: effect-certification-character-choice-ui
      - name: Fix discriminated-union narrowing
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/playtest.tsx')
          src = path.read_text()
          old = '''{effectChoiceCanSkip && <footer><button className="button ghost" onClick={match.pendingChoice?.kind === "character-runtime" ? () => resolveCharacterRuntimeChoice(match.pendingChoice!.choice.options.find((option) => ["skip", "decline", "cancel"].includes(option)) ?? "decline") : skipPendingChoice}>Skip this optional effect</button></footer>}'''
          new = '''{effectChoiceCanSkip && <footer><button className="button ghost" onClick={() => { const pending = match.pendingChoice; if (pending?.kind === "character-runtime") { const selection = pending.choice.options.find((option: string) => ["skip", "decline", "cancel"].includes(option)) ?? "decline"; resolveCharacterRuntimeChoice(selection); return; } skipPendingChoice(); }}>Skip this optional effect</button></footer>}'''
          if src.count(old) != 1:
              raise SystemExit(f'expected one Character skip footer, found {src.count(old)}')
          path.write_text(src.replace(old, new, 1))
          PY
          rm .github/workflows/temp-character-choice-type-fix.yml
      - name: Commit type-safe modal callback
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/playtest.tsx .github/workflows/temp-character-choice-type-fix.yml
          git commit -m "Fix Character choice modal type narrowing"
          git push origin HEAD:effect-certification-character-choice-ui
