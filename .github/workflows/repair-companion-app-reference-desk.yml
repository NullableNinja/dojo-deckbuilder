name: Repair companion app Reference Desk integration

on:
  push:
    branches:
      - repair-companion-app-reference-desk

permissions:
  contents: write

jobs:
  repair-and-certify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore valid companion shell and reapply intended integration
        shell: bash
        run: |
          set -euo pipefail
          git show 534c81e769ecc7d6707fdb659887f170452eb1ae:app/companion-app.tsx > app/companion-app.tsx
          python - <<'PY'
          from pathlib import Path

          path = Path('app/companion-app.tsx')
          source = path.read_text()

          replacements = [
              (
                  'import PlaytestView from "./playtest";\n\nconst CardInspector = lazy(() => import("./card-inspector").then((module) => ({ default: module.CardInspector })));',
                  'const PlaytestView = lazy(() => import("./playtest"));\nconst ReferenceDesk = lazy(() => import("./reference-desk").then((module) => ({ default: module.ReferenceDesk })));\n\nconst CardInspector = lazy(() => import("./card-inspector").then((module) => ({ default: module.CardInspector })));',
              ),
              (
                  'type ViewId = "home" | "playtest" | "quickstart" | "story" | "rules" | "cards" | "rulings" | "glossary" | "house-rules";',
                  'type ViewId = "home" | "playtest" | "quickstart" | "story" | "rules" | "cards" | "reference" | "rulings" | "glossary" | "house-rules";',
              ),
              (
                  '  { id: "cards", label: "Card Library", short: "Cards" },\n  { id: "rulings", label: "Rulings & Errata", short: "Rulings" },',
                  '  { id: "cards", label: "Card Library", short: "Cards" },\n  { id: "reference", label: "Reference Desk", short: "Desk" },\n  { id: "rulings", label: "Rulings & Errata", short: "Rulings" },',
              ),
              (
                  '  cards: "Card Library",\n  rulings: "Rulings",',
                  '  cards: "Card Library",\n  reference: "Reference Desk",\n  rulings: "Rulings",',
              ),
              (
                  '  { id: "cards", label: "Card Library", detail: "Search the registered curriculum." },\n  { id: "rulings", label: "Rulings & Errata", detail: "The Department’s clarifications." },',
                  '  { id: "cards", label: "Card Library", detail: "Search the registered curriculum." },\n  { id: "reference", label: "Reference Desk", detail: "Canonical table lookup from generated game data." },\n  { id: "rulings", label: "Rulings & Errata", detail: "The Department’s clarifications." },',
              ),
              (
                  '  const moreActive = view === "story" || view === "rulings" || view === "glossary" || view === "house-rules";',
                  '  const moreActive = view === "story" || view === "reference" || view === "rulings" || view === "glossary" || view === "house-rules";',
              ),
              (
                  '{view === "home" && <HomeView goTo={goTo} />}{view === "playtest" && <PlaytestView goTo={goTo} />}{view === "quickstart"',
                  '{view === "home" && <HomeView goTo={goTo} />}{view === "playtest" && <Suspense fallback={null}><PlaytestView goTo={goTo} /></Suspense>}{view === "reference" && <Suspense fallback={null}><ReferenceDesk goTo={goTo} /></Suspense>}{view === "quickstart"',
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match for repair anchor, found {count}: {old[:100]!r}')
              source = source.replace(old, new, 1)

          path.write_text(source)
          PY

      - name: Remove one-shot repair workflow before certification
        run: git rm .github/workflows/repair-companion-app-reference-desk.yml

      - name: Install dependencies
        run: npm ci

      - name: Verify generated game data
        run: npm run game:check

      - name: Certify Reference Desk integration
        run: node --test tests/reference-desk.test.mjs

      - name: Run full repository gate
        run: npm test

      - name: Verify clean patch shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          test "$(git status --short | wc -l)" -eq 2
          git status --short | grep -q '^ M app/companion-app.tsx'
          git status --short | grep -q '^D  .github/workflows/repair-companion-app-reference-desk.yml'

      - name: Commit certified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/companion-app.tsx
          git commit -m 'fix: restore companion app Reference Desk integration'
          git push origin HEAD:repair-companion-app-reference-desk
