name: One-off Training Stripe Current Main Wiring

on:
  push:
    branches:
      - feature/training-stripe-healing-current-main
    paths:
      - .github/workflows/stripe-healing-current-main-wire.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/training-stripe-healing-current-main
          fetch-depth: 0
      - name: Regenerate data and apply narrow Playtest host wiring
        run: |
          node scripts/generate-game-data.mjs
          python - <<'PY'
          from pathlib import Path

          path = Path('app/playtest.tsx')
          source = path.read_text()

          import_line = 'import { QUICK_DUEL_TRAINING_STRIPE_HEAL_REQUEST_EVENT, spendQuickDuelTrainingStripeForHealing } from "./quick-duel-training-stripes.ts";\n'
          if import_line not in source:
              marker = 'import { QUICK_DUEL_HOUSE_RULES, effectiveBeltThresholds, hasQuickDuelHouseRule, sanitizeQuickDuelHouseRuleIds, shouldRefreshMarketAtRoundEnd } from "./playtest-house-rules";\n'
              index = source.find(marker)
              if index < 0:
                  raise SystemExit('Playtest house-rule import marker not found')
              end = index + len(marker)
              source = source[:end] + import_line + source[end:]

          effect_block = '''  useEffect(() => {
    const handleTrainingStripeHeal = () => {
      if (deskView !== "belt") return;
      setMatch((current) => {
        if (!current || current.phase !== "player-ascend") return current;
        const next = spendQuickDuelTrainingStripeForHealing(current, "player", "belt-check");
        if (next === current) return current;
        const recovered = next.player.hp - current.player.hp;
        if (recovered <= 0) return current;
        return {
          ...next,
          log: [`Training Stripe redeemed: recover ${recovered} HP (${current.player.hp} → ${next.player.hp}).`, ...next.log].slice(0, 32),
        };
      });
    };
    window.addEventListener(QUICK_DUEL_TRAINING_STRIPE_HEAL_REQUEST_EVENT, handleTrainingStripeHeal);
    return () => window.removeEventListener(QUICK_DUEL_TRAINING_STRIPE_HEAL_REQUEST_EVENT, handleTrainingStripeHeal);
  }, [deskView]);
'''
          if effect_block not in source:
              marker = '  const [rulesSync, setRulesSync] = useState<RulesSyncState>('
              index = source.find(marker)
              if index < 0:
                  raise SystemExit('Playtest rulesSync marker not found')
              source = source[:index] + effect_block + source[index:]

          path.write_text(source)
          PY
      - name: Verify narrow changes
        run: |
          node scripts/check-generated-game-data.mjs
          git diff --check
          git diff -- app/data/game-definition.json app/playtest.tsx
      - name: Commit generated mirror and Playtest wiring
        run: |
          if git diff --quiet -- app/data/game-definition.json app/playtest.tsx; then
            echo "Generated mirror and Playtest host already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data/game-definition.json app/playtest.tsx
          git commit -m "feat(stripes): wire healing into current Quick Duel host"
          git push origin HEAD:feature/training-stripe-healing-current-main
