name: Repair Custom Stat Remediation Anchor Once
on:
  push:
    branches: [stage3c-play-surface-remediation]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Repair exact playtest import anchor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/apply-stage3c-custom-stat-remediation.yml')
          t=p.read_text()
          old="          anchor='import {\\n  consumableRuntimeCommands,'\n          if anchor not in t: raise SystemExit('playtest import anchor missing')\n          t=t.replace(anchor, 'import { applyStage3CBoardCustomCommand, revertStage3CBoardCustomStatus } from \"./stage3c-board-command-semantics.ts\";\\n'+anchor,1)"
          new="          anchor='import { consumableRuntimeCommands, type ConsumableRuntimeContext } from \\\"./consumable-effect-resolvers\\\";'\n          if anchor not in t: raise SystemExit('playtest import anchor missing')\n          t=t.replace(anchor, anchor+'\\nimport { applyStage3CBoardCustomCommand, revertStage3CBoardCustomStatus } from \\\"./stage3c-board-command-semantics.ts\\\";',1)"
          if old not in t: raise SystemExit('workflow repair target missing')
          p.write_text(t.replace(old,new,1))
          PY
      - name: Commit repaired one-shot workflow and remove repair helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-custom-stat-remediation-anchor.yml
          git add .github/workflows/apply-stage3c-custom-stat-remediation.yml
          git commit -m "chore: repair Stage 3C custom stat migration anchor"
          git push origin HEAD:stage3c-play-surface-remediation
