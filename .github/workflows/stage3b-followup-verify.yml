name: Stage 3B follow-up Attack verify

on:
  push:
    branches:
      - stage3b-attack-followup-state
    paths:
      - .github/workflows/stage3b-followup-verify.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: stage3b-attack-followup-state

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full automated test suite
        run: npm test

      - name: Validate repository diff
        run: git diff --check
