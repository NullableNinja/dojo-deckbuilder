name: Apply Stage 3C Incoming Defense Remediation Once

on:
  push:
    branches:
      - stage3c-play-surface-remediation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply product patch
        shell: bash
        run: |
          python3 .github/scripts/stage3c-incoming-defense-remediation.py
          git diff --check

      - name: Commit product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-stage3c-incoming-defense-remediation.yml .github/scripts/stage3c-incoming-defense-remediation.py
          git add app/playtest.tsx tests/playtest-effect-integration.test.mjs
          git commit -m "fix: separate incoming Attack DEF from Defense Guard"
          git push origin HEAD:stage3c-play-surface-remediation
