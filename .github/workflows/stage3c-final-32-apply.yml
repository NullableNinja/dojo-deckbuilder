name: Stage 3C Final 32 Consumable Remediation

on:
  push:
    branches:
      - stage3c-play-surface-remediation

permissions:
  contents: write

jobs:
  apply-and-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply final 32 remediation
        run: node scripts/apply-stage3c-final-32.mjs

      - name: Generate canonical runtime data
        run: npm run game:generate

      - name: Verify canonical runtime data
        run: npm run game:check

      - name: Regress prior 30 Consumables
        run: node --experimental-strip-types --test tests/stage3c-consumable-thirty-card-batch.test.mjs

      - name: Certify remaining 32 Consumables
        run: node --experimental-strip-types --test tests/stage3c-consumable-final-32.test.mjs

      - name: Full repository suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify patch hygiene
        run: git diff --check

      - name: Remove one-shot remediation scaffolding
        run: |
          rm scripts/apply-stage3c-final-32.mjs
          rm .github/workflows/stage3c-final-32-apply.yml

      - name: Commit certified production result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: certify remaining 32 Core Consumables on play surface"
          git push origin HEAD:stage3c-play-surface-remediation
