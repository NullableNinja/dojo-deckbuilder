name: Stage 3C Final 32 Consumable Remediation

on:
  push:
    branches:
      - stage3c-play-surface-remediation

permissions:
  contents: write

jobs:
  apply-and-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repair and syntax-check one-shot patcher
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-stage3c-final-32.mjs')
          text = path.read_text()
          old = 'pendingChoice ? ` Up to \\${remaining} more may be discarded.` : " Choice complete."'
          new = 'pendingChoice ? " Up to " + remaining + " more may be discarded." : " Choice complete."'
          if old not in text:
              raise SystemExit('expected nested template anchor not found')
          text = text.replace(old, new, 1)
          strict = '  if (count !== 1) throw new Error(`${label}: expected one anchor, found ${count}`);\n  return source.replace(search, replacement);'
          smoke_safe = '  if (label === "player blocked by Smoke" && count === 2) return source.split(search).join(replacement);\n  if (count !== 1) throw new Error(`${label}: expected one anchor, found ${count}`);\n  return source.replace(search, replacement);'
          if strict not in text:
              raise SystemExit('replaceOnce safety anchor not found')
          text = text.replace(strict, smoke_safe, 1)
          path.write_text(text)
          PY
          node --check scripts/apply-stage3c-final-32.mjs

      - name: Apply final 32 remediation
        run: node scripts/apply-stage3c-final-32.mjs

      - name: Apply canonical and TypeScript post-patch corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          playtest = Path('app/playtest.tsx')
          text = playtest.read_text()

          def one(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label} anchor count={count}')
              text = text.replace(old, new, 1)

          one('hpThresholdMet: board.hp <= Math.ceil(board.maxHp / 2),', 'hpThresholdMet: board.hp <= 10,', 'Fruit Cup context')
          one(', selectedAttackId: undefined as never', '', 'Smoke Board shape')
          one('let player = spendMarketFocus(current.player, revealed, price);', 'let player: Board = spendMarketFocus(current.player, revealed, price);', 'Raffle Board inference')
          one('let nextPlayer = spendMarketFocus(current.player, card, price);', 'let nextPlayer: Board = spendMarketFocus(current.player, card, price);', 'Market Board inference')
          lucky_player = 'let player = { ...current.player, hand: removeOne(current.player.hand, lucky.id), playArea: [...current.player.playArea, lucky.id], usedConsumableThisRound: true, reactionItemUsedSinceLastTurn: true };'
          one(lucky_player, 'let player: Board = { ...current.player, hand: removeOne(current.player.hand, lucky.id), playArea: [...current.player.playArea, lucky.id], usedConsumableThisRound: true, reactionItemUsedSinceLastTurn: true };', 'Lucky Board inference')
          lucky_ai = 'let ai = { ...current.ai, hand: removeOne(current.ai.hand, aiAirHorn.id), playArea: [...current.ai.playArea, aiAirHorn.id], usedConsumableThisRound: true, reactionItemUsedSinceLastTurn: true };'
          one(lucky_ai, 'let ai: Board = { ...current.ai, hand: removeOne(current.ai.hand, aiAirHorn.id), playArea: [...current.ai.playArea, aiAirHorn.id], usedConsumableThisRound: true, reactionItemUsedSinceLastTurn: true };', 'Lucky Air Horn Board inference')

          old_location = 'if (sceneChanges && lucky && locationId !== current.locationId) return write(advanced, `${cardFor(locationId)?.name ?? "A Location"} was revealed. Lucky Dumpling may replace it.`, { pendingChoice: { kind: "stage3c-lucky-reveal", sourceCardId: lucky.id, revealKind: "location", revealedCardId: locationId } });'
          new_location = 'if (sceneChanges && lucky && locationId !== current.locationId) { const message = `${cardFor(locationId)?.name ?? "A Location"} was revealed. Lucky Dumpling may replace it.`; return { ...advanced, pendingChoice: { kind: "stage3c-lucky-reveal", sourceCardId: lucky.id, revealKind: "location", revealedCardId: locationId } as PendingChoice, log: [message, ...advanced.log].slice(0, 32) }; }'
          one(old_location, new_location, 'Lucky Location reveal')

          old_market = 'if (revealedId && slot >= 0) return write(advanced, `${cardFor(revealedId)?.name ?? "A Market card"} was revealed during Market Mercy. Lucky Dumpling may replace it.`, { pendingChoice: { kind: "stage3c-lucky-reveal", sourceCardId: lucky.id, revealKind: "market", revealedCardId, marketSlot: slot } });'
          new_market = 'if (revealedId && slot >= 0) { const message = `${cardFor(revealedId)?.name ?? "A Market card"} was revealed during Market Mercy. Lucky Dumpling may replace it.`; return { ...advanced, pendingChoice: { kind: "stage3c-lucky-reveal", sourceCardId: lucky.id, revealKind: "market", revealedCardId: revealedId, marketSlot: slot } as PendingChoice, log: [message, ...advanced.log].slice(0, 32) }; }'
          one(old_market, new_market, 'Lucky Market reveal')
          playtest.write_text(text)

          consumables = Path('content/card-effects/consumables.json')
          text = consumables.read_text()
          old_voucher = '"target":"chosen-card","amount":-2,"duration":"immediate","resolver":"consumable.ascendPurchaseDiscount"'
          new_voucher = '"target":"self","amount":-2,"duration":"endOfTurn","resolver":"consumable.ascendPurchaseDiscount"'
          if text.count(old_voucher) != 1:
              raise SystemExit(f'Laminated Lunch Voucher canonical anchor count={text.count(old_voucher)}')
          consumables.write_text(text.replace(old_voucher, new_voucher, 1))

          guard = Path('tests/playtest-regression-guardrails.test.mjs')
          text = guard.read_text()
          old_spend = 'assert.match(playtest, /spendFocus\\(current\\.player, price\\)/);'
          new_spend = 'assert.match(playtest, /spendMarketFocus\\(current\\.player, card, price\\)/);'
          if text.count(old_spend) != 1:
              raise SystemExit('market Focus regression anchor missing')
          guard.write_text(text.replace(old_spend, new_spend, 1))

          runtime_contract = Path('tests/stage3c-defense-consumable-runtime.test.mjs')
          text = runtime_contract.read_text()
          old_choice = '    "consumable.ascendPurchaseDiscount",\n'
          if text.count(old_choice) != 1:
              raise SystemExit(f'Lunch Voucher stale explicit-choice anchor count={text.count(old_choice)}')
          runtime_contract.write_text(text.replace(old_choice, '', 1))

          test = Path('tests/stage3c-consumable-final-32.test.mjs')
          text = test.read_text()
          old_threshold = 'assert.ok(source.includes("board.hp <= Math.ceil(board.maxHp / 2)"));'
          new_threshold = 'assert.ok(source.includes("board.hp <= 10"));'
          if text.count(old_threshold) != 1:
              raise SystemExit('Fruit Cup assertion anchor missing')
          text = text.replace(old_threshold, new_threshold, 1)
          old_smoke = 'assert.ok(source.includes("Smoke Bomb invalidates the Attack target"));'
          new_smoke = 'assert.ok(source.includes("invalidates the Attack target"));'
          if text.count(old_smoke) != 1:
              raise SystemExit('Smoke assertion anchor missing')
          test.write_text(text.replace(old_smoke, new_smoke, 1))
          PY

      - name: Generate canonical runtime data
        run: npm run game:generate

      - name: Verify canonical runtime data
        run: npm run game:check

      - name: Regress prior 30 Consumables
        run: node --experimental-strip-types --test tests/stage3c-consumable-thirty-card-batch.test.mjs

      - name: Certify remaining 32 Consumables
        run: node --experimental-strip-types --test tests/stage3c-consumable-final-32.test.mjs

      - name: TypeScript compile gate
        run: npx tsc --noEmit

      - name: Remove one-shot remediation scaffolding before repository certification
        run: |
          rm scripts/apply-stage3c-final-32.mjs
          rm .github/workflows/stage3c-final-32-apply.yml

      - name: Production build
        run: npm run build

      - name: Full repository suite
        run: |
          set -o pipefail
          npm test 2>&1 | tee stage3c-full-suite.log
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then rm -f stage3c-full-suite.log; fi
          exit "$status"

      - name: Upload remediation diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stage3c-remediation-diagnostics
          path: stage3c-full-suite.log

      - name: Verify patch hygiene
        run: git diff --check

      - name: Commit certified production result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: certify remaining 32 Core Consumables on play surface"
          git push origin HEAD:stage3c-play-surface-remediation
