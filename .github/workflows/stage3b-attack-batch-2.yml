name: Apply Stage 3B Attack batch 2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stage3b-attack-batch-2.yml"

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply canonical Attack migration
        run: node scripts/migrate-attack-batch-2.mjs

      - name: Commit migration and remove one-time helpers
        run: |
          rm .github/workflows/stage3b-attack-batch-2.yml
          rm scripts/migrate-attack-batch-2.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "content: migrate second structured Attack batch"
          git push origin HEAD:main
