name: Temporary Kata batch5 certification
on:
  push:
    branches: [fix/effect-runtime-certification-batch5]
permissions:
  contents: write
jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/effect-runtime-certification-batch5
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - run: npm ci
      - name: Apply Kata DEF and Hide patch
        run: python scripts/temp-kata-batch5-implement.py
      - name: Regenerate canonical aggregates
        run: npm run game:generate
      - name: Focused acceptance
        run: node --experimental-strip-types --test tests/quick-duel-kata-defense-hide-runtime.test.mjs tests/quick-duel-kata-stateful-runtime.test.mjs tests/quick-duel-kata-combat-runtime.test.mjs tests/quick-duel-kata-consumable-runtime.test.mjs
      - name: Commit implementation for drift-safe verification
        run: |
          git config user.name "NullableNinja"
          git config user.email "130773741+NullableNinja@users.noreply.github.com"
          git add content/card-effects/katas.json content/card-effects.json app/data/card-effects.json app/kata-effect-resolvers.ts app/kata-playtest-bridge.ts app/playtest.tsx package.json tests/quick-duel-kata-defense-hide-runtime.test.mjs
          git commit -m "Fix Kata DEF and Hide runtime effects"
      - name: Full verification
        run: npm run verify
      - name: Diff check
        run: git diff --check
      - name: Clean temporary machinery and publish
        if: success()
        run: |
          rm -f .github/workflows/temp-kata-batch5-audit.yml
          rm -f scripts/temp-kata-batch5-implement.py
          git add -A
          git commit -m "chore: remove Kata batch5 certification machinery"
          git push origin HEAD:fix/effect-runtime-certification-batch5
