name: Apply Stage 3C Lifecycle Context Remediation Once

on:
  push:
    branches:
      - stage3c-play-surface-remediation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply product patch
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/stage3c-patch.py
          python3 /tmp/stage3c-patch.py
          git diff --check

      - name: Commit product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-stage3c-lifecycle-context-remediation.yml
          git add app/consumable-effect-resolvers.ts app/playtest.tsx tests/stage3c-defense-consumable-runtime.test.mjs tests/playtest-effect-integration.test.mjs
          git commit -m "fix: enforce Consumable turn-round lifecycle and post-play context"
          git push origin HEAD:stage3c-play-surface-remediation
