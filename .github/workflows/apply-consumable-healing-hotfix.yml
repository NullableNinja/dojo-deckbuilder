name: Apply Consumable Healing Hotfix Once

on:
  push:
    branches:
      - hotfix-stage3c-consumable-healing

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch structured solo-friendly healing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          resolver = Path('app/consumable-effect-resolvers.ts')
          text = resolver.read_text()
          old = '  revealedDifferentTypeCount?: number;\n  selectedEquipmentSubtype?: string;'
          new = '  revealedDifferentTypeCount?: number;\n  friendlyTargetCount?: number;\n  selectedEquipmentSubtype?: string;'
          if old not in text:
              raise SystemExit('ConsumableRuntimeContext anchor missing')
          text = text.replace(old, new, 1)

          old = '''  if (choiceResolver(resolver) && [\n    "core.custom",\n    "core.choice",\n    "core.destroy",\n    "core.discard",\n    "core.reveal",\n    "core.heal",\n    "combat.modifyAttackPower",\n    "combat.modifyGuard",\n    "combat.modifySpeed",\n    "economy.modifyCost",\n    "equipment.exhaust",\n  ].includes(command.effect)) {\n    command.choice = { resolver, catalogId };\n  }'''
          new = '''  const autoResolveSoloFriendlyHeal = command.effect === "core.heal"\n    && command.target === "self"\n    && Number(context.friendlyTargetCount ?? 0) === 1\n    && new Set([\n      "consumable.chooseFriendlyHealTarget",\n      "consumable.healByChosenFriendlyPosition",\n      "consumable.healAndRemoveStatus",\n    ]).has(resolver);\n\n  if (!autoResolveSoloFriendlyHeal && choiceResolver(resolver) && [\n    "core.custom",\n    "core.choice",\n    "core.destroy",\n    "core.discard",\n    "core.reveal",\n    "core.heal",\n    "combat.modifyAttackPower",\n    "combat.modifyGuard",\n    "combat.modifySpeed",\n    "economy.modifyCost",\n    "equipment.exhaust",\n  ].includes(command.effect)) {\n    command.choice = { resolver, catalogId };\n  }'''
          if old not in text:
              raise SystemExit('choice qualification anchor missing')
          resolver.write_text(text.replace(old, new, 1))

          playtest = Path('app/playtest.tsx')
          text = playtest.read_text()
          old = '    normalAttacksResolvedThisTurn: board.attacksThisTurn,\n    temporaryNegativeModifierPresent:'
          new = '    normalAttacksResolvedThisTurn: board.attacksThisTurn,\n    friendlyTargetCount: 1,\n    temporaryNegativeModifierPresent:'
          if old not in text:
              raise SystemExit('Quick Duel Consumable context anchor missing')
          playtest.write_text(text.replace(old, new, 1))

          tests = Path('tests/stage3c-defense-consumable-runtime.test.mjs')
          text = tests.read_text()
          old = '  revealedDifferentTypeCount: 3,\n  selectedEquipmentSubtype: "Gear",'
          new = '  revealedDifferentTypeCount: 3,\n  friendlyTargetCount: 2,\n  selectedEquipmentSubtype: "Gear",'
          if old not in text:
              raise SystemExit('Consumable base test context anchor missing')
          text = text.replace(old, new, 1)

          anchor = '''test("next-Attack Consumable modifiers persist exactly once and are consumed at the Attack hook", () => {'''
          regression = '''test("solo-friendly healing resolves into HP instead of an unreachable target choice", () => {\n  const soloHealResolvers = new Set([\n    "consumable.chooseFriendlyHealTarget",\n    "consumable.healByChosenFriendlyPosition",\n    "consumable.healAndRemoveStatus",\n  ]);\n  const failures = [];\n  for (const [catalogId, definition] of Object.entries(consumables)) {\n    const healEffects = (definition.effects ?? []).filter((effect) => effect.effect === "core.heal" && soloHealResolvers.has(effect.resolver));\n    for (const effect of healEffects) {\n      const commands = consumableRuntimeCommands(card(catalogId), "onPlay", { ...consumableBaseContext, friendlyTargetCount: 1 });\n      const command = commands.find((candidate) => candidate.sourceEffectId === effect.id);\n      if (!command) { failures.push(`${catalogId}:${effect.id}:missing-command`); continue; }\n      if (command.choice) failures.push(`${catalogId}:${effect.id}:still-queued-as-choice`);\n      const state = applyConsumableRuntime(createFamilyRuntimeState({ self: { hp: 1, maxHp: 20 } }), card(catalogId), "onPlay", { ...consumableBaseContext, friendlyTargetCount: 1 });\n      if (state.self.hp < 1 + Number(effect.amount ?? 0)) failures.push(`${catalogId}:${effect.id}:heal-not-applied`);\n      if (state.pendingChoices.some((choice) => choice.sourceEffectId === effect.id)) failures.push(`${catalogId}:${effect.id}:unreachable-choice-remains`);\n    }\n  }\n  assert.deepEqual(failures, []);\n});\n\n'''
          if anchor not in text:
              raise SystemExit('Stage 3C regression insertion anchor missing')
          tests.write_text(text.replace(anchor, regression + anchor, 1))

          integration = Path('tests/playtest-effect-integration.test.mjs')
          text = integration.read_text()
          anchor = '''test("Quick Duel pauses for explicit player-choice effects instead of auto-resolving them", async () => {'''
          regression = '''test("Quick Duel marks its single friendly fighter so structured healing auto-resolves", async () => {\n  const source = await readFile(new URL("../app/playtest.tsx", import.meta.url), "utf8");\n  assert.match(source, /friendlyTargetCount: 1/);\n  assert.match(source, /applyStage3CTiming\(next, card, timing, owner, context, "self"\)/);\n});\n\n\n'''
          if anchor not in text:
              raise SystemExit('Playtest regression insertion anchor missing')
          integration.write_text(text.replace(anchor, regression + anchor, 1))
          PY

      - name: Remove one-shot workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-consumable-healing-hotfix.yml
          git add app/consumable-effect-resolvers.ts app/playtest.tsx tests/stage3c-defense-consumable-runtime.test.mjs tests/playtest-effect-integration.test.mjs
          git diff --check
          git commit -m "fix: resolve structured Consumable healing in Quick Duel"
          git push origin HEAD:hotfix-stage3c-consumable-healing
