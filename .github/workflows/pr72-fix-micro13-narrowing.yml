name: PR72 Fix Micro 13 Narrowing

on:
  push:
    branches:
      - pr72-micro-recovery-clean
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr72-micro-recovery-clean
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm
      - run: npm ci
      - name: Remove one-shot harness
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr72-fix-micro13-narrowing.yml
          git commit -m "Remove one-shot Micro 13 narrowing repair harness"
          git push origin HEAD:pr72-micro-recovery-clean
      - name: Repair Character choice narrowing and certify
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('app/playtest.tsx')
          s = p.read_text()
          marker = '  const effectChoiceTitle = match.pendingChoice?.kind === "character-runtime" ? "Character ability"\n'
          if '  const characterRuntimePending = match.pendingChoice?.kind === "character-runtime" ? match.pendingChoice : null;\n' not in s:
              if marker not in s:
                  raise SystemExit('Micro 13 title marker not found')
              s = s.replace(marker, '  const characterRuntimePending = match.pendingChoice?.kind === "character-runtime" ? match.pendingChoice : null;\n  const effectChoiceTitle = characterRuntimePending ? "Character ability"\n', 1)
          s = s.replace('  const effectChoicePrompt = match.pendingChoice?.kind === "character-runtime" ? match.pendingChoice.choice.prompt\n', '  const effectChoicePrompt = characterRuntimePending ? characterRuntimePending.choice.prompt\n', 1)
          s = s.replace('  const effectChoiceCanSkip = (match.pendingChoice?.kind === "character-runtime" && match.pendingChoice.choice.optional) ||', '  const effectChoiceCanSkip = Boolean(characterRuntimePending?.choice.optional) ||', 1)
          old_modal = '{match.pendingChoice?.kind === "character-runtime" ? match.pendingChoice.choice.options.filter((option) => !["skip", "decline", "cancel"].includes(option)).map((option) => {'
          new_modal = '{characterRuntimePending ? characterRuntimePending.choice.options.filter((option) => !["skip", "decline", "cancel"].includes(option)).map((option) => {'
          if old_modal in s:
              s = s.replace(old_modal, new_modal, 1)
          elif new_modal not in s:
              raise SystemExit('Micro 13 modal marker not found')
          p.write_text(s)
          PY
          npm test
          git add app/playtest.tsx
          git commit -m "Fix Character choice modal narrowing"
          git push origin HEAD:pr72-micro-recovery-clean
