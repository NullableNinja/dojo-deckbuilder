name: Apply Stage 3C Player Air Horn Once

on:
  push:
    branches:
      - stage3c-play-surface-remediation
    paths:
      - scripts/apply-stage3c-player-air-horn.mjs
      - .github/workflows/apply-stage3c-player-air-horn.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage3c-play-surface-remediation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/apply-stage3c-player-air-horn.mjs
      - run: git rm scripts/apply-stage3c-player-air-horn.mjs .github/workflows/apply-stage3c-player-air-horn.yml
      - run: node --experimental-strip-types --test tests/stage3c-event-reaction-contracts.test.mjs tests/stage3c-air-horn-play-surface.test.mjs tests/stage3c-player-air-horn-play-surface.test.mjs tests/stage3c-consumable-reaction-ai.test.mjs tests/stage3c-consumable-play-window.test.mjs
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - run: git diff --check
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/playtest.tsx tests/stage3c-player-air-horn-play-surface.test.mjs
          git add -u
          git commit -m 'feat: let player Air Horn interrupt AI Reactions'
          git push origin HEAD:stage3c-play-surface-remediation
