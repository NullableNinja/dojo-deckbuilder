name: Stage 3 Playtest Host Authoring

on:
  push:
    branches:
      - stage3-final-machine-readable-certification
    paths:
      - scripts/apply-stage3-playtest-host.mjs

permissions:
  contents: write

jobs:
  apply-host-migration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: stage3-final-machine-readable-certification
          fetch-depth: 0

      - name: Apply guarded Playtest migration
        run: node scripts/apply-stage3-playtest-host.mjs

      - name: Verify patch shape
        run: |
          git diff --check
          git diff -- app/playtest.tsx

      - name: Commit migrated source
        run: |
          if git diff --quiet -- app/playtest.tsx; then
            echo "No Playtest source change was produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/playtest.tsx
          git commit -m "route AI Attack through unified Combo host"
          git push origin HEAD:stage3-final-machine-readable-certification
