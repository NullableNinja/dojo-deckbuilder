name: Card Library Inspector Validation

on:
  push:
    branches:
      - card-library-inspector
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check generated game data
        run: npm run game:check
      - name: Build production bundle
        run: npm run build
      - name: Run repository tests
        run: npm test
