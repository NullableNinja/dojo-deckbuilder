name: Apply Stage 3C Junk Choice Remediation Once

on:
  push:
    branches:
      - stage3c-play-surface-remediation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch resolver-derived Junk choice semantics
        run: |
          python3 - <<'PY'
          from pathlib import Path

          resolver = Path('app/consumable-effect-resolvers.ts')
          text = resolver.read_text()
          old = '  opponentTargetCount?: number;\n  selectedEquipmentSubtype?: string;'
          new = '  opponentTargetCount?: number;\n  junkDestroyed?: boolean;\n  selectedEquipmentSubtype?: string;'
          if old not in text: raise SystemExit('Consumable junk context anchor missing')
          text = text.replace(old, new, 1)

          old = '''    case "consumable.healByChosenFriendlyPosition":\n      return !context.chosenFriendlyIsBenched || Boolean(context.chosenFriendlyIsConscious);\n    default:'''
          new = '''    case "consumable.healByChosenFriendlyPosition":\n      return !context.chosenFriendlyIsBenched || Boolean(context.chosenFriendlyIsConscious);\n    case "consumable.destroyJunkThenDrawTwo":\n      return effect.effect !== "core.draw" || Boolean(context.junkDestroyed);\n    default:'''
          if old not in text: raise SystemExit('Consumable resolver-condition anchor missing')
          text = text.replace(old, new, 1)

          old = '''export function structuredConsumableDestroyJunkCount(card: RuntimeCardLike) {\n  return consumableRuntimeCommands(card, "onPlay")\n    .filter((command) => command.effect === "core.destroy" && command.target === "chosen-card")\n    .reduce((total, command) => total + Math.max(1, command.amount), 0);\n}\n'''
          new = '''export type StructuredConsumableJunkChoicePlan = {\n  resolver: "consumable.destroyJunkThenDrawTwo" | "consumable.destroyJunkFromHand" | "consumable.optionalDestroyJunkFromHand";\n  count: number;\n  sources: ("hand" | "discard")[];\n  optional: boolean;\n  drawAfterSuccess: number;\n};\n\nexport function structuredConsumableDestroyJunkPlan(card: RuntimeCardLike): StructuredConsumableJunkChoicePlan | null {\n  const effects = structuredRuntimeEffects(card);\n  const destroy = effects.find((effect) =>\n    effect.effect === "core.destroy"\n    && effect.target === "chosen-card"\n    && new Set([\n      "consumable.destroyJunkThenDrawTwo",\n      "consumable.destroyJunkFromHand",\n      "consumable.optionalDestroyJunkFromHand",\n    ]).has(String(effect.resolver ?? ""))\n  );\n  if (!destroy) return null;\n  const resolver = String(destroy.resolver) as StructuredConsumableJunkChoicePlan["resolver"];\n  const drawAfterSuccess = resolver === "consumable.destroyJunkThenDrawTwo"\n    ? effects.filter((effect) => effect.resolver === resolver && effect.effect === "core.draw").reduce((total, effect) => total + Math.max(0, Number(effect.amount ?? 0)), 0)\n    : 0;\n  return {\n    resolver,\n    count: Math.max(1, Number(destroy.amount ?? 1)),\n    sources: resolver === "consumable.destroyJunkThenDrawTwo" ? ["hand", "discard"] : ["hand"],\n    optional: resolver === "consumable.optionalDestroyJunkFromHand",\n    drawAfterSuccess,\n  };\n}\n\nexport function structuredConsumableDestroyJunkCount(card: RuntimeCardLike) {\n  return structuredConsumableDestroyJunkPlan(card)?.count ?? 0;\n}\n'''
          if old not in text: raise SystemExit('structuredConsumableDestroyJunkCount block missing')
          resolver.write_text(text.replace(old, new, 1))

          facade = Path('app/effect-resolvers.ts')
          text = facade.read_text()
          old = '  structuredConsumableDestroyJunkCount,\n'
          new = '  structuredConsumableDestroyJunkCount,\n  structuredConsumableDestroyJunkPlan,\n'
          if old not in text: raise SystemExit('effect-resolvers import anchor missing')
          text = text.replace(old, new, 1)
          anchor = '''export function destroyJunkChoiceCount(card: Parameters<typeof legacy.destroyJunkChoiceCount>[0]) {\n  if (isCoreConsumable(card)) return structuredConsumableDestroyJunkCount(card);\n  return legacy.destroyJunkChoiceCount(card);\n}\n'''
          addition = anchor + '''\nexport function destroyJunkChoicePlan(card: Parameters<typeof legacy.destroyJunkChoiceCount>[0]) {\n  if (isCoreConsumable(card)) return structuredConsumableDestroyJunkPlan(card);\n  const count = legacy.destroyJunkChoiceCount(card);\n  return count ? { resolver: "legacy" as const, count, sources: ["hand", "discard"] as ("hand" | "discard")[], optional: false, drawAfterSuccess: 0 } : null;\n}\n'''
          if anchor not in text: raise SystemExit('destroyJunkChoiceCount facade anchor missing')
          facade.write_text(text.replace(anchor, addition, 1))

          playtest = Path('app/playtest.tsx')
          text = playtest.read_text()
          text = text.replace('destroyJunkChoiceCount, destroysAfterUse,', 'destroyJunkChoiceCount, destroyJunkChoicePlan, destroysAfterUse,', 1)
          old = '  | { kind: "destroy-junk"; sourceCardId: string; remaining: number }'
          new = '  | { kind: "destroy-junk"; sourceCardId: string; remaining: number; sources?: ("hand" | "discard")[]; optional?: boolean; drawAfterSuccess?: number }'
          if old not in text: raise SystemExit('PendingChoice destroy-junk anchor missing')
          text = text.replace(old, new, 1)

          old = '''    const junkCount = destroyJunkChoiceCount(card);\n    const mandatoryDiscard = mandatoryDiscardChoiceCount(card);\n    const hasJunk = [...nextPlayer.hand, ...nextPlayer.discard].some((candidate) => isJunk(cardFor(candidate)));\n    let pendingChoice: PendingChoice | null = junkCount && hasJunk\n      ? { kind: "destroy-junk", sourceCardId: id, remaining: junkCount }'''
          new = '''    const junkPlan = destroyJunkChoicePlan(card);\n    const junkCount = junkPlan?.count ?? destroyJunkChoiceCount(card);\n    const mandatoryDiscard = mandatoryDiscardChoiceCount(card);\n    const junkSources = junkPlan?.sources ?? ["hand", "discard"];\n    const hasJunk = (junkSources.includes("hand") ? nextPlayer.hand : []).concat(junkSources.includes("discard") ? nextPlayer.discard : []).some((candidate) => isJunk(cardFor(candidate)));\n    let pendingChoice: PendingChoice | null = junkCount && hasJunk\n      ? { kind: "destroy-junk", sourceCardId: id, remaining: junkCount, sources: junkSources, optional: Boolean(junkPlan?.optional), drawAfterSuccess: junkPlan?.drawAfterSuccess ?? 0 }'''
          if old not in text: raise SystemExit('playSupport Junk choice construction anchor missing')
          text = text.replace(old, new, 1)

          old = '''    if (choice.kind === "destroy-junk") {\n      const sourceCards = source === "discard" ? current.player.discard : current.player.hand;\n      if (!sourceCards.includes(cardId) || !isJunk(selected)) return current;\n      const player = source === "hand"\n        ? { ...current.player, hand: removeOne(current.player.hand, cardId), destroyed: [...(current.player.destroyed ?? []), cardId] }\n        : { ...current.player, discard: removeOne(current.player.discard, cardId), destroyed: [...(current.player.destroyed ?? []), cardId] };\n      const remaining = choice.remaining - 1;\n      const junkRemains = [...player.hand, ...player.discard].some((id) => isJunk(cardFor(id)));\n      const pendingChoice = remaining > 0 && junkRemains ? { ...choice, remaining } : null;\n      return write(current, `${selected.name} destroyed from your ${source === "hand" ? "hand" : "discard pile"}.${pendingChoice ? ` Choose ${remaining} more Junk.` : " Choice resolved."}`, { player, pendingChoice });\n    }'''
          new = '''    if (choice.kind === "destroy-junk") {\n      const allowedSources = choice.sources ?? ["hand", "discard"];\n      if (!allowedSources.includes(source as "hand" | "discard")) return current;\n      const sourceCards = source === "discard" ? current.player.discard : current.player.hand;\n      if (!sourceCards.includes(cardId) || !isJunk(selected)) return current;\n      let player: Board = source === "hand"\n        ? { ...current.player, hand: removeOne(current.player.hand, cardId), destroyed: [...(current.player.destroyed ?? []), cardId] }\n        : { ...current.player, discard: removeOne(current.player.discard, cardId), destroyed: [...(current.player.destroyed ?? []), cardId] };\n      const remaining = choice.remaining - 1;\n      const availableJunk = (allowedSources.includes("hand") ? player.hand : []).concat(allowedSources.includes("discard") ? player.discard : []);\n      const junkRemains = availableJunk.some((id) => isJunk(cardFor(id)));\n      const pendingChoice = remaining > 0 && junkRemains ? { ...choice, remaining } : null;\n      if (!pendingChoice && (choice.drawAfterSuccess ?? 0) > 0) player = drawCards(player, choice.drawAfterSuccess ?? 0);\n      return write(current, `${selected.name} destroyed from your ${source === "hand" ? "hand" : "discard pile"}.${pendingChoice ? ` Choose ${remaining} more Junk.` : `${choice.drawAfterSuccess ? ` ${choice.drawAfterSuccess} card${choice.drawAfterSuccess === 1 ? "" : "s"} drawn by the structured follow-up.` : ""} Choice resolved.`}`, { player, pendingChoice });\n    }'''
          if old not in text: raise SystemExit('destroy-junk resolver block missing')
          text = text.replace(old, new, 1)

          old = '''    if (current.pendingChoice.kind === "discard-draw") return write(current, `${cardFor(current.pendingChoice.sourceCardId)?.name ?? "Optional effect"}: discard/draw declined.`, { pendingChoice: null });'''
          new = '''    if (current.pendingChoice.kind === "destroy-junk" && current.pendingChoice.optional) return write(current, `${cardFor(current.pendingChoice.sourceCardId)?.name ?? "Optional effect"}: Junk destruction declined.`, { pendingChoice: null });\n    if (current.pendingChoice.kind === "discard-draw") return write(current, `${cardFor(current.pendingChoice.sourceCardId)?.name ?? "Optional effect"}: discard/draw declined.`, { pendingChoice: null });'''
          if old not in text: raise SystemExit('skipPendingChoice anchor missing')
          text = text.replace(old, new, 1)

          old = '''  const pendingChoiceOptions = match.pendingChoice?.kind === "destroy-junk"\n    ? [\n        ...player.hand.map((id, index) => ({ id, source: "hand" as const, index })).filter((entry) => isJunk(cardFor(entry.id))),\n        ...player.discard.map((id, index) => ({ id, source: "discard" as const, index })).filter((entry) => isJunk(cardFor(entry.id))),\n      ]'''
          new = '''  const pendingChoiceOptions = match.pendingChoice?.kind === "destroy-junk"\n    ? [\n        ...((match.pendingChoice.sources ?? ["hand", "discard"]).includes("hand") ? player.hand.map((id, index) => ({ id, source: "hand" as const, index })).filter((entry) => isJunk(cardFor(entry.id))) : []),\n        ...((match.pendingChoice.sources ?? ["hand", "discard"]).includes("discard") ? player.discard.map((id, index) => ({ id, source: "discard" as const, index })).filter((entry) => isJunk(cardFor(entry.id))) : []),\n      ]'''
          if old not in text: raise SystemExit('pendingChoiceOptions Junk anchor missing')
          text = text.replace(old, new, 1)

          old = '  const effectChoiceCanSkip = match.pendingChoice?.kind === "prevent-combat-damage"'
          new = '  const effectChoiceCanSkip = (match.pendingChoice?.kind === "destroy-junk" && Boolean(match.pendingChoice.optional)) || match.pendingChoice?.kind === "prevent-combat-damage"'
          if old not in text: raise SystemExit('effectChoiceCanSkip anchor missing')
          playtest.write_text(text.replace(old, new, 1))

          tests = Path('tests/stage3c-defense-consumable-runtime.test.mjs')
          text = tests.read_text()
          text = text.replace('  structuredConsumableLifecycle,\n', '  structuredConsumableLifecycle,\n  structuredConsumableDestroyJunkPlan,\n', 1)
          old = '  opponentTargetCount: 2,\n  selectedEquipmentSubtype: "Gear",'
          new = '  opponentTargetCount: 2,\n  junkDestroyed: true,\n  selectedEquipmentSubtype: "Gear",'
          if old not in text: raise SystemExit('Stage 3C junkDestroyed test context anchor missing')
          text = text.replace(old, new, 1)
          anchor = '''test("single-opponent target selection auto-resolves in Quick Duel semantics", () => {'''
          regression = '''test("structured Junk choices preserve source, optionality, and contingent follow-up semantics", () => {\n  assert.deepEqual(structuredConsumableDestroyJunkPlan(card("DDB-CON-CORE-024")), {\n    resolver: "consumable.destroyJunkThenDrawTwo", count: 1, sources: ["hand", "discard"], optional: false, drawAfterSuccess: 2,\n  });\n  assert.deepEqual(structuredConsumableDestroyJunkPlan(card("DDB-CON-CORE-029")), {\n    resolver: "consumable.destroyJunkFromHand", count: 1, sources: ["hand"], optional: false, drawAfterSuccess: 0,\n  });\n  assert.deepEqual(structuredConsumableDestroyJunkPlan(card("DDB-CON-CORE-048")), {\n    resolver: "consumable.optionalDestroyJunkFromHand", count: 1, sources: ["hand"], optional: true, drawAfterSuccess: 0,\n  });\n  const giBeforeChoice = consumableRuntimeCommands(card("DDB-CON-CORE-024"), "onPlay", { ...consumableBaseContext, junkDestroyed: false });\n  assert.equal(giBeforeChoice.some((command) => command.effect === "core.draw"), false, "Fresh Martial Arts Gi must not draw before Junk is destroyed");\n  const giAfterChoice = consumableRuntimeCommands(card("DDB-CON-CORE-024"), "onPlay", { ...consumableBaseContext, junkDestroyed: true });\n  assert.equal(giAfterChoice.find((command) => command.effect === "core.draw")?.amount, 2);\n});\n\n'''
          if anchor not in text: raise SystemExit('Stage 3C Junk regression insertion anchor missing')
          tests.write_text(text.replace(anchor, regression + anchor, 1))
          PY
      - name: Remove one-shot workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-stage3c-junk-choice-remediation.yml
          git add app/consumable-effect-resolvers.ts app/effect-resolvers.ts app/playtest.tsx tests/stage3c-defense-consumable-runtime.test.mjs
          git diff --check
          git commit -m "fix: preserve structured Consumable Junk choice semantics"
          git push origin HEAD:stage3c-play-surface-remediation
