name: Stage 3B Attack Read-Only Validation

on:
  push:
    branches: [stage3b-attacks-effect-vocabulary]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate canonical registries
        run: npm run game:generate

      - name: Run full automated suite
        run: npm test

      - name: Build production site
        run: npm run build
